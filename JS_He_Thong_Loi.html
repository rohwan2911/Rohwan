  function extractOrderSortSeq(orderId) {
    var s = String(orderId || "").trim().toUpperCase();
    var m = s.match(/ORD-(\d{4})-(\d+)/);
    if (m) return (parseInt(m[1], 10) * 1000000) + parseInt(m[2], 10);
    var nums = s.match(/\d+/g);
    if (nums && nums.length > 0) return parseInt(nums[nums.length - 1], 10);
    return 999999999;
  }

    else if (tone === "info") cls = "bg-[#16977f] text-[#fff5d6] border-[#186635]";
    else if (tone === "warning") cls = "bg-[#f4d98a] text-[#07281c] border-[#186635]";
    else if (tone === "danger") cls = "bg-[#8c3b3b] text-[#fdf2f2] border-[#6e2b2b]";
    return '<span class="agri-badge px-2.5 py-0.5 rounded-md text-xs font-semibold border ' + cls + '">' + label + '</span>';
  }

    if (m) return Math.max(1, parseInt(m[1], 10) || 1);
    return Math.max(1, parseInt(fallbackRound || 1, 10) || 1);
  }

  function foldViText(str) {
    return String(str || "")
      .trim()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/đ/g, "d")
      .replace(/Đ/g, "D")
      .toLowerCase()
      .replace(/\s+/g, " ");
  }

  function isCancelledStatus(status) {
    var f = foldViText(status);
    if (!f) return false;
    return f === "cancelled" || f === "canceled" || f.indexOf("huy") !== -1 || f.indexOf("cancel") !== -1 || f.indexOf("tu choi") !== -1 || f.indexOf("reject") !== -1;
  }

  function isContractedStatus(status) {
    var f = foldViText(status);
    if (!f || isCancelledStatus(status)) return false;
    return f === "contracted" || f.indexOf("lap hop dong") !== -1 || f.indexOf("da ky hd") !== -1 || f.indexOf("da ky hop dong") !== -1;
  }

  function isConfirmedStatus(status) {
    var f = foldViText(status);
    if (!f || isCancelledStatus(status)) return false;
    if (f.indexOf("cho khach phan hoi") !== -1 || f.indexOf("cho phan hoi") !== -1) return false;
    return f === "confirmed" ||

      f.indexOf("khach da chot") !== -1 ||
      f.indexOf("da chot") !== -1 ||
      f.indexOf("buyer confirmed") !== -1 ||

  }

  function isSentWaitingCustomerStatus(status) {
    var f = foldViText(status);
    if (!f || isCancelledStatus(status) || isConfirmedStatus(status)) return false;
    return f === "quotation sent" ||

  function isQuotationSentStatus(status) {

  }

  function isRepriceRequestedStatus(status) {
    var f = foldViText(status);
    if (!f || isCancelledStatus(status)) return false;
    return f.indexOf("bao gia lai") !== -1 ||

  function isWaitingForPricingStatus(status) {

    if (!f) return true;
    if (isCancelledStatus(status) || isConfirmedStatus(status) || isSentWaitingCustomerStatus(status)) return false;

  function isPricedReadyOrDraftedStatus(status) {

  function normalizeWorkflowStatus(status) {
    var s = String(status || "").trim();
    var f = foldViText(s);
    if (!f || isCancelledStatus(s)) {
      return !f ? WORKFLOW_STATUS.NEW_WAITING : WORKFLOW_STATUS.CANCELLED;
    }
    if (isRepriceRequestedStatus(s)) {
      return /lần|lan\s*\d+/i.test(s) ? s : WORKFLOW_STATUS.REPRICE_REQUESTED;
    }
    if (isContractedStatus(s)) {
      return WORKFLOW_STATUS.CONTRACTED;
    }
    if (isConfirmedStatus(s)) {
      return WORKFLOW_STATUS.CONFIRMED;
    }
    if (isSentWaitingCustomerStatus(s)) {
      return /lần|lan\s*\d+/i.test(s) ? s : WORKFLOW_STATUS.QUOTATION_SENT;
    }
    if (isWaitingForPricingStatus(s)) {
      return WORKFLOW_STATUS.NEW_WAITING;
    }
    if (f.indexOf("da lap bao gia") !== -1) {
      return WORKFLOW_STATUS.QUOTATION_DRAFTED;
    }
    if (isPricedReadyOrDraftedStatus(s)) {
      return WORKFLOW_STATUS.PRICED_READY;
    }
    return s;

    if (!s) return WORKFLOW_5_STAGES[1];

      return WORKFLOW_5_STAGES[3];
    }
    if (/^3\s*[.:)\-\/]|^(?:moc|buoc|stage)\s*3\b/.test(f) || f.indexOf("booking") !== -1 || f.indexOf("dong cont") !== -1 || f.indexOf("in production") !== -1 || f.indexOf("dong hang") !== -1 || f.indexOf("chuan bi hang") !== -1 || f.indexOf("hun trung") !== -1 || f.indexOf("nhan coc") !== -1) {
      return WORKFLOW_5_STAGES[2];
    }
    if (/^2\s*[.:)\-\/]|^(?:moc|buoc|stage)\s*2\b/.test(f) || f.indexOf("nhap hop dong") !== -1 || f.indexOf("nhap hd") !== -1 || f.indexOf("cho ky") !== -1 || f.indexOf("ky hd") !== -1 || f.indexOf("ky hop dong") !== -1 || f.indexOf("dat coc") !== -1 || f.indexOf("mo l/c") !== -1 || f.indexOf("l/c") !== -1 || f.indexOf("da ky hd") !== -1 || f.indexOf("chuyen hd") !== -1 || f.indexOf("cho gui khach ky") !== -1 || f.indexOf("contract sent") !== -1 || f === "pending" || f.indexOf("deposit") !== -1) {

    return list.find(function (r) {
      var c = String(r["Code"] || "").trim().toLowerCase();
      var d = String(r["Display_Name_VIE"] || "").trim().toLowerCase();
      return (c && target.indexOf(c) !== -1) || (d && target.indexOf(d) !== -1);
    }) || null;
  }

  function getPricingRatesByCategory(category) {
    var catUpper = String(category || "").trim().toUpperCase();
    return (APP_DATA.pricingRates || []).filter(function (r) {
      return String(r["Fee_Category"] || "").trim().toUpperCase() === catUpper;
    });
  }

  function getEffectiveLocalCharges() {
    var prList = getPricingRatesByCategory("LOCAL_CHARGE");
    if (prList.length > 0) {
      return prList.map(function (r) {
        return {
          Charge_Code: r["Fee_Code"] || "",
          Charge_Name: r["Fee_Name_VIE"] || r["Fee_Code"] || "",
          Charge_Category: "Pricing_Rates",
          Unit: r["Unit_Basis"] || "Container",

          Applicable_ContType: r["Scope_or_ContType"] || "ALL",

        };

  function getEffectiveCustomsFees() {
    var prList = getPricingRatesByCategory("CUSTOMS_FEE");
    if (prList.length > 0) {
      return prList.map(function (r) {
        return {
          Service_Code: r["Fee_Code"] || "",
          Service_Name: r["Fee_Name_VIE"] || r["Fee_Code"] || "",
          Unit: r["Unit_Basis"] || "Lô hàng",
          Standard_Fee: toNum(r["Standard_Rate"]),
          Provider: r["Provider_or_Rule"] || "",
          Note: r["Note"] || ""
        };

  function getInsurancePlans() {
    var prList = getPricingRatesByCategory("INSURANCE");
    if (prList.length > 0) {
      return prList.map(function (r) {
        var rawRate = toNum(r["Standard_Rate"]);
        var pct = rawRate > 1 ? rawRate : (rawRate <= 0 ? 0 : (rawRate < 0.05 ? rawRate * 100 : rawRate));
        return {
          code: String(r["Fee_Code"] || "").trim(),
          name: String(r["Fee_Name_VIE"] || r["Fee_Code"] || "").trim(),
          ratePercent: pct,
          note: String(r["Note"] || "").trim()
        };
      });
    }
    return [
      { code: "INS-ICC-A", name: "Bảo hiểm mọi rủi ro (ICC A)", ratePercent: 0.25, note: "0.25% x 110% CIF" },
      { code: "INS-ICC-B", name: "Bảo hiểm tổn thất riêng (ICC B)", ratePercent: 0.18, note: "0.18% x 110% CIF" },
      { code: "INS-ICC-C", name: "Bảo hiểm điều kiện cơ bản (ICC C)", ratePercent: 0.12, note: "0.12% x 110% CIF" },
      { code: "INS-NONE", name: "Không mua bảo hiểm (FOB/CFR/EXW)", ratePercent: 0, note: "0%" }
    ];
  }

  function translateInquiryStatus(status) {

  function normalizeRole(dept) {
    var raw = String(dept || "")
      .trim()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/đ/g, "d")
      .replace(/Đ/g, "D")
      .toUpperCase();
    if (!raw) return "SALES";
    if (raw.indexOf("ADMIN") !== -1 || raw.indexOf("QUAN TRI") !== -1 || raw.indexOf("QUAN LY") !== -1 || raw.indexOf("GIAM DOC") !== -1 || raw.indexOf("MANAGER") !== -1) {
      return "ADMIN";
    }
    if (raw.indexOf("XNK") !== -1 || raw.indexOf("LOGISTIC") !== -1 || raw.indexOf("XUAT NHAP KHAU") !== -1 || raw.indexOf("CHUNG TU") !== -1 || raw.indexOf("CUOC") !== -1) {
      return "XNK";
    }
    if (raw.indexOf("SALE") !== -1 || raw.indexOf("KINH DOANH") !== -1 || raw === "KD" || raw.indexOf(" KD") !== -1 || raw.indexOf("KD ") !== -1) {
      return "SALES";
    }
    return "SALES";
  }

  function translateDepartment(dept) {
    var role = normalizeRole(dept);
    if (role === "SALES") return "Kinh doanh";
    if (role === "XNK") return "Xuất nhập khẩu";
    if (role === "ADMIN") return "Quản trị viên";
    return dept || "Kinh doanh";
  }

  function isRoleAllowedForNav(viewId) {

  function handleLogin(e) {
    e.preventDefault();
    var fullName = document.getElementById("login-fullname").value.trim();
    var empId = document.getElementById("login-empid").value.trim();
    var submitBtn = document.getElementById("login-submit-btn");

    setButtonLoading(submitBtn, true, "Đang đăng nhập...");
    startTopProgress();
    google.script.run
      .withSuccessHandler(function (res) {

        setButtonLoading(submitBtn, false);

          Swal.fire("Không thể đăng nhập", (res && res.message) || "Thông tin không hợp lệ.", "error");
          return;
        }
        CURRENT_USER = res.user;
        sessionStorage.setItem("nsx_user", JSON.stringify(CURRENT_USER));
        enterApp();
      })
      .withFailureHandler(function (err) {
        stopTopProgress();
        setButtonLoading(submitBtn, false);

  function enterApp() {
    document.getElementById("login-screen").classList.add("hidden");
    document.getElementById("app-shell").classList.remove("hidden");
    initBrandLogos();
    var role = normalizeRole(CURRENT_USER.Department);
    var headerDeptName = role === "XNK" ? "Phòng XNK" : (role === "SALES" ? "Phòng Sales" : "Phòng Quản trị");
    var sidebarDeptLabel = translateDepartment(CURRENT_USER.Department) + " · Mã " + CURRENT_USER.Employee_ID;

    if (hdrMeta) hdrMeta.textContent = headerMetaLabel;

    ACTIVE_DASH_TAB = role === "XNK" ? "xnk" : "sales";

    var cached = readLocalAppCache();
    if (cached) {
      APP_DATA = normalizeAppDataBundle(cached);
      IS_APP_DATA_READY = true;
      try { populateDropdowns(); } catch (dropErr) {}
    } else {
      IS_APP_DATA_READY = false;
    }

    renderSidebarMenu();
    applyRoleBasedUI();
    applySidebarCollapsedState();
    switchTab("dashboard");

    if (cached) {
      renderAllViews();
    }
    setTimeout(function () { ensurePdfJsLoaded(); }, 2000);
    refreshAllData({ silent: true });

  function triggerLegacyImageResolutionIfNeeded() {
    if (LEGACY_IMAGES_RESOLVED_ONCE) return;
    var hasLegacy = (APP_DATA.products || []).some(function (p) {
      var raw = String(getProductProp(p, ["Image_URL", "Image URL", "Hình ảnh", "Ảnh sản phẩm", "Image", "Photo_URL"], ["image_url", "image", "hình ảnh", "ảnh"]) || "").trim();
      if (!raw) return false;
      if (/drive\.google\.com\//i.test(raw)) return true;
      return !/^(https?:\/\/|data:|\/)/i.test(raw);
    });
    if (!hasLegacy) return;
    LEGACY_IMAGES_RESOLVED_ONCE = true;
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.success && Array.isArray(res.products) && res.updatedCount > 0) {
          APP_DATA.products = res.products;
          writeLocalAppCache(APP_DATA);
          renderProductsTable();
        }
      })
      .withFailureHandler(function () {
        // Chạy ngầm không làm gián đoạn giao diện
      })
      .resolveLegacyProductImages();
  }

  function refreshAllData(opts) {
    if (!CURRENT_USER) return;
    var silent = opts && opts.silent;
    startTopProgress();
    google.script.run
      .withSuccessHandler(function (data) {
        stopTopProgress();
        if (!data) {
          if (!silent) showToast("error", "Dữ liệu trả về không hợp lệ.");
          return;
        }
        APP_DATA = normalizeAppDataBundle(data);
        IS_APP_DATA_READY = true;
        initBrandLogos();
        writeLocalAppCache(APP_DATA);
        try { populateDropdowns(); } catch (dropErr) {}
        renderAllViews();
        triggerLegacyImageResolutionIfNeeded();
      })
      .withFailureHandler(function (err) {
        stopTopProgress();
        if (!silent || !readLocalAppCache()) {
          Swal.fire("Lỗi tải dữ liệu", err.message || "Không thể đọc dữ liệu.", "error");
        }
      })
      .getInitialBundleData(CURRENT_USER.Department);
  }

  function renderActiveViewOnly(viewKey) {
    var key = viewKey || ACTIVE_VIEW_KEY || "dashboard";
    if (key === "dashboard") renderDashboard();
    else if (key === "sales-inquiry") renderInquiriesTable();
    else if (key === "sales-quotation") renderQuotationsTable();
    else if (key === "sales-customers") renderCustomersTable();
    else if (key === "xnk-pricing") { renderPricingProposalsTable(); filterPricingSchedules(); renderIncoterm3CriteriaMatches(); renderIncotermComparisonTable(); }
    else if (key === "xnk-contract") renderContractsTable();
    else if (key === "xnk-documents") renderDocumentsHub();
    else if (key === "xnk-shipping" || key === "cat-shipping") renderShippingTable();
    else if (key === "xnk-rates" || key === "cat-rates") renderPricingRatesTable();
    else if (key === "master-products" || key === "xnk-products" || key === "cat-products") renderProductsTable();
    else if (key === "admin-templates" || key === "xnk-templates" || key === "cat-templates") renderTemplatesTable();
    else if (key === "admin-users") renderUsersTable();
    else renderAllViews();
    if (typeof lucide !== "undefined") lucide.createIcons();
  }

  function refreshCurrentViewData() {
    if (!CURRENT_USER) return;
    var viewKey = ACTIVE_VIEW_KEY || "dashboard";
    startTopProgress();
    google.script.run
      .withSuccessHandler(function (res) {
        stopTopProgress();
        if (!res || res.success === false || !res.data) {
          showToast("error", "Không thể làm mới dữ liệu màn hình này.");
          return;
        }
        var partial = res.data;
        Object.keys(partial).forEach(function (k) {
          if (partial[k] !== undefined) APP_DATA[k] = partial[k];
        });
        APP_DATA = normalizeAppDataBundle(APP_DATA);
        IS_APP_DATA_READY = true;
        LAST_SYNC_AT = res.syncedAt || "";
        var syncEl = document.getElementById("header-sync-status");
        if (syncEl && LAST_SYNC_AT) syncEl.textContent = "Đã đồng bộ " + LAST_SYNC_AT;
        writeLocalAppCache(APP_DATA);
        try { populateDropdowns(); } catch (dropErr) {}
        applyRoleBasedUI();
        renderActiveViewOnly(viewKey);
        if (viewKey !== "dashboard") {
          try { renderDashboard(); } catch (dashErr) {}
        }
        showToast("success", "Đã làm mới dữ liệu màn hình hiện tại.");
      })
      .withFailureHandler(function (err) {
        stopTopProgress();
        showToast("error", (err && err.message) || "Lỗi làm mới dữ liệu.");
      })
      .getModuleBundleData(viewKey, CURRENT_USER.Department);
  }

  function switchTab(viewId) {
    if (viewId === "xnk-local" || viewId === "xnk-customs") {
      viewId = "xnk-rates";
    }
    var targetViewId = isRoleAllowedForNav(viewId) ? viewId : "dashboard";
    ACTIVE_VIEW_KEY = targetViewId;
    var views = document.querySelectorAll(".app-view");
    for (var i = 0; i < views.length; i++) {
      views[i].classList.add("hidden");
    }
    var target = document.getElementById("view-" + targetViewId);
    if (target) target.classList.remove("hidden");

    var mainContent = document.getElementById("main-content");
    if (mainContent) {
      mainContent.classList.toggle("mint-subpage", targetViewId !== "dashboard");
    }

    var navItems = document.querySelectorAll(".nav-item");
    for (var j = 0; j < navItems.length; j++) {
      var isCurrent = navItems[j].getAttribute("data-nav") === targetViewId;
      navItems[j].classList.toggle("nav-item-active", isCurrent);
      navItems[j].classList.toggle("text-white", isCurrent);
      navItems[j].classList.toggle("font-semibold", isCurrent);
      navItems[j].classList.toggle("text-teal-50/90", !isCurrent);
      if (isCurrent) {
        var labelEl = navItems[j].querySelector(".sidebar-label");
        var pageTitleText = labelEl ? labelEl.textContent.trim() : (navItems[j].getAttribute("data-tooltip") || navItems[j].innerText.trim());
        document.getElementById("header-page-title").textContent = pageTitleText;
      }
    }
    renderActiveViewOnly(targetViewId);
    toggleMobileSidebar(false);
    if (typeof window.closeSearchableComboPortal === "function") window.closeSearchableComboPortal();
    if (typeof window.refreshAllSearchableCombos === "function") window.refreshAllSearchableCombos();
    if (typeof lucide !== "undefined") lucide.createIcons();

  function populateDatalistOptions(elId, values) {
    var dl = document.getElementById(elId);

      var str = String(v || "").trim();
      if (str && uniq.indexOf(str) === -1) uniq.push(str);

  function populateDropdowns() {
    // 1. Consignee datalist (hiển thị Tên công ty để gõ hoặc chọn trực tiếp)
    var dl = document.getElementById("consignee-datalist");
    if (dl) {
      dl.innerHTML = "";
      (APP_DATA.consignees || []).forEach(function (c) {
        var name = c["Consignee_Name"] || "";
        if (!name) return;
        var opt = document.createElement("option");
        opt.value = name;
        opt.label = (c["Consignee_ID"] ? c["Consignee_ID"] + " · " : "") + (c["Country"] || "");
        dl.appendChild(opt);
      });
    }

    // 2. Payment Terms (ưu tiên System_Lookups category PAYMENT, tiếp theo Google Sheets dropdown, mặc định 8 chuẩn quốc tế gồm CAD)
    var lookupPayments = getLookupsByCategory("PAYMENT").map(function (r) {
      return String(r["Display_Name_VIE"] || r["Code"] || "").trim();
    }).filter(Boolean);
    var payList = lookupPayments.length > 0
      ? lookupPayments
      : getSheetDropdownList(
          ["Inquiry_Quotation", "Order_Master", "Consignee_Directory"],
          ["Phương thức thanh toán đề xuất", "Payment_Terms", "Điều khoản thanh toán"],
          DEFAULT_PAYMENT_TERMS
        );
    if (payList.length === 0) payList = DEFAULT_PAYMENT_TERMS;
    DEFAULT_PAYMENT_TERMS.forEach(function (d) {
      if (payList.indexOf(d) === -1) payList.push(d);
    });
    populateDatalistOptions("dl-payment-terms", payList);
    populateDatalistOptions("dl-countries", ["Netherlands", "Germany", "USA", "Japan", "South Korea", "China", "UAE", "Singapore", "United Kingdom", "Australia", "France", "Spain", "Thailand", "Malaysia"]
      .concat((APP_DATA.schedules || []).map(function (s) { return s["Country"]; }))
      .concat((APP_DATA.consignees || []).map(function (c) { return c["Country"]; })));
    populateDatalistOptions("dl-pr-category", ["PACKING", "CONTAINER", "LOCAL_CHARGE", "CUSTOMS_FEE", "INSURANCE"]
      .concat((APP_DATA.pricingRates || []).map(function (r) { return String(r["Fee_Category"] || "").trim().toUpperCase(); })));
    populateDatalistOptions("dl-pr-unit", ["Carton", "Pallet", "Container", "Lô hàng", "Tờ khai", "Bộ chứng từ", "B/L", "% CIF/CIP", "KGS"]
      .concat((APP_DATA.pricingRates || []).map(function (r) { return r["Unit_Basis"]; })));
    populateDatalistOptions("dl-pr-scope", ["ALL", "REEFER", "DRY", "20'GP", "40'GP", "20'RF", "40'RF", "20DC", "40DC"]
      .concat((APP_DATA.pricingRates || []).map(function (r) { return r["Scope_or_ContType"]; })));

    // 2a. Gói bảo hiểm từ Pricing_Rates
    var insSel = document.getElementById("calc-insurance-code");
    if (insSel) {
      var prevIns = insSel.value || "INS-ICC-A";
      var plans = getInsurancePlans();
      insSel.innerHTML = plans.map(function (pl) {
        return '<option value="' + pl.code.replace(/"/g, "&quot;") + '" data-rate="' + pl.ratePercent + '">' + pl.name + ' (' + pl.ratePercent + '%)</option>';
      }).join("");
      insSel.value = plans.some(function (p) { return p.code === prevIns; }) ? prevIns : (plans[0] ? plans[0].code : "INS-ICC-A");
    }

    // 2b. CO_FORM & Contract Template dropdowns inside modal-contract-form
    var coList = getLookupsByCategory("CO_FORM");
    var coSel = document.getElementById("ctr-co-form");
    if (coSel) {
      var prevCo = coSel.value;
      if (coList.length > 0) {
        coSel.innerHTML = coList.map(function (r) {
          var code = String(r["Code"] || r["Display_Name_VIE"] || "").trim();
          var label = String(r["Display_Name_VIE"] || code);
          return '<option value="' + code.replace(/"/g, "&quot;") + '">' + label + '</option>';
        }).join("");
      } else {
        coSel.innerHTML = ["Form B", "Form E", "Form D", "Form AJ", "Form AK", "EUR.1", "Form AANZ", "Form AI"].map(function (c) {
          return '<option value="' + c + '">' + c + '</option>';
        }).join("");
      }
      if (prevCo) coSel.value = prevCo;
    }
    var tplSel = document.getElementById("ctr-template-id");
    if (tplSel) {
      var prevTpl = tplSel.value;
      var ctrPool = getContractTemplatesPool();
      tplSel.innerHTML = '<option value="">-- Tự động chọn theo nhóm sản phẩm --</option>' +
        ctrPool.map(function (t) {
          var tid = String(t["Template ID"] || "").trim();
          var dname = String(t["Document_Name"] || tid);

    var lcUnitValues = getSheetDropdownList(["Local_Charges"], ["Unit"], ["Container", "Lô hàng", "B/L"])

    var cfUnitValues = getSheetDropdownList(["Customs_Service_Fees"], ["Unit"], ["Tờ khai", "Lô hàng", "Bộ chứng từ", "Container"])

    // 5. Shipping filters & Pricing Country <-> POD bidirectional filters

    var calcOrderSel = document.getElementById("calc-order-id");
    if (calcOrderSel) {
      var prevOrderId = calcOrderSel.value;
      calcOrderSel.innerHTML = '<option value="">-- Chọn mã đơn chờ tính giá --</option>';
      (APP_DATA.inquiries || [])
        .filter(function (inq) {
          return isWaitingForPricingStatus(getInquiryRawStatus(inq));

        .slice()

        .forEach(function (inq) {

      var el = document.getElementById(id);
      if (el && typeof window.syncSearchableCombo === "function") {
        window.syncSearchableCombo(el, true);

  function highlightComboOption(optionEl, containerEl) {
    if (!optionEl) return;
    var host = containerEl || optionEl.parentElement;
    if (!host) return;
    var items = host.querySelectorAll(".nsx-combo-option, .combo-option, .dropdown-item");
    var foundIdx = -1;
    for (var i = 0; i < items.length; i++) {
      var isTarget = items[i] === optionEl;
      if (isTarget) foundIdx = i;
      items[i].classList.toggle("is-highlighted", isTarget);
      items[i].classList.toggle("active", isTarget || items[i].classList.contains("is-selected"));
      if (isTarget) {
        items[i].setAttribute("data-active", "true");
      } else {
        items[i].removeAttribute("data-active");
      }
    }
    if (foundIdx >= 0 && typeof window.setActiveComboOption === "function" && host.id === "nsx-combo-portal") {
      window.setActiveComboOption(host, foundIdx, false);
    }
  }
  window.highlightComboOption = highlightComboOption;

  // =========================================================================
  // 1. RENDER 3D GLASSMORPHISM COCKPIT DASHBOARD (SALES & XNK + XEM CHÉO)
  // =========================================================================
  function switchDashboardTab(tab) {
    ACTIVE_DASH_TAB = tab === "xnk" ? "xnk" : "sales";
    renderDashboard();
  }

  function renderMiniProgressRow(label, countText, pct, barColorClass) {
    var clamped = Math.max(0, Math.min(100, Math.round(pct || 0)));
    return '<div>' +
      '<div class="flex items-center justify-between text-xs mb-1">' +
        '<span class="text-teal-100/90 font-medium truncate pr-2">' + label + '</span>' +
        '<span class="font-mono font-bold text-white shrink-0">' + countText + '</span>' +
      '</div>' +
      '<div class="h-2 rounded-full bg-white/10 overflow-hidden">' +
        '<div class="h-full rounded-full ' + barColorClass + '" style="width:' + clamped + '%"></div>' +
      '</div>' +
    '</div>';
  }

  function renderDashboard() {
    var role = CURRENT_USER ? normalizeRole(CURRENT_USER.Department) : "SALES";
    if (!ACTIVE_DASH_TAB) {
      ACTIVE_DASH_TAB = role === "XNK" ? "xnk" : "sales";
    }
    var activeTab = ACTIVE_DASH_TAB;
    var isCrossReadOnly = (role === "SALES" && activeTab === "xnk") || (role === "XNK" && activeTab === "sales");
    var isSalesViewingXnk = (role === "SALES" && activeTab === "xnk");
    var isXnkViewingSales = (role === "XNK" && activeTab === "sales");

    var btnSales = document.getElementById("btn-dash-tab-sales");
    var btnXnk = document.getElementById("btn-dash-tab-xnk");
    var activeCls = "px-4 py-2 text-xs font-bold rounded-xl transition-all flex items-center gap-1.5 whitespace-nowrap cursor-pointer bg-[#2f7d3e] text-[#fff5d6] border border-[#f4d98a] shadow-[0_3px_0_#07281c]";
    var idleCls = "px-4 py-2 text-xs font-bold rounded-xl transition-all flex items-center gap-1.5 whitespace-nowrap cursor-pointer text-[#d2ebe0] hover:text-[#fff5d6] hover:bg-[#0f4a33]";
    if (btnSales) btnSales.className = activeTab === "sales" ? activeCls : idleCls;
    if (btnXnk) btnXnk.className = activeTab === "xnk" ? activeCls : idleCls;

    var paneSales = document.getElementById("dash-pane-sales");
    var paneXnk = document.getElementById("dash-pane-xnk");
    if (paneSales) paneSales.classList.toggle("hidden", activeTab !== "sales");
    if (paneXnk) paneXnk.classList.toggle("hidden", activeTab !== "xnk");

    var crossBanner = document.getElementById("dash-cross-view-banner");
    if (crossBanner) crossBanner.classList.toggle("hidden", !isCrossReadOnly);

    if (!IS_APP_DATA_READY) {
      var hasMemoryData =
        (APP_DATA.inquiries && APP_DATA.inquiries.length > 0) ||
        (APP_DATA.orders && APP_DATA.orders.length > 0) ||
        (APP_DATA.proposals && APP_DATA.proposals.length > 0) ||
        (APP_DATA.schedules && APP_DATA.schedules.length > 0);
      if (hasMemoryData) {
        IS_APP_DATA_READY = true;
      } else {
        var lazyCached = CURRENT_USER ? readLocalAppCache() : null;
        if (lazyCached) {
          APP_DATA = normalizeAppDataBundle(lazyCached);
          IS_APP_DATA_READY = true;
        } else {
          return;
        }
      }
    }

    // Cách ly xem chéo tuyệt đối: Ẩn toàn bộ hành động và card nội bộ phòng ban không thuộc vai trò
    var salesActionsWrap = document.getElementById("dash-sales-actions-wrap");
    if (salesActionsWrap) salesActionsWrap.classList.toggle("hidden", isXnkViewingSales);

    var xnkChartsRow = document.getElementById("dash-xnk-charts-row");
    var xnkOpsSidebar = document.getElementById("dash-xnk-ops-sidebar");
    var xnkActionsWrap = document.getElementById("dash-xnk-actions-wrap");
    var xnkInternalTables = document.getElementById("dash-xnk-internal-tables");

    if (xnkChartsRow) xnkChartsRow.classList.toggle("hidden", isSalesViewingXnk);
    if (xnkOpsSidebar) xnkOpsSidebar.classList.toggle("hidden", isSalesViewingXnk);
    if (xnkActionsWrap) xnkActionsWrap.classList.toggle("hidden", isSalesViewingXnk);
    if (xnkInternalTables) xnkInternalTables.classList.toggle("hidden", isSalesViewingXnk);

    // Khóa nút còn lại nếu đang ở chế độ xem chéo
    var lockBtns = document.querySelectorAll("[data-cross-lock]");
    for (var b = 0; b < lockBtns.length; b++) {
      var targetPane = lockBtns[b].getAttribute("data-cross-lock");
      var shouldLock = isCrossReadOnly && targetPane === activeTab;
      lockBtns[b].disabled = shouldLock;
      lockBtns[b].classList.toggle("opacity-45", shouldLock);
      lockBtns[b].classList.toggle("pointer-events-none", shouldLock);
    }

    var inquiries = APP_DATA.inquiries || [];
    var proposals = APP_DATA.proposals || [];
    var orders = APP_DATA.orders || [];
    var schedules = APP_DATA.schedules || [];
    var consignees = APP_DATA.consignees || [];

    function isCompletedOrderRow(ord) {
      if (!ord) return false;
      var stRaw = getOrderRawStatus(ord);
      return getWorkflow5StageNumber(stRaw, true, isContractLockedFlag(ord)) >= 6 || translateFulfillmentStatus(stRaw) === COMPLETED_ORDER_STATUS;
    }

    var latestOrderByKey = {};
    orders.forEach(function (o) {
      var key = getRowOrderId(o).toUpperCase();
      if (!key) return;
      latestOrderByKey[key] = o;
    });
    var uniqueOrders = Object.keys(latestOrderByKey).map(function (k) { return latestOrderByKey[k]; });

    var completedOrderIdMap = {};
    uniqueOrders.forEach(function (o) {
      if (isCompletedOrderRow(o)) {
        completedOrderIdMap[getRowOrderId(o).toUpperCase()] = true;
      }
    });

    function renderKpiPopoverBox(targetId, title, items, emptyText, isScheduleMode) {
      var box = document.getElementById(targetId);
      if (!box) return;
      var safeItems = Array.isArray(items) ? items : [];
      var listHtml = safeItems.length === 0
        ? '<div class="px-3 py-3 text-xs text-[#d2ebe0]/75 text-center">' + escHtmlText(emptyText) + '</div>'
        : safeItems.map(function (item) {
            if (isScheduleMode) {
              return '<div class="px-3 py-2 border-b border-[#186635]/50 last:border-b-0 flex items-center justify-between gap-2 text-xs hover:bg-[#0f4a33] transition-colors">' +
                '<div class="min-w-0">' +
                  '<div class="font-mono font-bold text-[#f4d98a] truncate">' + escHtmlText(item.id) + '</div>' +
                  '<div class="text-[#d2ebe0] truncate">' + escHtmlText(item.sub) + '</div>' +
                '</div>' +
                '<span class="px-1.5 py-0.5 rounded bg-[#f4d98a] text-[#07281c] border border-[#186635] text-[10px] font-bold whitespace-nowrap">' + escHtmlText(item.badge) + '</span>' +
              '</div>';
            }
            var rawOid = String(item.orderId || "").trim();
            var safeOid = rawOid.replace(/\\/g, "\\\\").replace(/'/g, "\\'");
            return '<button type="button" onclick="event.stopPropagation();openOrderTimelineModal(\'' + safeOid + '\')" class="w-full text-left px-3 py-2 border-b border-[#186635]/50 last:border-b-0 hover:bg-[#0f4a33] transition-colors flex items-center justify-between gap-2 text-xs cursor-pointer">' +
              '<div class="min-w-0">' +
                '<div class="font-mono font-bold text-[#f4d98a] truncate">' + escHtmlText(rawOid) + '</div>' +
                '<div class="text-[#d2ebe0] truncate">' + escHtmlText(item.customer) + '</div>' +
              '</div>' +
              '<span class="px-1.5 py-0.5 rounded bg-[#16977f] text-[#fff5d6] border border-[#186635] text-[10px] font-semibold whitespace-nowrap shrink-0 max-w-[140px] truncate">' + escHtmlText(item.status) + '</span>' +
            '</button>';
          }).join("");
      box.innerHTML =
        '<div class="rounded-xl bg-[#07281c] text-[#fff5d6] shadow-2xl border-[1.5px] border-[#186635] overflow-hidden">' +
          '<div class="px-3 py-2 bg-[#0f4a33] border-b border-[#186635] text-[11px] font-bold text-[#f4d98a] flex items-center justify-between gap-2">' +
            '<span class="truncate">' + escHtmlText(title) + '</span>' +
            '<span class="font-mono shrink-0">' + fmtNumber(safeItems.length) + '</span>' +
          '</div>' +
          '<div class="max-h-60 overflow-y-auto">' + listHtml + '</div>' +
        '</div>';
    }

    function getCustomerNameForOrder(cusId) {
      var cid = String(cusId || "").trim();
      var cus = consignees.find(function (c) {
        return String(c["Consignee_ID"] || "").trim() === cid || String(c["Consignee_Name"] || "").trim() === cid;
      });
      return cus ? (cus["Consignee_Name"] || cid || "-") : (cid || "-");
    }

    // --- KPI & DATA PHÒNG KINH DOANH (SALES) - MỖI ORDER_ID CHỈ MANG 1 TRẠNG THÁI DUY NHẤT ---
    var latestInqByOrder = {};
    inquiries.forEach(function (inq) {
      var oidKey = getRowOrderId(inq).toUpperCase();
      if (!oidKey) return;
      latestInqByOrder[oidKey] = inq;
    });
    var uniqueInquiries = Object.keys(latestInqByOrder).map(function (k) { return latestInqByOrder[k]; });

    var latestPropByOrder = {};
    var activePropByOrder = {};
    proposals.forEach(function (p) {
      var oid = getRowOrderId(p).toUpperCase();
      if (!oid) return;
      var stFold = foldViText(p["Booking_Status"] || p["Status"] || "");
      var isSup = stFold.indexOf("superseded") !== -1 || stFold.indexOf("da thay the") !== -1;
      if (!latestPropByOrder[oid] || !isSup) {
        latestPropByOrder[oid] = p;
      }
      if (!isSup) {
        activePropByOrder[oid] = p;
      }
    });

    var salesWaitPricingList = [];
    var salesReadyToSendList = [];
    var salesSentWaitingList = [];
    var salesConfirmedPendingList = [];
    var activeInquiriesList = [];
    var handledSalesOrderKeys = {};

    uniqueInquiries.forEach(function (inq) {
      var oid = getRowOrderId(inq);
      var oidKey = oid.toUpperCase();
      if (!oidKey) return;
      handledSalesOrderKeys[oidKey] = true;

      var rawSt = getInquiryRawStatus(inq);
      if (isCancelledStatus(rawSt) || completedOrderIdMap[oidKey]) return;

      var matchedOrd = latestOrderByKey[oidKey];
      if (matchedOrd) {
        var ordRawSt = getOrderRawStatus(matchedOrd);
        if (isCancelledStatus(ordRawSt)) return;
        var ordLocked = isContractLockedFlag(matchedOrd);
        var ordStage = getWorkflow5StageNumber(ordRawSt, true, ordLocked);
        if (ordStage >= 6 || isCompletedOrderRow(matchedOrd)) return;
        if (!ordLocked && ordStage <= 2) {
          salesConfirmedPendingList.push({
            orderId: oid,
            customer: getCustomerNameForOrder(inq["Consignee_ID"] || matchedOrd["Consignee_ID"]),
            status: rawSt ? translateInquiryStatus(rawSt) : "Khách đã chốt · Chờ ký HĐ"
          });
        }
        return;
      }

      activeInquiriesList.push(inq);

      if (isConfirmedStatus(rawSt) || isContractedStatus(rawSt)) {
        salesConfirmedPendingList.push({
          orderId: oid,
          customer: getCustomerNameForOrder(inq["Consignee_ID"]),
          status: translateInquiryStatus(rawSt)
        });
      } else if (isSentWaitingCustomerStatus(rawSt)) {
        salesSentWaitingList.push({
          orderId: oid,
          customer: getCustomerNameForOrder(inq["Consignee_ID"]),
          status: translateInquiryStatus(rawSt)
        });
      } else if (isWaitingForPricingStatus(rawSt)) {
        salesWaitPricingList.push({
          orderId: oid,
          customer: getCustomerNameForOrder(inq["Consignee_ID"]),
          status: translateInquiryStatus(rawSt)
        });
      } else if (isPricedReadyOrDraftedStatus(rawSt) || Boolean(activePropByOrder[oidKey])) {
        var p = activePropByOrder[oidKey] || latestPropByOrder[oidKey];
        var priceVal = p ? (p["Final_Selling Price"] || p["Final_Selling_Price"]) : 0;
        var statusTxt = p ? ((p["Quotation_No"] || p["Price_Version"] || "V1") + " · " + fmtUSD(priceVal)) : translateInquiryStatus(rawSt);
        salesReadyToSendList.push({
          orderId: oid,
          customer: getCustomerNameForOrder(inq["Consignee_ID"]),
          status: statusTxt
        });
      } else {
        salesWaitPricingList.push({
          orderId: oid,
          customer: getCustomerNameForOrder(inq["Consignee_ID"]),
          status: translateInquiryStatus(rawSt) || WORKFLOW_STATUS.NEW_WAITING
        });
      }
    });

    uniqueOrders.forEach(function (ord) {
      var oid = getRowOrderId(ord);
      var oidKey = oid.toUpperCase();
      if (!oidKey || handledSalesOrderKeys[oidKey]) return;
      var ordRawSt = getOrderRawStatus(ord);
      if (isCancelledStatus(ordRawSt)) return;
      var ordLocked = isContractLockedFlag(ord);
      var ordStage = getWorkflow5StageNumber(ordRawSt, true, ordLocked);
      if (ordStage >= 6 || isCompletedOrderRow(ord)) return;
      if (!ordLocked && ordStage <= 2) {
        salesConfirmedPendingList.push({
          orderId: oid,
          customer: getCustomerNameForOrder(ord["Consignee_ID"]),
          status: translateFulfillmentStatus(ordRawSt)
        });
      }
    });

    var confirmedInq = uniqueInquiries.filter(function (i) {
      var oidKey = getRowOrderId(i).toUpperCase();
      var rawSt = getInquiryRawStatus(i);
      return isConfirmedStatus(rawSt) || isContractedStatus(rawSt) || Boolean(latestOrderByKey[oidKey]);
    }).length;

    var pipelineVal = 0;
    activeInquiriesList.forEach(function (i) {
      var oidKey = getRowOrderId(i).toUpperCase();
      var pr = activePropByOrder[oidKey] || latestPropByOrder[oidKey];
      if (pr) pipelineVal += toNum(pr["Final_Selling Price"] || pr["Final_Selling_Price"]);
    });

    var elInq = document.getElementById("kpi-inquiries");
    var elProp = document.getElementById("kpi-proposals");
    var elPending = document.getElementById("kpi-sales-pending");
    var elConfirmed = document.getElementById("kpi-sales-confirmed");
    var elPipeVal = document.getElementById("dash-sales-pipeline-val");
    if (elInq) elInq.textContent = fmtNumber(salesWaitPricingList.length);
    if (elProp) elProp.textContent = fmtNumber(salesReadyToSendList.length);
    if (elPending) elPending.textContent = fmtNumber(salesSentWaitingList.length);
    if (elConfirmed) elConfirmed.textContent = fmtNumber(salesConfirmedPendingList.length);
    if (elPipeVal) elPipeVal.textContent = fmtUSD(pipelineVal);

    renderKpiPopoverBox(
      "kpi-popover-sales-inquiries",
      "Yêu cầu mới / Chờ XNK tính giá",
      salesWaitPricingList.slice().reverse(),
      "Không có yêu cầu chờ XNK tính giá"
    );
    renderKpiPopoverBox(
      "kpi-popover-sales-proposals",
      "Đã có bảng giá / Chờ Sales gửi",
      salesReadyToSendList.slice().reverse(),
      "Không có bảng giá chờ gửi khách"
    );
    renderKpiPopoverBox(
      "kpi-popover-sales-pending",
      "Đã gửi khách / Chờ phản hồi",
      salesSentWaitingList.slice().reverse(),
      "Không có báo giá đang chờ khách phản hồi"
    );
    renderKpiPopoverBox(
      "kpi-popover-sales-confirmed",
      "Khách đã chốt / Chờ lập HĐ",
      salesConfirmedPendingList.slice().reverse(),
      "Không có đơn đã chốt chờ lập hợp đồng"
    );

    var pricedInqCount = uniqueInquiries.filter(function (i) {
      var oidKey = getRowOrderId(i).toUpperCase();
      return isPricedOrLaterStatus(getInquiryRawStatus(i)) || Boolean(activePropByOrder[oidKey]) || Boolean(latestOrderByKey[oidKey]);
    }).length;

    var salesBars = document.getElementById("dash-sales-mini-bars");
    if (salesBars) {
      var totalInqSafe = Math.max(1, uniqueInquiries.length);
      salesBars.innerHTML =
        renderMiniProgressRow("RFQ đã có phương án giá", fmtNumber(pricedInqCount) + "/" + fmtNumber(uniqueInquiries.length), (pricedInqCount / totalInqSafe) * 100, "bg-[#F4D06F]") +
        renderMiniProgressRow("Đơn hàng đã chốt thành công", fmtNumber(confirmedInq) + "/" + fmtNumber(uniqueInquiries.length), (confirmedInq / totalInqSafe) * 100, "bg-[#22C55E]");
    }

    function parseQuoteSentTimeMs(inqObj, propObj) {
      var note = String((inqObj && inqObj["Note"]) || "");
      var sentMatches = note.match(/\[(\d{4}-\d{2}-\d{2}(?:\s+\d{2}:\d{2})?)\]\s*Đã gửi Email/gi);
      var rawDt = "";
      if (sentMatches && sentMatches.length > 0) {
        var lastM = sentMatches[sentMatches.length - 1].match(/\[(\d{4}-\d{2}-\d{2}(?:\s+\d{2}:\d{2})?)\]/);
        if (lastM) rawDt = lastM[1];
      }
      if (!rawDt && propObj && propObj["Booking_Date"]) rawDt = String(propObj["Booking_Date"]);
      if (!rawDt && inqObj && inqObj["Timestamp"]) rawDt = String(inqObj["Timestamp"]);
      if (!rawDt) return NaN;
      var normDt = rawDt.trim().replace(" ", "T");
      if (/^\d{4}-\d{2}-\d{2}$/.test(normDt)) normDt += "T08:00:00";
      var ms = Date.parse(normDt);
      return isNaN(ms) ? Date.parse(rawDt) : ms;
    }

    var nowMs = Date.now();
    var overdueQuotes = activeInquiriesList
      .filter(function (inq) {
        var rawSt = getInquiryRawStatus(inq);
        if (!isSentWaitingCustomerStatus(rawSt)) return false;
        if (isConfirmedStatus(rawSt) || isContractedStatus(rawSt)) return false;
        var prop = latestPropByOrder[getRowOrderId(inq).toUpperCase()];
        var sentMs = parseQuoteSentTimeMs(inq, prop);
        return !isNaN(sentMs) && (nowMs - sentMs) > (72 * 3600 * 1000);
      })
      .map(function (inq) {
        var oid = getRowOrderId(inq);
        var prop = latestPropByOrder[oid.toUpperCase()];
        var sentMs = parseQuoteSentTimeMs(inq, prop);
        var overdueHours = Math.max(73, Math.floor((nowMs - sentMs) / (3600 * 1000)));
        return {
          orderId: oid,
          customer: getCustomerNameForOrder(inq["Consignee_ID"]),
          quotNo: (prop && prop["Quotation_No"]) || ("QT-" + oid),
          amount: prop ? toNum(prop["Final_Selling Price"] || prop["Final_Selling_Price"]) : 0,
          daysElapsed: Math.floor(overdueHours / 24),
          hoursRem: overdueHours % 24
        };
      })
      .sort(function (a, b) { return b.daysElapsed - a.daysElapsed || extractOrderSortSeq(a.orderId) - extractOrderSortSeq(b.orderId); });

    var overdueCntEl = document.getElementById("dash-sales-overdue-count");
    if (overdueCntEl) overdueCntEl.textContent = fmtNumber(overdueQuotes.length) + " quá hạn";
    var overdueListEl = document.getElementById("dash-sales-overdue-list");
    if (overdueListEl) {
      if (overdueQuotes.length === 0) {
        overdueListEl.innerHTML =
          '<div class="py-8 px-4 rounded-2xl bg-emerald-500/10 border border-emerald-400/25 text-center text-emerald-200">' +
            '<div class="font-semibold">Tất cả báo giá đã gửi đều đang trong thời hạn phản hồi (≤ 3 ngày)</div>' +
            '<div class="text-[11px] text-teal-200/75 mt-1">Không có báo giá quá hạn 72 giờ cần nhắc khách.</div>' +
          '</div>';
      } else {
        overdueListEl.innerHTML = overdueQuotes.map(function (item) {
          var safeOid = item.orderId.replace(/'/g, "\\'");
          return '<div class="p-3 rounded-xl bg-white/8 border border-amber-300/35 hover:border-[#F4D06F]/80 transition-colors flex flex-wrap items-center justify-between gap-2.5">' +
            '<div class="min-w-0 flex-1">' +
              '<div class="flex items-center gap-2 flex-wrap">' +
                '<button type="button" onclick="openOrderTimelineModal(\'' + safeOid + '\')" class="font-mono font-bold text-[#F4D06F] hover:underline cursor-pointer">' + escHtmlText(item.orderId) + '</button>' +
                '<span class="px-1.5 py-0.5 rounded bg-amber-400/20 border border-amber-300/50 text-amber-200 text-[10px] font-bold font-mono whitespace-nowrap">Quá ' + item.daysElapsed + ' ngày' + (item.hoursRem > 0 ? (' ' + item.hoursRem + 'g') : '') + '</span>' +
                (item.amount > 0 ? '<span class="font-mono text-emerald-300 font-semibold">' + fmtUSD(item.amount) + '</span>' : '') +
              '</div>' +
              '<div class="text-white font-medium truncate mt-0.5">' + escHtmlText(item.customer) + ' · <span class="text-teal-200/80 font-mono">' + escHtmlText(item.quotNo) + '</span></div>' +
            '</div>' +
            '<button type="button" data-cross-lock="sales" onclick="openQuotationPreviewModal(\'' + safeOid + '\')" ' +
              (isXnkViewingSales ? 'disabled ' : '') +
              'class="shrink-0 px-3 py-1.5 rounded-xl bg-[#F4D06F] hover:bg-amber-300 text-[#06241E] text-xs font-bold transition-colors flex items-center gap-1 cursor-pointer whitespace-nowrap' + (isXnkViewingSales ? ' opacity-45 pointer-events-none' : '') + '">' +
              '<span>Follow-up ngay</span>' +
            '</button>' +
          '</div>';
        }).join("");
      }
    }

    var latest = inquiries.slice(-5).reverse();
    var latBody = document.getElementById("dash-latest-inquiries-tbody");
    if (latBody) {
      if (latest.length === 0) {
        latBody.innerHTML = '<tr><td colspan="6" class="py-6 text-center text-teal-200/70">Chưa có yêu cầu báo giá nào.</td></tr>';
      } else {
        latBody.innerHTML = latest.map(function (inq) {
          var oid = getRowOrderId(inq);
          var st = getInquiryRawStatus(inq) || WORKFLOW_STATUS.NEW_WAITING;
          var prop = latestPropByOrder[oid.toUpperCase()];
          var sellAmt = prop ? (prop["Final_Selling Price"] || prop["Final_Selling_Price"]) : 0;
          var quoteAmt = prop ? fmtUSD(sellAmt) : '<span class="text-teal-200/60">Chờ tính</span>';
          return '<tr class="hover:bg-white/5 transition-colors">' +
            '<td>' +
              '<button type="button" onclick="openOrderTimelineModal(\'' + oid.replace(/'/g, "\\'") + '\')" class="font-mono font-bold text-[#F4D06F] hover:underline cursor-pointer text-left">' + escHtmlText(oid) + '</button>' +
            '</td>' +
            '<td class="font-medium text-white">' + escHtmlText(getCustomerNameForOrder(inq["Consignee_ID"])) + '</td>' +
            '<td class="text-xs text-[#F8FAFC]">' + formatOrderItemsSummaryHtml(inq, true) + '</td>' +
            '<td class="text-right font-mono tabular-nums">' + fmtNumber(inq["Net_Weight_KGs"]) + '</td>' +
            '<td class="text-right font-mono font-semibold text-emerald-300 tabular-nums">' + quoteAmt + '</td>' +
            '<td class="text-center">' + renderStatusBadge(translateInquiryStatus(st), getInquiryBadgeTone(st)) + '</td>' +
          '</tr>';
        }).join("");
      }
    }

    // --- KPI & DATA PHÒNG XNK & LOGISTICS (5 MỐC QUY TRÌNH CHUẨN, LOẠI TRỪ 6. HOÀN TẤT QUYẾT TOÁN) ---
    var stageBuckets = { 1: [], 2: [], 3: [], 4: [], 5: [] };
    var completedCount = 0;

    // Mốc 1 (Chờ báo giá RFQ) & đơn đã chốt chưa có dòng trên Order_Master -> Mốc 2
    uniqueInquiries.forEach(function (inq) {
      var oid = getRowOrderId(inq);
      var key = oid.toUpperCase();
      if (!oid || latestOrderByKey[key]) return;
      var rawSt = getInquiryRawStatus(inq);
      if (isCancelledStatus(rawSt)) return;
      if (isConfirmedStatus(rawSt) || isContractedStatus(rawSt)) {
        stageBuckets[2].push({
          orderId: oid,
          customer: getCustomerNameForOrder(inq["Consignee_ID"]),
          status: translateInquiryStatus(rawSt)
        });
        return;
      }
      if (!isKpi1WaitingQuotationStatus(rawSt)) return;
      var normSt = normalizeWorkflowStatus(rawSt);
      var prodSummary = formatOrderItemsSummaryText(inq);
      stageBuckets[1].push({
        orderId: oid,
        customer: getCustomerNameForOrder(inq["Consignee_ID"]) + (prodSummary && prodSummary !== "Chưa có sản phẩm" ? (" · " + prodSummary) : ""),
        status: normSt || WORKFLOW_5_STAGES[0]
      });
    });

    // Mốc 2 -> 5: Đơn hàng trên Order_Master (loại trừ "6. Hoàn tất quyết toán" và đơn đã hủy)
    uniqueOrders.forEach(function (o) {
      var oid = getRowOrderId(o);
      if (!oid) return;
      var ordRawSt = getOrderRawStatus(o);
      if (isCancelledStatus(ordRawSt)) return;
      var locked = isContractLockedFlag(o);
      var stNum = getWorkflow5StageNumber(ordRawSt, true, locked);
      if (stNum >= 6 || isCompletedOrderRow(o)) {
        completedCount++;
        return;
      }
      var bIdx = Math.max(2, Math.min(5, stNum));
      stageBuckets[bIdx].push({
        orderId: oid,
        customer: getCustomerNameForOrder(o["Consignee_ID"]),
        status: translateFulfillmentStatus(ordRawSt)
      });
    });

    var expiring = schedules.filter(function (s) {
      var d = Number(s["Days còn lại"]);
      return !isNaN(d) && d <= 7;
    });

    for (var stIdx = 1; stIdx <= 5; stIdx++) {
      var cntEl = document.getElementById("kpi-xnk-stage-" + stIdx);
      if (cntEl) cntEl.textContent = fmtNumber(stageBuckets[stIdx].length);
      renderKpiPopoverBox(
        "kpi-popover-xnk-stage-" + stIdx,
        WORKFLOW_5_STAGES[stIdx - 1],
        stageBuckets[stIdx].slice().reverse(),
        "Không có hồ sơ ở bước này"
      );
    }

    var xnkBars = document.getElementById("dash-xnk-mini-bars");
    if (xnkBars) {
      var totalTracked = Math.max(1, stageBuckets[1].length + uniqueOrders.length);
      var bookingPackCount = stageBuckets[2].length + stageBuckets[3].length;
      var docsStageCount = stageBuckets[4].length;
      var blAndDoneCount = stageBuckets[5].length + completedCount;
      xnkBars.innerHTML =
        renderMiniProgressRow("Hồ sơ HĐ, Cọc & Đóng Cont", fmtNumber(bookingPackCount) + "/" + fmtNumber(totalTracked), (bookingPackCount / totalTracked) * 100, "bg-[#F4D06F]") +
        renderMiniProgressRow("Đang làm chứng từ & Hải quan", fmtNumber(docsStageCount) + "/" + fmtNumber(totalTracked), (docsStageCount / totalTracked) * 100, "bg-[#16977f]") +
        renderMiniProgressRow("Chờ B/L & Quyết toán xong", fmtNumber(blAndDoneCount) + "/" + fmtNumber(totalTracked), (blAndDoneCount / totalTracked) * 100, "bg-[#22C55E]");
    }

    // Gộp toàn bộ đơn ĐANG XỬ LÝ (loại trừ đơn đã Hoàn tất quyết toán, sắp xếp tăng dần theo Order_ID)
    var selectableEntries = [];
    uniqueOrders.forEach(function (o) {
      var oid = getRowOrderId(o);
      if (!oid) return;
      var ordRawSt = getOrderRawStatus(o);
      if (isCancelledStatus(ordRawSt)) return;
      var locked = isContractLockedFlag(o);
      var stNum = getWorkflow5StageNumber(ordRawSt, true, locked);
      if (stNum >= 6 || isCompletedOrderRow(o)) return;
      selectableEntries.push({
        orderId: oid,
        customer: getCustomerNameForOrder(o["Consignee_ID"]),
        stageNum: stNum,
        completed: false,
        statusLabel: translateFulfillmentStatus(ordRawSt)
      });
    });
    stageBuckets[1].forEach(function (rfqEntry) {
      selectableEntries.push({
        orderId: rfqEntry.orderId,
        customer: rfqEntry.customer,
        stageNum: 1,
        completed: false,
        statusLabel: WORKFLOW_5_STAGES[0]
      });
    });
    selectableEntries.sort(function (a, b) {
      return extractOrderSortSeq(a.orderId) - extractOrderSortSeq(b.orderId);
    });

    var hasSelected = SELECTED_DASH_ORDER_ID && selectableEntries.some(function (e) {
      return e.orderId === SELECTED_DASH_ORDER_ID;
    });
    if (!hasSelected) {
      SELECTED_DASH_ORDER_ID = selectableEntries[0] ? selectableEntries[0].orderId : "";
    }

    var selOrderDrop = document.getElementById("dash-xnk-order-select");
    if (selOrderDrop) {
      if (selectableEntries.length === 0) {
        selOrderDrop.innerHTML = '<option value="">Không có đơn hàng đang xử lý</option>';
      } else {
        selOrderDrop.innerHTML = selectableEntries.map(function (entry) {
          var lbl = entry.orderId + ' — ' + entry.customer + ' (Mốc ' + entry.stageNum + '/5)';
          return '<option value="' + entry.orderId.replace(/"/g, "&quot;") + '">' + escHtmlText(lbl) + '</option>';
        }).join("");
        selOrderDrop.value = SELECTED_DASH_ORDER_ID;
      }
    }

    renderXnkProgressTableRows();

    var expBody = document.getElementById("dash-expiring-tbody");
    if (expBody) {
      if (expiring.length === 0) {
        expBody.innerHTML = '<tr><td colspan="6" class="py-6 text-center text-teal-200/70">Không có tuyến cước nào sắp hết hạn trong 7 ngày tới.</td></tr>';
      } else {
        expBody.innerHTML = expiring.map(function (s) {
          var d = Number(s["Days còn lại"]);
          var badge = renderStatusBadge(d <= 0 ? "Hết hạn (" + d + ")" : d + " ngày", d <= 3 ? "danger" : "warning");
          return '<tr class="hover:bg-white/5 transition-colors">' +
            '<td class="py-2.5 px-4 font-mono font-bold text-[#F4D06F]">' + escHtmlText(s["Schedule_ID"]) + '</td>' +
            '<td class="py-2.5 px-4">' + escHtmlText(s["POL"]) + '</td>' +
            '<td class="py-2.5 px-4 font-medium text-white">' + escHtmlText(s["POD"]) + '</td>' +
            '<td class="py-2.5 px-4">' + escHtmlText(s["Shipping_Line"]) + '</td>' +
            '<td class="py-2.5 px-4 font-mono text-teal-100/80">' + escHtmlText(s["Expiry_Date"]) + '</td>' +
            '<td class="py-2.5 px-4 text-right font-mono">' + badge + '</td>' +
          '</tr>';
        }).join("");
      }
    }

    var etdBody = document.getElementById("dash-xnk-etd-tbody");
    if (etdBody) {
      var upcomingSchedules = schedules.filter(function (s) {
        return Number(s["Days còn lại"]) > 0;
      }).slice().sort(function (a, b) {
        return String(a["ETD"] || "").localeCompare(String(b["ETD"] || ""));
      }).slice(0, 5);
      if (upcomingSchedules.length === 0) {
        etdBody.innerHTML = '<tr><td colspan="5" class="py-6 text-center text-teal-200/70">Chưa có lịch tàu còn hiệu lực.</td></tr>';
      } else {
        etdBody.innerHTML = upcomingSchedules.map(function (s) {
          return '<tr class="hover:bg-white/5 transition-colors">' +
            '<td class="py-2.5 px-4 font-mono font-bold text-emerald-300">' + escHtmlText(s["Schedule_ID"]) + '</td>' +
            '<td class="py-2.5 px-4 text-white font-medium">' + escHtmlText(s["POL"] || "-") + ' → ' + escHtmlText(s["POD"] || "-") + '</td>' +
            '<td class="py-2.5 px-4 text-xs text-teal-100/85">' + escHtmlText(s["Shipping_Line"] || "") + ' · ' + escHtmlText(s["Vessel"] || "-") + '</td>' +
            '<td class="py-2.5 px-4 font-mono text-[#F4D06F]">' + escHtmlText(s["ETD"] || "-") + '</td>' +
            '<td class="py-2.5 px-4 text-right font-mono font-semibold text-white">' + fmtUSD(s["Rate_40'RF"]) + '</td>' +
          '</tr>';
        }).join("");
      }
    }

    renderXnkSingleOrderMilestoneChart();
    if (typeof lucide !== "undefined") {
      try { lucide.createIcons(); } catch (e) {}
    }
  }



  function renderXnkProgressTableRows() {
    renderSelectedDashOrderDetailCard();
  }

  function renderSelectedDashOrderDetailCard() {
    var bodyEl = document.getElementById("dash-selected-order-detail-body");
    var badgeEl = document.getElementById("dash-selected-order-badge");
    if (!bodyEl) return;

    var orders = APP_DATA.orders || [];
    var consignees = APP_DATA.consignees || [];
    var inquiries = APP_DATA.inquiries || [];
    var proposals = APP_DATA.proposals || [];
    var schedules = APP_DATA.schedules || [];

    var selectedOrder = orders.find(function (o) {
      return String(o["Order_ID"] || "").trim() === SELECTED_DASH_ORDER_ID;
    }) || null;
    var selectedInq = inquiries.find(function (i) {
      return String(i["Order_ID"] || "").trim() === SELECTED_DASH_ORDER_ID;
    }) || null;

    if (!selectedOrder && !selectedInq) {
      if (orders.length > 0) selectedOrder = orders[orders.length - 1];
      else if (inquiries.length > 0) selectedInq = inquiries[inquiries.length - 1];
    }

    if (!selectedOrder && !selectedInq) {
      if (badgeEl) badgeEl.textContent = "Chưa có đơn hàng";
      bodyEl.innerHTML = '<div class="py-10 text-center text-teal-200/70">Chưa có hợp đồng hoặc yêu cầu báo giá nào để hiển thị chi tiết hồ sơ.</div>';
      return;
    }

    var oid = selectedOrder ? String(selectedOrder["Order_ID"] || "").trim() : String(selectedInq["Order_ID"] || "").trim();
    var inq = selectedInq || inquiries.find(function (i) { return String(i["Order_ID"] || "").trim() === oid; }) || null;
    var locked = selectedOrder ? isContractLockedFlag(selectedOrder) : false;
    var stageNum = selectedOrder
      ? getWorkflow5StageNumber(selectedOrder["Fulfillment_Status"], true, locked)
      : 1;
    var stLabel = selectedOrder
      ? translateFulfillmentStatus(selectedOrder["Fulfillment_Status"])
      : WORKFLOW_5_STAGES[0];
    if (badgeEl) {
      badgeEl.textContent = stageNum >= 6 ? ("6/5 · " + COMPLETED_ORDER_STATUS) : ("Mốc " + stageNum + "/5 · " + stLabel);
    }

    var cusId = (selectedOrder && selectedOrder["Consignee_ID"]) || (inq && inq["Consignee_ID"]) || "";
    var cus = consignees.find(function (c) { return c["Consignee_ID"] === cusId; });
    var cusName = cus ? cus["Consignee_Name"] : (cusId || "-");
    var cusCountry = cus && cus["Country"] ? cus["Country"] : "";

    var matchedProp = null;
    for (var p = proposals.length - 1; p >= 0; p--) {
      var pOid = String(proposals[p]["Order ID"] || proposals[p]["Order_ID"] || "").trim();
      if (pOid === oid) {
        if (!matchedProp) matchedProp = proposals[p];
        if (!isProposalSuperseded(proposals[p])) {
          matchedProp = proposals[p];
          break;
        }
      }
    }

    var matchedSch = null;
    if (matchedProp && matchedProp["Schedule_ID"]) {
      matchedSch = schedules.find(function (s) { return s["Schedule_ID"] === matchedProp["Schedule_ID"]; });
    }
    if (!matchedSch && selectedOrder) {
      matchedSch = schedules.find(function (s) {
        return String(s["POL"] || "").trim().toLowerCase() === String(selectedOrder["POL"] || "").trim().toLowerCase() &&
          String(s["POD"] || "").trim().toLowerCase() === String(selectedOrder["POD"] || "").trim().toLowerCase();
      });
    }

    var itemsList = inq
      ? parseOrderItems(inq)
      : [{ sku: selectedOrder["SKU_Code"], name: selectedOrder["SKU_Code"], weight: toNum(selectedOrder["NW_Confirmed_KGs"]), packingName: "" }];
    var usePal = Boolean(

  var DASH_MILESTONE_STATE = { stageNum: 0, pct: 0, hasOrder: false };

  function renderXnkSingleOrderMilestoneChart() {
    var svgHost = document.getElementById("chart-xnk-fulfillment-svg");
    var checklistEl = document.getElementById("dash-xnk-5stage-checklist");
    if (!svgHost || ACTIVE_DASH_TAB !== "xnk") return;
    var orders = APP_DATA.orders || [];
    var inquiries = APP_DATA.inquiries || [];
    var proposals = APP_DATA.proposals || [];
    var consignees = APP_DATA.consignees || [];

    var selectedOrder = orders.find(function (o) {
      return String(o["Order_ID"] || "").trim() === SELECTED_DASH_ORDER_ID;
    }) || null;
    var selectedInq = inquiries.find(function (i) {
      return String(i["Order_ID"] || "").trim() === SELECTED_DASH_ORDER_ID;
    }) || null;
    if (!selectedOrder && !selectedInq) {
      if (orders.length > 0) selectedOrder = orders[orders.length - 1];
      else if (inquiries.length > 0) selectedInq = inquiries[inquiries.length - 1];
    }

    var titleEl = document.getElementById("dash-xnk-chart-order-title");
    var subEl = document.getElementById("dash-xnk-chart-order-sub");
    var hasOrder = Boolean(selectedOrder || selectedInq);
    var stageNum = 0;
    var oid = "";

    if (hasOrder) {
      oid = selectedOrder ? String(selectedOrder["Order_ID"] || "").trim() : String(selectedInq["Order_ID"] || "").trim();
      var cusId = (selectedOrder && selectedOrder["Consignee_ID"]) || (selectedInq && selectedInq["Consignee_ID"]) || "";
      var cus = consignees.find(function (c) { return c["Consignee_ID"] === cusId; });
      var cusName = cus ? cus["Consignee_Name"] : (cusId || "-");
      if (selectedOrder) {
        var locked = isContractLockedFlag(selectedOrder);
        stageNum = getWorkflow5StageNumber(selectedOrder["Fulfillment_Status"], true, locked);
        var stLabel = translateFulfillmentStatus(selectedOrder["Fulfillment_Status"]);
        if (titleEl) titleEl.textContent = oid + " · " + cusName;
        if (subEl) subEl.textContent = (selectedOrder["Contract_No."] || "-") + " · " + (stageNum >= 6 ? COMPLETED_ORDER_STATUS : ("Mốc " + stageNum + "/5: " + stLabel));
      } else {
        stageNum = 1;
        var activeProp = proposals.slice().reverse().find(function (p) {
          return String(p["Order ID"] || p["Order_ID"] || "").trim() === oid && !isProposalSuperseded(p);
        });
        if (titleEl) titleEl.textContent = oid + " · " + cusName;
        if (subEl) subEl.textContent = WORKFLOW_5_STAGES[0] + (activeProp ? (" · " + fmtUSD(activeProp["Final_Selling Price"] || activeProp["Final_Selling_Price"])) : "");
      }
    } else {
      if (titleEl) titleEl.textContent = "Chưa có đơn hàng đang theo dõi";
      if (subEl) subEl.textContent = "1. RFQ → 5. Chờ B/L & Quyết toán";
    }

    var pct = !hasOrder ? 0 : (stageNum >= 6 ? 100 : Math.min(100, stageNum * 20));
    DASH_MILESTONE_STATE.stageNum = stageNum;
    DASH_MILESTONE_STATE.pct = pct;
    DASH_MILESTONE_STATE.hasOrder = hasOrder;

    if (checklistEl) {
      checklistEl.innerHTML = WORKFLOW_5_STAGES.map(function (label, idx) {
        var num = idx + 1;
        var isDone = hasOrder && (stageNum >= 6 || num < stageNum);
        var isCurrent = hasOrder && stageNum < 6 && num === stageNum;
        var rowCls = isCurrent
          ? "bg-[#F4D06F]/15 border-[#F4D06F]/70 text-white hover:bg-[#F4D06F]/25"
          : (isDone ? "bg-emerald-500/15 border-emerald-400/40 text-emerald-100 hover:bg-emerald-500/25" : "bg-white/5 border-white/10 text-teal-200/75 hover:bg-white/10");
        var iconHtml = isDone
          ? '<span class="w-5 h-5 rounded-full bg-emerald-400/25 text-emerald-300 flex items-center justify-center text-[11px] font-bold shrink-0">✓</span>'
          : (isCurrent
            ? '<span class="w-5 h-5 rounded-full bg-[#F4D06F] text-[#06241E] flex items-center justify-center text-[11px] font-extrabold shrink-0">' + num + '</span>'
            : '<span class="w-5 h-5 rounded-full border border-teal-200/35 text-teal-200/60 flex items-center justify-center text-[11px] font-bold shrink-0">' + num + '</span>');
        var rightTag = isDone
          ? '<span class="text-[10px] font-semibold text-emerald-300 shrink-0">Xong ↗</span>'
          : (isCurrent ? '<span class="text-[10px] font-bold text-[#F4D06F] shrink-0">Mở ↗</span>' : '<span class="text-[10px] text-teal-200/55 shrink-0">Xem ↗</span>');
        var safeOidClick = hasOrder ? String(oid).replace(/'/g, "\\'") : "";
        return '<button type="button" onclick="deepLinkToOrderStage(\'' + safeOidClick + '\', ' + num + ')" class="w-full text-left px-2.5 py-1.5 rounded-xl border flex items-center justify-between gap-2 text-[11px] transition-colors cursor-pointer ' + rowCls + '">' +
          '<div class="flex items-center gap-2 min-w-0">' + iconHtml + '<span class="truncate font-medium">' + escHtmlText(label) + '</span></div>' +
          rightTag +
        '</button>';
      }).join("");
    }

    var ringColor = pct >= 100 ? "#4ADE80" : (pct >= 60 ? "#2DD4BF" : "#FACC15");
    var radius = 54;
    var circ = 2 * Math.PI * radius;
    var offset = circ * (1 - pct / 100);
    var subTxt = !hasOrder
      ? "Chưa có ĐH"
      : (stageNum >= 6 ? "Hoàn tất 5/5" : ("Mốc " + stageNum + "/5"));

    svgHost.innerHTML =
      '<svg viewBox="0 0 140 140" class="w-36 h-36 drop-shadow-[0_6px_18px_rgba(0,0,0,0.35)]" role="img" aria-label="Tiến độ đơn hàng">' +
        '<circle cx="70" cy="70" r="' + radius + '" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="14" />' +
        '<circle cx="70" cy="70" r="' + radius + '" fill="none" stroke="' + ringColor + '" stroke-width="14" stroke-linecap="round" ' +
          'stroke-dasharray="' + circ.toFixed(2) + '" stroke-dashoffset="' + offset.toFixed(2) + '" transform="rotate(-90 70 70)" />' +
        '<text x="70" y="66" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-family="JetBrains Mono, monospace" font-weight="800" font-size="24">' + pct + '%</text>' +
        '<text x="70" y="88" text-anchor="middle" dominant-baseline="middle" fill="#F4D06F" font-family="DM Sans, sans-serif" font-weight="700" font-size="11">' + escHtmlText(subTxt) + '</text>' +
      '</svg>';
  }

  function handleSaveTemplate(e) {
    e.preventDefault();
    var formEl = e.target;
    var payload = {
      "Template ID": document.getElementById("tpl-id").value.trim(),
      Document_Name: document.getElementById("tpl-name").value.trim(),
      Google_Doc_File_ID: extractGoogleDocId(document.getElementById("tpl-doc-input").value),
      Target_Department: document.getElementById("tpl-dept").value,
      Status: document.getElementById("tpl-status").value
    };
    setButtonLoading(formEl, true, "Đang lưu...");
    startTopProgress();
    google.script.run
      .withSuccessHandler(function (res) {
        stopTopProgress();
        setButtonLoading(formEl, false);
        if (res && res.success === false) {
          Swal.fire("Chưa lưu được", res.message || "Vui lòng kiểm tra lại dữ liệu.", "warning");
          return;
        }
        closeModal("modal-template-form");
        showToast("success", "Đã cập nhật biểu mẫu chứng từ.");
        refreshAllData({ silent: true });
      })
      .withFailureHandler(function (err) {
        stopTopProgress();
        setButtonLoading(formEl, false);
        Swal.fire("Lỗi", err.message, "error");
      })
      .saveTemplateManagerItem(payload);
  }

    startTopProgress();
    google.script.run
      .withSuccessHandler(function (res) {
        stopTopProgress();
        setButtonLoading(formEl, false);
        if (!res.success) {
          Swal.fire("Không thành công", res.message, "warning");
          return;
        }
        formEl.reset();
        showToast("success", "Đã thêm tài khoản nhân viên mới.");
        refreshAllData({ silent: true });
      })
      .withFailureHandler(function (err) {
        stopTopProgress();
        setButtonLoading(formEl, false);
        Swal.fire("Lỗi", err.message, "error");
      })
      .createUserAccount(payload);
  }

  function handleUpdateUser(empId, updates) {
    startTopProgress();
    google.script.run
      .withSuccessHandler(function () {
        stopTopProgress();
        showToast("success", "Đã cập nhật phân quyền " + empId);
        refreshAllData({ silent: true });
      })
      .withFailureHandler(function (err) {
        stopTopProgress();
        Swal.fire("Lỗi", err.message, "error");
      })
      .updateUserAccount(empId, updates);
  }

</script>
