<style>
  :root {
    --workspace: #84b8a1;      /* nền chính main + header (header dùng #84b8a1f2) */
    --card: #547d59;           /* khung bảng, header bảng, toolbar bảng, Modal */
    --border: #186635;         /* MỌI viền khối/bảng/input: 1.5px–2px */
    --card-shadow-base: #124d28;
    --row-even: #9bccb8;       /* data row chẵn (2,4,6...) */
    --row-odd: #aed6c6;        /* data row lẻ (1,3,5...) */
    --row-hover: #2d583f;      /* hover tương phản cao nền xanh rừng đậm */
    --input: #aed6c6;
    --btn-soft: #9bccb8;
    --ink-main: #0b2418;       /* chữ chính trên workspace/input */
    --ink-sub: #1e4231;        /* chữ phụ trên workspace */
    --row-even-main: #071a11;
    --row-even-sub: #143626;
    --cream-title: #fff5d6;    /* tiêu đề trên nền #547d59 */
    --cream-text: #f4f8f5;     /* nhãn/label, text phụ trên #547d59 */
    --row-odd-main: #071a11;
    --row-odd-strong: #071a11;
    --row-odd-product: #0f4a33;
    --row-odd-sub: #143626;
    --disabled-bg: #7f9f90;
    --deep: #07281c;
    --forest: #0f4a33;
    --teal: #16977f;
    --leaf: #2f7d3e;
    --lime: #6aa63f;
    --sun: #f4d98a;            /* vàng logo: badge, vạch active, focus ring */
    --ink: #10291f;
    --mute: #5b7367;
    --line: #c2d4cc;
    --danger: #8c3b3b;
    --danger-border: #6e2b2b;
    --danger-hover: #7a2e2e;
    --danger-text: #fdf2f2;
    --spring-ease: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* =========================================================================
   * 1. TYPOGRAPHY & WORKSPACE BASE
   * ========================================================================= */
  html, body {
    font-family: "Be Vietnam Pro", 'Segoe UI', system-ui, sans-serif;
    background-color: var(--workspace) !important;
    color: var(--ink-main);
  }
  h1, h2, h3, h4, .font-display {
    font-family: "Be Vietnam Pro", 'Segoe UI', system-ui, sans-serif;
  }
  .font-mono, .tabular-nums, code {
    font-family: ui-monospace, Consolas, monospace !important;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  #app-shell,
  #main-content,
  .mint-subpage {
    background: var(--workspace) !important;
    color: var(--ink-main);
  }
  .mint-subpage {
    min-height: calc(100vh - 64px);
  }

  /* Page Section Titles on #84b8a1 workspace */
  #main-content section:not(#view-dashboard) > div > div > h2,
  #main-content section:not(#view-dashboard) > div > h2 {
    color: var(--deep) !important;
    font-weight: 800;
    letter-spacing: -0.015em;
  }

  /* =========================================================================
   * 2. LOGIN SCREEN (DEEP FOREST GREEN + THICK-EDGE CARD, ZERO #FFF)
   * ========================================================================= */
  .login-emerald-bg {
    background:
      radial-gradient(circle at 18% 20%, rgba(22, 151, 127, 0.24) 0%, transparent 45%),
      radial-gradient(circle at 82% 80%, rgba(244, 217, 138, 0.16) 0%, transparent 45%),
      linear-gradient(155deg, var(--deep) 0%, var(--forest) 55%, var(--deep) 100%) !important;
  }
  .login-glass-card {
    background: var(--card) !important;
    border: 2px solid var(--border) !important;
    border-radius: 20px;
    color: var(--cream-text);
    box-shadow:
      0 6px 0 var(--card-shadow-base),
      0 22px 48px rgba(7, 40, 28, 0.55) !important;
  }
  .login-glass-card h1,
  .login-glass-card h2 {
    color: var(--cream-title) !important;
  }
  .login-glass-card label {
    color: var(--cream-text) !important;
  }

  /* =========================================================================
   * 3. SIDEBAR (DEEP FOREST GREEN, COLLAPSIBLE 260px <-> 76px)
   * ========================================================================= */
  #app-sidebar {
    width: 260px;
    background: linear-gradient(180deg, var(--forest) 0%, var(--deep) 78%) !important;
    border-right: 2px solid var(--border);
    box-shadow: 4px 0 24px rgba(7, 40, 28, 0.34);
    transition: width 0.24s var(--spring-ease), transform 0.22s ease;
  }
  #app-sidebar.is-collapsed {
    width: 76px;
    overflow: visible;
  }
  #app-sidebar.is-collapsed .sidebar-brand-text,
  #app-sidebar.is-collapsed .sidebar-group-title,
  #app-sidebar.is-collapsed .sidebar-label,
  #app-sidebar.is-collapsed .sidebar-user-details {
    display: none !important;
  }
  #app-sidebar.is-collapsed .sidebar-header-row {
    justify-content: center;
    padding-left: 0.75rem;
    padding-right: 0.75rem;
    flex-direction: column;
    gap: 0.5rem;
  }
  #app-sidebar.is-collapsed .sidebar-footer-row {
    justify-content: center;
  }
  #app-sidebar.is-collapsed .nav-item {
    justify-content: center;
    padding-left: 0.5rem;
    padding-right: 0.5rem;
    position: relative;
  }
  #app-sidebar.is-collapsed .nav-item[data-tooltip]:hover::after {
    content: attr(data-tooltip);
    position: absolute;
    left: calc(100% + 10px);
    top: 50%;
    transform: translateY(-50%);
    background: var(--deep);
    color: var(--cream-title);
    border: 2px solid var(--border);
    padding: 6px 12px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    z-index: 60;
    box-shadow: 0 3px 0 #041911, 0 12px 24px rgba(7, 40, 28, 0.55);
    pointer-events: none;
  }
  #app-sidebar .nav-item {
    color: var(--cream-text);
    border: 1.5px solid transparent;
    transition: transform 0.22s var(--spring-ease), background-color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  #app-sidebar .nav-item:hover {
    background-color: rgba(47, 125, 62, 0.45) !important;
    color: var(--cream-title) !important;
    border-color: rgba(244, 217, 138, 0.35);
    transform: translateY(-2px);
  }
  .nav-item-active {
    background-color: var(--leaf) !important;
    color: var(--cream-title) !important;
    font-weight: 700 !important;
    border: 1.5px solid var(--border) !important;
    box-shadow: inset 4px 0 0 var(--sun), 0 3px 0 #041911, 0 8px 16px rgba(7, 40, 28, 0.4) !important;
  }

  /* =========================================================================
   * 4. TOP HEADER (#84b8a1f2)
   * ========================================================================= */
  #app-top-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    background-color: #84b8a1f2 !important;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 2px solid var(--border) !important;
    box-shadow: 0 3px 0 var(--card-shadow-base), 0 8px 20px rgba(7, 40, 28, 0.18) !important;
    color: var(--ink-main);
  }
  #app-top-header .header-left-cluster,
  #app-top-header .header-brand-group,
  #app-top-header .header-brand-text,
  #app-top-header .header-brand-breadcrumb {
    flex-shrink: 0;
    min-width: max-content;
    white-space: nowrap;
  }
  #app-top-header .header-right-cluster {
    margin-left: auto;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    min-width: 0;
    flex: 1 1 auto;
  }
  #app-top-header .header-search-wrap {
    flex: 1 1 200px;
    min-width: 120px;
    max-width: 260px;
  }
  #header-logo-box {
    background-color: var(--btn-soft) !important;
    border: 1.5px solid var(--border) !important;
  }

  /* =========================================================================
   * 5. DASHBOARD COCKPIT (DEEP FOREST GREEN HERO & KPI — ZERO 3D TILT/PERSPECTIVE)
   * ========================================================================= */
  .dash-cockpit {
    position: relative;
    overflow: visible;
    border-radius: 22px;
    background: linear-gradient(155deg, var(--forest) 0%, var(--deep) 70%) !important;
    border: 2px solid var(--border) !important;
    box-shadow:
      0 6px 0 #041911,
      0 20px 44px rgba(7, 40, 28, 0.45) !important;
    color: var(--cream-text);
  }
  .dash-orb {
    position: absolute;
    border-radius: 9999px;
    filter: blur(78px);
    pointer-events: none;
    opacity: 0.28;
  }
  .glass-cockpit-stage {
    /* Strictly flat stage — NO perspective, NO 3D tilt */
    position: relative;
  }
  .glass-card-3d {
    background: linear-gradient(180deg, rgba(15, 74, 51, 0.94) 0%, rgba(7, 40, 28, 0.98) 100%) !important;
    border-radius: 16px;
    border: 2px solid var(--border) !important;
    box-shadow:
      0 5px 0 #041911,
      0 14px 28px rgba(4, 25, 17, 0.45) !important;
    transition: transform 0.24s var(--spring-ease), box-shadow 0.24s ease, border-color 0.2s ease;
  }
  .glass-card-3d:hover {
    transform: translateY(-4px);
    border-color: var(--sun) !important;
    box-shadow:
      0 8px 0 #041911,
      0 20px 36px rgba(4, 25, 17, 0.58) !important;
  }
  .glass-card-3d.glass-gold-glow {
    border-color: rgba(244, 217, 138, 0.65) !important;
  }
  .glass-card-3d.glass-gold-glow:hover {
    border-color: var(--sun) !important;
    box-shadow:
      0 8px 0 #041911,
      0 20px 36px rgba(4, 25, 17, 0.62) !important;
  }

  /* =========================================================================
   * 5B. MULTI-COLOR JEWEL KPI CARDS & SPRING BOUNCE ELEVATION (.kpi / .mks)
   * ========================================================================= */
  .kpi,
  .glass-card-3d.kpi,
  [data-kpi-card],
  .mks .kpi {
    border-radius: 16px;
    box-shadow:
      0 6px 0 rgba(4, 18, 12, 0.85),
      0 18px 28px -12px rgba(0, 0, 0, 0.75),
      inset 0 1px 0 rgba(255, 255, 255, 0.25) !important;
    transition:
      transform 0.5s cubic-bezier(0.3, 2.4, 0.5, 1),
      box-shadow 0.5s cubic-bezier(0.3, 2.4, 0.5, 1),
      border-color 0.25s ease !important;
    will-change: transform, box-shadow;
  }
  .kpi:nth-child(1),
  .mks .kpi:nth-child(1),
  [data-kpi-card="sales-1"],
  [data-kpi-card="xnk-1"] {
    background: linear-gradient(150deg, #1d6b52, #0f4232 75%) !important;
    border: 1.5px solid #48b892 !important;
  }
  .kpi:nth-child(2),
  .mks .kpi:nth-child(2),
  [data-kpi-card="sales-2"],
  [data-kpi-card="xnk-2"] {
    background: linear-gradient(150deg, #6e6224, #423a14 75%) !important;
    border: 1.5px solid #d6b85a !important;
  }
  .kpi:nth-child(3),
  .mks .kpi:nth-child(3),
  [data-kpi-card="sales-3"],
  [data-kpi-card="xnk-3"] {
    background: linear-gradient(150deg, #733030, #471c1c 75%) !important;
    border: 1.5px solid #d97777 !important;
  }
  .kpi:nth-child(4),
  .mks .kpi:nth-child(4),
  [data-kpi-card="sales-4"],
  [data-kpi-card="xnk-4"] {
    background: linear-gradient(150deg, #2f466b, #1d2b45 75%) !important;
    border: 1.5px solid #7ca1d9 !important;
  }
  .kpi:nth-child(5),
  .mks .kpi:nth-child(5),
  [data-kpi-card="xnk-5"] {
    background: linear-gradient(150deg, #523569, #311f40 75%) !important;
    border: 1.5px solid #b088d4 !important;
  }
  .kpi:nth-child(6),
  .mks .kpi:nth-child(6),
  [data-kpi-card="xnk-6"] {
    background: linear-gradient(150deg, #1b5e63, #0f383b 75%) !important;
    border: 1.5px solid #5bc2c9 !important;
  }

  .kpi:hover,
  .kpi:focus-visible,
  .glass-card-3d.kpi:hover,
  .glass-card-3d.kpi:focus-visible,
  [data-kpi-card]:hover,
  [data-kpi-card]:focus-visible,
  .mks .kpi:hover,
  .mks .kpi:focus-visible {
    transform: translateY(-12px) !important;
    box-shadow:
      0 14px 0 rgba(4, 18, 12, 0.85),
      0 32px 38px -14px rgba(0, 0, 0, 0.85),
      inset 0 1px 0 rgba(255, 255, 255, 0.45) !important;
  }
  .kpi:nth-child(1):hover,
  .kpi:nth-child(1):focus-visible,
  [data-kpi-card="sales-1"]:hover,
  [data-kpi-card="xnk-1"]:hover {
    border-color: #72dfb9 !important;
  }
  .kpi:nth-child(2):hover,
  .kpi:nth-child(2):focus-visible,
  [data-kpi-card="sales-2"]:hover,
  [data-kpi-card="xnk-2"]:hover {
    border-color: #f0d77d !important;
  }
  .kpi:nth-child(3):hover,
  .kpi:nth-child(3):focus-visible,
  [data-kpi-card="sales-3"]:hover,
  [data-kpi-card="xnk-3"]:hover {
    border-color: #f29d9d !important;
  }
  .kpi:nth-child(4):hover,
  .kpi:nth-child(4):focus-visible,
  [data-kpi-card="sales-4"]:hover,
  [data-kpi-card="xnk-4"]:hover {
    border-color: #a6c5f2 !important;
  }
  .kpi:nth-child(5):hover,
  .kpi:nth-child(5):focus-visible,
  [data-kpi-card="xnk-5"]:hover {
    border-color: #ceaef0 !important;
  }
  .kpi:nth-child(6):hover,
  .kpi:nth-child(6):focus-visible,
  [data-kpi-card="xnk-6"]:hover {
    border-color: #88e0e6 !important;
  }

  .kpi:active,
  .glass-card-3d.kpi:active,
  [data-kpi-card]:active,
  .mks .kpi:active {
    transform: translateY(3px) !important;
    transition-duration: 0.12s !important;
  }

  /* =========================================================================
   * 5C. DASHBOARD KPI DROPDOWN POPOVERS (80% OPACITY FROSTED GLASS)
   * ========================================================================= */
  .pop-l,
  [id^="kpi-popover-"] > div {
    background: rgba(15, 58, 46, 0.80) !important;
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
    border: 1.5px solid rgba(114, 223, 185, 0.45) !important;
    box-shadow:
      0 6px 0 rgba(4, 18, 12, 0.72),
      0 18px 34px rgba(4, 25, 17, 0.58) !important;
  }
  .pop-l .h,
  [id^="kpi-popover-"] > div > div:first-child {
    background: rgba(13, 61, 48, 0.80) !important;
    border-bottom: 1px solid rgba(114, 223, 185, 0.35) !important;
  }

  /* Dashboard table header inside Deep Forest cards */
  .dash-cockpit .agri-table.thead-dark thead th {
    background-color: var(--deep) !important;
    color: var(--sun) !important;
    border-bottom: 2px solid var(--border) !important;
    box-shadow: none !important;
  }

  /* =========================================================================
   * 6. WORKSPACE CARDS, TOOLBARS & SUB-PANELS (#547d59 + THICK BOTTOM EDGE)
   * ========================================================================= */
  .mint-card,
  .mint-amber-card,
  .mint-subpage .mint-card,
  .mint-subpage .mint-amber-card,
  .mint-subpage > section:not(#view-dashboard) > .bg-white {
    background: var(--card) !important;
    border: 2px solid var(--border) !important;
    border-radius: 16px;
    color: var(--cream-text);
    box-shadow:
      0 5px 0 var(--card-shadow-base),
      0 14px 28px rgba(7, 40, 28, 0.28) !important;
    transition: transform 0.24s var(--spring-ease), box-shadow 0.24s ease;
  }
  .mint-card:hover,
  .mint-amber-card:hover,
  .mint-subpage .mint-card:hover,
  .mint-subpage .mint-amber-card:hover {
    transform: translateY(-2px);
    box-shadow:
      0 7px 0 var(--card-shadow-base),
      0 18px 34px rgba(7, 40, 28, 0.34) !important;
  }
  .card-header-3d,
  .mint-subpage .card-header-3d {
    background: linear-gradient(180deg, var(--forest) 0%, #0b3c29 100%) !important;
    color: var(--cream-title) !important;
    font-weight: 700;
    border-top-left-radius: 14px;
    border-top-right-radius: 14px;
    border-bottom: 2px solid var(--border) !important;
  }
  .card-header-3d h3,
  .card-header-3d h4 {
    color: var(--cream-title) !important;
  }

  /* Card bodies & inner toolbars inside #547d59 cards */
  section:not(#view-dashboard) .mint-card > div:not(.card-header-3d):not(.agri-table-scroll):not(.agri-table-scroll-compact),
  section:not(#view-dashboard) .mint-card > form,
  section:not(#view-dashboard) .mint-amber-card > div:not(.card-header-3d):not(.agri-table-scroll):not(.agri-table-scroll-compact) {
    background-color: var(--card) !important;
    color: var(--cream-text);
  }
  section:not(#view-dashboard) .mint-card label,
  section:not(#view-dashboard) .mint-amber-card label {
    color: var(--cream-text);
  }
  section:not(#view-dashboard) .mint-card h4,
  section:not(#view-dashboard) .mint-amber-card h4 {
    color: var(--cream-title);
  }

  /* Sub-panels inside #547d59 cards (Container Mix, AI Advisory, Filter boxes, Section 4 columns) -> #9bccb8 surface with dark ink */
  section:not(#view-dashboard) .mint-card .rounded-xl.bg-white,
  section:not(#view-dashboard) .mint-card .rounded-2xl.bg-white,
  section:not(#view-dashboard) .mint-card .bg-\[\#F6FBF8\],
  section:not(#view-dashboard) .mint-card .bg-\[\#F8FAFC\],
  section:not(#view-dashboard) .mint-card .bg-\[\#ECFDF5\],
  section:not(#view-dashboard) .mint-card .bg-\[\#ECFDF5\]\/80,
  section:not(#view-dashboard) .mint-card .sub-panel-mint,
  section:not(#view-dashboard) .mint-amber-card .rounded-xl.bg-white,
  section:not(#view-dashboard) .mint-amber-card .rounded-2xl.bg-white {
    background-color: var(--row-even) !important;
    border: 1.5px solid var(--border) !important;
    color: var(--ink-main) !important;
    box-shadow: 0 3px 0 var(--card-shadow-base);
  }
  /* Ensure labels & headings inside #9bccb8 sub-panels use dark ink */
  section:not(#view-dashboard) .mint-card .rounded-xl.bg-white label,
  section:not(#view-dashboard) .mint-card .rounded-2xl.bg-white label,
  section:not(#view-dashboard) .mint-card .sub-panel-mint label,
  section:not(#view-dashboard) .mint-card .rounded-xl.bg-white h4,
  section:not(#view-dashboard) .mint-card .rounded-2xl.bg-white h4,
  section:not(#view-dashboard) .mint-card .sub-panel-mint h4 {
    color: var(--ink-main) !important;
  }
  /* Nested tile boxes inside Container Mix */
  section:not(#view-dashboard) .mint-card .rounded-2xl.bg-white .bg-\[\#F6FBF8\],
  section:not(#view-dashboard) .mint-card .sub-panel-mint .sub-tile-mint {
    background-color: var(--workspace) !important;
    border: 1.5px solid var(--border) !important;
    color: var(--ink-main) !important;
    box-shadow: 0 2px 0 var(--card-shadow-base);
  }
  /* Ensure direct body wrapper div stays --card (#547d59), not --row-even */
  section:not(#view-dashboard) .mint-card > div.bg-\[\#F6FBF8\]:not(.card-header-3d):not(.agri-table-scroll):not(.agri-table-scroll-compact),
  section:not(#view-dashboard) .mint-card > form.bg-\[\#F6FBF8\],
  section:not(#view-dashboard) .mint-amber-card > div.bg-\[\#F6FBF8\] {
    background-color: var(--card) !important;
    border: none !important;
    box-shadow: none !important;
    color: var(--cream-text) !important;
  }
  section:not(#view-dashboard) .mint-card > div.bg-\[\#F6FBF8\] > .grid > div > label,
  section:not(#view-dashboard) .mint-card > form.bg-\[\#F6FBF8\] label {
    color: var(--cream-text) !important;
  }

  /* AI Chat Feed inside Khung 2 (No #FFF — soft mint container + card bubbles) */
  section:not(#view-dashboard) #ai-chat-messages {
    background-color: var(--workspace) !important;
    border: 1.5px solid var(--border) !important;
    color: var(--ink-main) !important;
  }
  section:not(#view-dashboard) #ai-chat-messages .bg-white {
    background-color: var(--input) !important;
    border: 1.5px solid var(--border) !important;
    color: var(--ink-main) !important;
  }

  /* Final Price Summary Card in Khung 4 (Deep Forest + Gold highlight) */
  #view-xnk-pricing .khung4-price-hero {
    background: linear-gradient(155deg, var(--forest) 0%, var(--deep) 100%) !important;
    border: 2px solid var(--border) !important;
    box-shadow: 0 5px 0 #041911, 0 14px 26px rgba(7, 40, 28, 0.35) !important;
    color: var(--cream-text) !important;
  }

  /* =========================================================================
   * 7. TABLES & ALTERNATING ROWS (--card, --row-even, --row-odd, --row-hover)
   * ========================================================================= */
  .agri-table-scroll {
    max-height: calc(100vh - 230px);
    overflow-y: auto;
    overflow-x: auto;
    position: relative;
    background-color: var(--card);
  }
  .agri-table-scroll-compact {
    max-height: 360px;
    overflow-y: auto;
    overflow-x: auto;
    position: relative;
    background-color: var(--card);
  }
  section:not(#view-dashboard) .mint-card .agri-table-scroll,
  section:not(#view-dashboard) .mint-card .agri-table-scroll-compact,
  section:not(#view-dashboard) .mint-amber-card .agri-table-scroll,
  section:not(#view-dashboard) .mint-amber-card .agri-table-scroll-compact {
    background-color: var(--card) !important;
    border-color: var(--border) !important;
  }
  .agri-table {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
  }
  .agri-table thead th {
    position: sticky;
    top: 0;
    z-index: 10;
