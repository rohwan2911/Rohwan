    { Fee_Category: "PACKING", Fee_Code: "PKG-IQF-5K", Scope_or_ContType: "REEFER", Fee_Name_VIE: "Bao PE khối IQF 5kg + Thùng chống ẩm 15kg", Contract_Text_ENG: "5kg IQF Block Bags in 15kg Waxed Carton", Unit_Basis: "Carton", Standard_Rate: 0.31, Provider_or_Rule: "15", Note: "Hàng cấp đông bulk 15kg", Dim_CM: "45x32x28", Net_KG: 15, Tare_KG: 1.15, Max_Per_Pallet: 40 },

    { Fee_Category: "PACKING", Fee_Code: "PKG-PLT-NO", Scope_or_ContType: "ALL", Fee_Name_VIE: "Không dùng Pallet (Xếp sàn container - Floor Load)", Contract_Text_ENG: "Loose Floor-Loaded in Container (No Pallet)", Unit_Basis: "Pallet", Standard_Rate: 0, Provider_or_Rule: "Xếp rời tối ưu thể tích", Note: "Không phát sinh phí & bì pallet", Dim_CM: "0x0x0", Net_KG: 0, Tare_KG: 0, Max_Per_Pallet: 0 },
    { Fee_Category: "CONTAINER", Fee_Code: "CONT-20GP", Scope_or_ContType: "20'DC", Fee_Name_VIE: "Container 20' Khô tiêu chuẩn (20'DC / 20GP)", Contract_Text_ENG: "20ft General Purpose Dry Container", Unit_Basis: "Container", Standard_Rate: 0, Provider_or_Rule: "Max 22,000 KG / 28 CBM / 10 Pallet", Note: "Khuyến nghị hàng khô nặng", Dim_CM: "589x235x239", Net_KG: 22000, Tare_KG: 28, Max_Per_Pallet: 10 },
    { Fee_Category: "CONTAINER", Fee_Code: "CONT-40GP", Scope_or_ContType: "40'DC", Fee_Name_VIE: "Container 40' Khô tiêu chuẩn (40'DC / 40GP)", Contract_Text_ENG: "40ft General Purpose Dry Container", Unit_Basis: "Container", Standard_Rate: 0, Provider_or_Rule: "Max 26,000 KG / 58 CBM / 20 Pallet", Note: "Tối ưu hàng thể tích lớn", Dim_CM: "1203x235x239", Net_KG: 26000, Tare_KG: 58, Max_Per_Pallet: 20 },
    { Fee_Category: "CONTAINER", Fee_Code: "CONT-40HC", Scope_or_ContType: "40'HC", Fee_Name_VIE: "Container 40' Khô Cao (40'HC)", Contract_Text_ENG: "40ft High-Cube Dry Container", Unit_Basis: "Container", Standard_Rate: 0, Provider_or_Rule: "Max 26,480 KG / 76 CBM / 21 Pallet", Note: "Ưu tiên cho hàng nhẹ thể tích lớn", Dim_CM: "1203x235x269", Net_KG: 26480, Tare_KG: 76, Max_Per_Pallet: 21 },
    { Fee_Category: "CONTAINER", Fee_Code: "CONT-20RF", Scope_or_ContType: "20'RF", Fee_Name_VIE: "Container 20' Lạnh (20'RF)", Contract_Text_ENG: "20ft Reefer Container", Unit_Basis: "Container", Standard_Rate: 0, Provider_or_Rule: "Max 21,000 KG / 24 CBM / 9 Pallet", Note: "Hàng tươi / cấp đông lô nhỏ", Dim_CM: "544x229x227", Net_KG: 21000, Tare_KG: 24, Max_Per_Pallet: 9 },
    { Fee_Category: "CONTAINER", Fee_Code: "CONT-40RF", Scope_or_ContType: "40'RF", Fee_Name_VIE: "Container 40' Lạnh Tiêu Chuẩn (40'RF)", Contract_Text_ENG: "40ft Standard Reefer Container", Unit_Basis: "Container", Standard_Rate: 0, Provider_or_Rule: "Max 25,500 KG / 52 CBM / 20 Pallet", Note: "Hàng tươi / cấp đông xuất khẩu", Dim_CM: "1156x229x250", Net_KG: 25500, Tare_KG: 52, Max_Per_Pallet: 20 },
    { Fee_Category: "CONTAINER", Fee_Code: "CONT-40RH", Scope_or_ContType: "40'RH", Fee_Name_VIE: "Container 40' Lạnh Cao (40'RH)", Contract_Text_ENG: "40ft High-Cube Reefer Container", Unit_Basis: "Container", Standard_Rate: 0, Provider_or_Rule: "Max 25,980 KG / 67 CBM / 20 Pallet", Note: "Hàng tươi / cấp đông thể tích lớn", Dim_CM: "1158x229x255", Net_KG: 25980, Tare_KG: 67, Max_Per_Pallet: 20 }
  ];

  function parseDimCmToCbmJS(dimCm) {
    var m = String(dimCm || "").trim().match(/(\d+(?:\.\d+)?)\s*[x×*]\s*(\d+(?:\.\d+)?)\s*[x×*]\s*(\d+(?:\.\d+)?)/i);
    if (!m) return 0;
    var l = toNum(m[1]), w = toNum(m[2]), h = toNum(m[3]);
    return (l > 0 && w > 0 && h > 0) ? (l * w * h) / 1000000 : 0;
  }

  function resolvePackingSpecJS(packingCode) {
    var rawCode = String(packingCode || "").trim().toUpperCase();
    var code = rawCode === "PKG-POUCH-1K" ? "PKG-VAC-1K" : rawCode;
    var rates = getPricingRatesByCategory("PACKING");
    var row = rates.find(function (r) {
      var fc = String(r["Fee_Code"] || "").trim().toUpperCase();
      return fc === rawCode || fc === code;
    });
    var def = DEFAULT_PACKING_AND_CONTAINER_RATES_JS.find(function (d) {
      return d.Fee_Category === "PACKING" && (d.Fee_Code === code || d.Fee_Code === rawCode);
    });
    if (!row && !def) {
      def = DEFAULT_PACKING_AND_CONTAINER_RATES_JS.find(function (d) { return d.Fee_Code === "PKG-CTN-10K"; });
    }
    var dimCm = String((row && row["Dim_CM"]) || (def && def.Dim_CM) || "40x30x25").trim();
    var cbmPerCarton = parseDimCmToCbmJS(dimCm) || 0.03;
    var netKg = toNum(row && row["Net_KG"]);
    if (netKg <= 0) netKg = toNum(row && row["Unit_Weight_KG"]);
    if (netKg <= 0 && def && def.Net_KG > 0) netKg = def.Net_KG;
    if (netKg <= 0 && row) netKg = toNum(row["Provider_or_Rule"]);
    if (netKg <= 0) netKg = 10;
    var tareKg = toNum(row && row["Tare_KG"]) > 0 ? toNum(row["Tare_KG"]) : ((def && def.Tare_KG) || 0.8);
    var maxPerPallet = toNum(row && row["Max_Per_Pallet"]) > 0 ? toNum(row["Max_Per_Pallet"]) : ((def && def.Max_Per_Pallet) || 50);
    var rate = toNum(row && row["Standard_Rate"]) > 0 ? toNum(row["Standard_Rate"]) : ((def && def.Standard_Rate) || 0);
    var unitBasis = String((row && row["Unit_Basis"]) || (def && def.Unit_Basis) || "Carton");
    var nameVie = String((row && row["Fee_Name_VIE"]) || (def && def.Fee_Name_VIE) || code || "Thùng xuất khẩu");
    var engText = String((row && row["Contract_Text_ENG"]) || (def && def.Contract_Text_ENG) || nameVie);
    return {
      code: code || "PKG-CTN-10K",
      dimCm: dimCm,
      cbmPerCarton: cbmPerCarton,
      netKgPerCarton: netKg,
      tareKgPerCarton: tareKg,
      maxPerPallet: maxPerPallet,
      rate: rate,
      unitBasis: unitBasis,
      nameVie: nameVie,
      engText: engText
    };
  }

  function resolveContainerSpecsJS() {
    var contRates = getPricingRatesByCategory("CONTAINER").filter(function (r) {
      var st = String(r["Status"] || "").trim().toLowerCase();
      return !st || (
        st.indexOf("inactive") === -1 &&
        st.indexOf("locked") === -1 &&
        st.indexOf("ngưng") === -1 &&
        st.indexOf("khóa") === -1 &&
        st.indexOf("disabled") === -1 &&
        st !== "off" &&
        st !== "0"
      );
    });
    function one(feeCode, shortCode, defKg, defCbm, defPlt) {
      var defRow = DEFAULT_PACKING_AND_CONTAINER_RATES_JS.find(function (d) { return d.Fee_Code === feeCode; }) || {};
      var row = contRates.find(function (r) {
        var fc = String(r["Fee_Code"] || "").trim().toUpperCase();
        var sc = String(r["Scope_or_ContType"] || "").trim().toUpperCase().replace(/'/g, "");
        return fc === feeCode || sc === shortCode.toUpperCase().replace(/'/g, "");
      });
      return {
        code: shortCode,
        maxPayloadKg: toNum(row && row["Net_KG"]) > 0 ? toNum(row["Net_KG"]) : (defRow.Net_KG || defKg),
        usableCbm: toNum(row && row["Tare_KG"]) > 0 ? toNum(row["Tare_KG"]) : (defRow.Tare_KG || defCbm),
        maxPallets: toNum(row && row["Max_Per_Pallet"]) > 0 ? toNum(row["Max_Per_Pallet"]) : (defRow.Max_Per_Pallet || defPlt)
      };
    }
    return {
      "20DC": one("CONT-20GP", "20DC", 22000, 28, 10),
      "40DC": one("CONT-40GP", "40DC", 26000, 58, 20),
      "40HC": one("CONT-40HC", "40HC", 26480, 76, 21),
      "20'RF": one("CONT-20RF", "20'RF", 21000, 24, 9),
      "40'RF": one("CONT-40RF", "40'RF", 25500, 52, 20),
      "40'RH": one("CONT-40RH", "40'RH", 25980, 67, 20)
    };
  }

  function solveSingleStreamMixJS(grossKg, cbm, pallets, usePallet, c20, c40, c40hc) {
    if (grossKg <= 0 && cbm <= 0 && (!usePallet || pallets <= 0)) {
      return { shipMode: "NONE", q20: 0, q40: 0, q40hc: 0, fillPct20: 0 };
    }
    var pltNeed = usePallet ? pallets : 0;
    var fillW = grossKg / Math.max(1, c20.maxPayloadKg);
    var fillV = cbm / Math.max(1, c20.usableCbm);
    var fillP = (usePallet && c20.maxPallets > 0) ? (pltNeed / c20.maxPallets) : 0;
    var maxFill20 = Math.max(fillW, fillV, fillP);
    var fillPct20 = Math.round(maxFill20 * 100);

    // Nguyên tắc 1 bộ chứng từ cho cùng 1 nhóm nhiệt độ: < 55% cont 20' -> 100% LCL qua Forwarder
    if (maxFill20 < 0.55) {
      return { shipMode: "LCL", q20: 0, q40: 0, q40hc: 0, fillPct20: fillPct20 };
    }

    if (grossKg <= c20.maxPayloadKg && cbm <= c20.usableCbm && (!usePallet || pltNeed <= c20.maxPallets)) {
      return { shipMode: "FCL", q20: 1, q40: 0, q40hc: 0, fillPct20: fillPct20 };
    }

    var big = c40hc || c40;
    var limit40H = Math.max(
      1,
      Math.ceil(grossKg / Math.max(1, big.maxPayloadKg)),
      Math.ceil(cbm / Math.max(1, big.usableCbm)),
      usePallet ? Math.ceil(pltNeed / Math.max(1, big.maxPallets)) : 0
    );
    var limit40 = Math.max(
      1,
      Math.ceil(grossKg / Math.max(1, c40.maxPayloadKg)),
      Math.ceil(cbm / Math.max(1, c40.usableCbm)),
      usePallet ? Math.ceil(pltNeed / Math.max(1, c40.maxPallets)) : 0
    );
    var best = { q20: 0, q40: 0, q40hc: limit40H, score: limit40H * 1.76, totalConts: limit40H };

    for (var n40hc = 0; n40hc <= limit40H; n40hc++) {
      for (var n40 = 0; n40 <= limit40; n40++) {
        var remKg = Math.max(0, grossKg - n40hc * big.maxPayloadKg - n40 * c40.maxPayloadKg);
        var remCbm = Math.max(0, cbm - n40hc * big.usableCbm - n40 * c40.usableCbm);
        var remPlt = usePallet ? Math.max(0, pltNeed - n40hc * big.maxPallets - n40 * c40.maxPallets) : 0;
        var n20 = (remKg > 0 || remCbm > 0 || remPlt > 0)
          ? Math.max(
              remKg > 0 ? Math.ceil(remKg / Math.max(1, c20.maxPayloadKg)) : 0,
              remCbm > 0 ? Math.ceil(remCbm / Math.max(1, c20.usableCbm)) : 0,
              (usePallet && remPlt > 0) ? Math.ceil(remPlt / Math.max(1, c20.maxPallets)) : 0
            )
          : 0;
        var totCont = n40hc + n40 + n20;
        if (totCont === 0) continue;
        var score = n40hc * 1.76 + n40 * 1.72 + n20 * 1.0;
        if (
          score < best.score - 0.0001 ||
          (Math.abs(score - best.score) <= 0.0001 && (totCont < best.totalConts || (totCont === best.totalConts && n40hc > best.q40hc)))
        ) {
          best = { q20: n20, q40: n40, q40hc: n40hc, score: score, totalConts: totCont };
        }
      }
    }
    return { shipMode: "FCL", q20: best.q20, q40: best.q40, q40hc: best.q40hc, fillPct20: fillPct20 };
  }

  function solveOptimalContainerMixJS(items, usePallet) {
    var dryItems = [];
    var reeferItems = [];
    (items || []).forEach(function (it) {
      var prod = getProductBySku(it.sku);
      if (isReeferProduct(prod, it.name)) reeferItems.push(it);
      else dryItems.push(it);
    });
    var drySum = computeOrderPalletSummary(dryItems, usePallet);
    var rfSum = computeOrderPalletSummary(reeferItems, usePallet);
    var specs = resolveContainerSpecsJS();
    var dryMix = solveSingleStreamMixJS(drySum.totalGrossWeightKg, drySum.totalCbm, drySum.totalPallets, usePallet, specs["20DC"], specs["40DC"], specs["40HC"]);
    var rfMix = solveSingleStreamMixJS(rfSum.totalGrossWeightKg, rfSum.totalCbm, rfSum.totalPallets, usePallet, specs["20'RF"], specs["40'RF"], specs["40'RH"]);
    return {
      dryMode: dryMix.shipMode,
      reeferMode: rfMix.shipMode,
      dryFillPct20: dryMix.fillPct20,
      reeferFillPct20: rfMix.fillPct20,
      dryWeightKg: drySum.totalGrossWeightKg,
      dryCbm: drySum.totalCbm,
      reeferWeightKg: rfSum.totalGrossWeightKg,
      reeferCbm: rfSum.totalCbm,
      qty20DC: dryMix.q20,
      qty40DC: dryMix.q40,
      qty40HC: dryMix.q40hc,
      qty20RF: rfMix.q20,
      qty40RF: rfMix.q40,
      qty40RH: rfMix.q40hc
    };
  }

  function applyOptimalContainerMix(silentMode) {
    var usePallet = Boolean((document.getElementById("calc-use-pallet") || {}).checked);
    var mix = solveOptimalContainerMixJS(PRICING_ITEMS_STATE || [], usePallet);
    var totalFcl = mix.qty20DC + mix.qty40DC + mix.qty40HC + mix.qty20RF + mix.qty40RF + mix.qty40RH;
    var hasAnyCargo = (PRICING_ITEMS_STATE || []).length > 0;
    if (!hasAnyCargo && totalFcl === 0) {
      mix.qty40RF = 1;
      mix.reeferMode = "FCL";
    }
    var el20dc = document.getElementById("calc-qty-20dc");
    var el40dc = document.getElementById("calc-qty-40dc");
    var el40hc = document.getElementById("calc-qty-40hc");
    var el20rf = document.getElementById("calc-qty-20rf");
    var el40rf = document.getElementById("calc-qty-40rf");
    var el40rh = document.getElementById("calc-qty-40rh");
    if (el20dc) el20dc.value = mix.qty20DC;
    if (el40dc) el40dc.value = mix.qty40DC;
    if (el40hc) el40hc.value = mix.qty40HC;
    if (el20rf) el20rf.value = mix.qty20RF;
    if (el40rf) el40rf.value = mix.qty40RF;
    if (el40rh) el40rh.value = mix.qty40RH;

    // Tự mở bảng so sánh Forwarder khi đề xuất LCL; ẩn mặc định khi đi nguyên cont FCL
    var hasLclAuto = mix.dryMode === "LCL" || mix.reeferMode === "LCL";
    syncFwdCompareVisibilityForMix(hasLclAuto, true);

    onContainerMixChange();
    if (!silentMode) {
      var m = getContainerMixState();
      showToast("success", "Đã tính phân bổ tối ưu: " + (m.summaryStr || "1 x 40'RF"));
    }
  }

  function getStandardPalletRate() {
    var pltSpec = resolvePackingSpecJS("PKG-PLT-YES");
    return pltSpec.rate > 0 ? pltSpec.rate : STANDARD_PALLET_RATE;
  }

  function getPalletOptions() {
    var stdRate = getStandardPalletRate();
    return [
      { code: "PKG-PLT-NO", name: "Không đóng Pallet ($0.00/pallet)", rate: 0 },
      { code: "PKG-PLT-YES", name: "Đóng Pallet gỗ ISPM-15 ($" + formatCurrency(stdRate) + "/pallet)", rate: stdRate }
    ];
  }

  function getPackingCartonKgPerUnit(packingCode) {
    return resolvePackingSpecJS(packingCode).netKgPerCarton;
  }

  function computeItemPackingAndPallet(weight, packingCode, packingExtra) {
    var w = Math.max(0, toNum(weight));
    var spec = resolvePackingSpecJS(packingCode);
    var kgPerCtn = Math.max(0.5, spec.netKgPerCarton || 10);
    var cartons = w > 0 ? Math.ceil(w / kgPerCtn) : 0;
    var tareKg = Math.round(cartons * spec.tareKgPerCarton * 100) / 100;
    var grossWeightKg = Math.round((w + tareKg) * 100) / 100;
    var cbm = Math.round(cartons * spec.cbmPerCarton * 1000) / 1000;
    var rate = spec.rate > 0 ? spec.rate : Math.max(0, toNum(packingExtra));
    var unitLower = String(spec.unitBasis || "").toLowerCase();
    var packingCost = rate > 0
      ? (unitLower.indexOf("kg") !== -1 ? Math.round(w * rate * 100) / 100 : Math.round(cartons * rate * 100) / 100)
      : 0;
    return {
      cartons: cartons,
      pallets: 0,
      maxPerPallet: spec.maxPerPallet,
      tareKg: tareKg,
      grossWeightKg: grossWeightKg,
      cbm: cbm,
      packingCost: packingCost,
      palletCost: 0,
      totalCost: packingCost
    };
  }

  function computeOrderPalletSummary(items, usePallet, rateOverride) {
    var pltSpec = resolvePackingSpecJS("PKG-PLT-YES");
    var pltTareEach = pltSpec.tareKgPerCarton > 0 ? pltSpec.tareKgPerCarton : 18;
    var pltBaseCbmEach = parseDimCmToCbmJS(pltSpec.dimCm) || 0.17;
    var totalCartons = 0;
    var rawPalletFractions = 0;
    var skuPackingCost = 0;
    var cargoNetKg = 0;
    var packingTareKg = 0;
    var cargoCbm = 0;
    var distinctPackSpecs = {};
    (items || []).forEach(function (it) {
      var w = Math.max(0, toNum(it.weight));
      var spec = resolvePackingSpecJS(it.packingCode);
      var c = computeItemPackingAndPallet(w, it.packingCode, it.packingExtra);
      var maxPlt = c.maxPerPallet > 0 ? c.maxPerPallet : 50;
      if (usePallet && c.cartons > 0) {
        rawPalletFractions += (c.cartons / maxPlt);
      }
      if (c.cartons > 0 && spec.code) {
        distinctPackSpecs[String(spec.code).toUpperCase()] = true;
      }
      totalCartons += c.cartons;
      skuPackingCost += c.packingCost;
      cargoNetKg += w;
      packingTareKg += c.tareKg;
      cargoCbm += c.cbm;
    });
    var hasMixedPacking = Object.keys(distinctPackSpecs).length >= 2;
    var lossFactor = hasMixedPacking ? 1.05 : 1.0;
    var totalPallets = (usePallet && rawPalletFractions > 0) ? Math.ceil(rawPalletFractions * lossFactor) : 0;
    var palletRate = (rateOverride !== undefined && rateOverride !== null && rateOverride !== "")
      ? Math.max(0, toNum(rateOverride))
      : getStandardPalletRate();
    var palletTareKg = Math.round(totalPallets * pltTareEach * 100) / 100;
    var palletCbm = Math.round(totalPallets * pltBaseCbmEach * 1000) / 1000;
    var totalGrossWeightKg = Math.round((cargoNetKg + packingTareKg + palletTareKg) * 100) / 100;
    var totalCbm = Math.round((cargoCbm + palletCbm) * 1000) / 1000;
    var palletFee = Math.round(totalPallets * palletRate * 100) / 100;
    skuPackingCost = Math.round(skuPackingCost * 100) / 100;
    return {
      cargoNetKg: Math.round(cargoNetKg * 100) / 100,
      packingTareKg: Math.round(packingTareKg * 100) / 100,
      palletTareKg: palletTareKg,
      totalGrossWeightKg: totalGrossWeightKg,
      cargoCbm: Math.round(cargoCbm * 1000) / 1000,
      palletCbm: palletCbm,
      totalCbm: totalCbm,
      totalCartons: totalCartons,
      totalPallets: totalPallets,
      palletLossApplied: hasMixedPacking,
      palletRate: palletRate,
      palletFee: palletFee,
      skuPackingCost: skuPackingCost,
      totalPackingPalletCost: Math.round((skuPackingCost + palletFee) * 100) / 100
    };
  }

  function getPackingOptionsForProduct(prod) {

      return String(r["Fee_Code"] || "").trim().toUpperCase().indexOf("PKG-PLT") !== 0;

    var mergedMap = {};

    }).forEach(function (d) {
      mergedMap[d.Fee_Code] = d;
    });
    prPack.forEach(function (r) {
      var fc = String(r["Fee_Code"] || "").trim().toUpperCase();
      if (fc) mergedMap[fc] = r;
    });
    var normalizedPr = Object.keys(mergedMap).map(function (k) {
      var r = mergedMap[k];
      return {
        Code: String(r["Fee_Code"] || k).trim(),
        Scope: String(r["Scope_or_ContType"] || "ALL").trim(),
        Display_Name_VIE: String(r["Fee_Name_VIE"] || k).trim(),
        Contract_Text_ENG: String(r["Contract_Text_ENG"] || "").trim(),
        Extra_Value: toNum(r["Standard_Rate"]),
        Note: String(r["Note"] || "").trim()
      };
    });
    var scopedPr = normalizedPr.filter(function (pk) {
      var sc = pk.Scope.toUpperCase();
      if (!sc || sc === "ALL" || sc === "TẤT CẢ") return true;
      if (sc === "REEFER") return isReefer;
      if (sc === "DRY") return !isReefer;
      return true;
    });
    return scopedPr.length > 0 ? scopedPr : normalizedPr;

  function detectContractTemplateForOrder(orderId, overrideTplId) {
    var pool = getContractTemplatesPool();
    if (pool.length === 0) pool = APP_DATA.templates || [];
    function findExactId(id) {
      var up = String(id || "").trim().toUpperCase();
      if (!up) return null;
      return pool.find(function (t) { return String(t["Template ID"] || "").trim().toUpperCase() === up; }) || null;
    }
    if (overrideTplId) {
      var chosen = findExactId(overrideTplId);
      if (chosen) return chosen;
    }
    var inq = (APP_DATA.inquiries || []).find(function (i) { return i["Order_ID"] === orderId; });
    var ord = (APP_DATA.orders || []).find(function (o) { return o["Order_ID"] === orderId; });
    var items = inq ? parseOrderItems(inq) : (ord ? [{ sku: ord["SKU_Code"], name: ord["SKU_Code"], weight: toNum(ord["NW_Confirmed_KGs"]) }] : []);
    var groups = [];
    var hasDry = false;
    var hasFreshFrozen = false;
    var hasNuts = false;
    var hasSpices = false;
    items.forEach(function (it) {
      var p = getProductBySku(it.sku);
      var g = getProductGroupName(p);
      if (g && groups.indexOf(g) === -1) groups.push(g);
      var hay = (g + " " + String((p && p["Product_Name_VIE"]) || it.name || "") + " " + String((p && p["Storage_Temp"]) || "")).toLowerCase();
      if (hay.indexOf("tươi") !== -1 || hay.indexOf("cấp đông") !== -1 || hay.indexOf("lạnh") !== -1 || hay.indexOf("frozen") !== -1 || hay.indexOf("fresh") !== -1 || hay.indexOf("-18") !== -1) {
        hasFreshFrozen = true;
      } else {
        hasDry = true;
      }
      if (hay.indexOf("hạt") !== -1 || hay.indexOf("nut") !== -1 || hay.indexOf("điều") !== -1 || hay.indexOf("macca") !== -1) {
        hasNuts = true;
      }
      if (hay.indexOf("gia vị") !== -1 || hay.indexOf("spice") !== -1 || hay.indexOf("quế") !== -1 || hay.indexOf("hồi") !== -1 || hay.indexOf("tiêu") !== -1 || hay.indexOf("ớt") !== -1 || hay.indexOf("nghệ") !== -1 || hay.indexOf("gừng") !== -1) {
        hasSpices = true;
      }
    });
    function findKw(kws) {
      return pool.find(function (t) {
        var hay = (String(t["Template ID"] || "") + " " + String(t["Document_Name"] || "")).toLowerCase();
        return kws.some(function (kw) { return hay.indexOf(kw) !== -1; });
      }) || null;
    }
    if ((hasDry && hasFreshFrozen) || groups.length >= 2) {
      return findExactId("TMP_CONTRACT_MIXED_CARGO") || findKw(["tmp_contract_mixed", "hỗn hợp", "đa chủng loại", "mixed", "multi"]) || pool[0] || null;
    }
    if (hasFreshFrozen && !hasDry) {
      return findExactId("TMP_CONTRACT_FRESH_FROZEN") || findKw(["tmp_contract_fresh_frozen", "gia vị tươi", "cấp đông", "tươi", "fresh", "frozen"]) || pool[0] || null;
    }
    if (hasNuts && !hasSpices) {
      return findExactId("TMP_CONTRACT_EDIBLE_NUTS") || findKw(["tmp_contract_edible_nuts", "hạt dinh dưỡng", "nut", "hat"]) || pool[0] || null;
    }
    if (hasSpices || hasDry) {
      return findExactId("TMP_CONTRACT_DRIED_SPICES") || findKw(["tmp_contract_dried_spices", "gia vị khô", "dried", "spice"]) || pool[0] || null;
    }
    return findExactId("TMP_CONTRACT_DRIED_SPICES") || findExactId("TMP_SALES_CONTRACT") || pool[0] || null;
  }

  function normalizeProductImageUrl(url) {
    var u = String(url || "").trim();
    if (!u) return "";
    var mLh3 = u.match(/lh3\.googleusercontent\.com\/d\/([a-zA-Z0-9_-]+)/);
    if (mLh3 && mLh3[1]) {
      return "https://lh3.googleusercontent.com/d/" + mLh3[1];
    }
    var m1 = u.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
    if (m1 && m1[1]) {
      return "https://lh3.googleusercontent.com/d/" + m1[1];
    }
    var m2 = u.match(/drive\.google\.com\/(?:open|uc|thumbnail)\?[^#]*[?&]id=([a-zA-Z0-9_-]+)/);
    if (m2 && m2[1]) {
      return "https://lh3.googleusercontent.com/d/" + m2[1];
    }
    var m3 = u.match(/drive\.google\.com\/(?:open|uc|thumbnail)\?id=([a-zA-Z0-9_-]+)/);
    if (m3 && m3[1]) {
      return "https://lh3.googleusercontent.com/d/" + m3[1];
    }
    if (!/^(https?:\/\/|data:|\/)/i.test(u)) {
      return "";
    }
    return u;
  }

      var pkOpt = pkSel && pkSel.selectedIndex >= 0 ? pkSel.options[pkSel.selectedIndex] : null;
      var pkCode = pkSel ? pkSel.value : "";
      var pkExtra = pkOpt && pkCode ? toNum(pkOpt.getAttribute("data-extra")) : 0;
      var calc = computeItemPackingAndPallet(w, pkCode, pkExtra);
      totalWeight += w;
      parsedItems.push({ weight: w, packingCode: pkCode, packingExtra: pkExtra });

      var infoEl = r.querySelector(".inq-row-calc-info");
      if (infoEl) {
        infoEl.innerHTML = w > 0
          ? ('<span>Quy đổi Tầng 1: <strong class="font-mono text-[#07281c]">' + fmtNumber(calc.cartons) + ' thùng</strong> (' + getPackingCartonKgPerUnit(pkCode) + ' kg/thùng)</span>' +

          : '<span>Nhập khối lượng (KG) để tự quy đổi số thùng</span><span>-</span>';
      }
    }

    var usePallet = Boolean((document.getElementById("inq-use-pallet") || {}).checked);
    var pool = computeOrderPalletSummary(parsedItems, usePallet);
    var sumEl = document.getElementById("inq-items-summary");
    if (sumEl) {
      sumEl.innerHTML =
        '<span>Tổng: <strong class="font-mono">' + fmtNumber(totalWeight) + ' KG Net</strong> (<strong class="font-mono">' + fmtNumber(pool.totalGrossWeightKg) + ' KG Gross</strong> · <strong class="font-mono">' + pool.totalCbm.toFixed(2) + ' CBM</strong>) · <strong class="font-mono">' + fmtNumber(pool.totalCartons) + ' thùng</strong> · <strong class="font-mono text-[#f4d98a]">' + fmtNumber(pool.totalPallets) + ' pallet</strong>' +

        '<span>Dự kiến Bao bì &amp; Pallet: <strong class="font-mono text-[#f4d98a]">' + fmtUSD(pool.totalPackingPalletCost) + '</strong></span>';

  function renderInquiriesTable() {
    var search = ((document.getElementById("filter-inquiry-search").value || GLOBAL_QUICK_SEARCH || "")).toLowerCase();
    var statusFilter = document.getElementById("filter-inquiry-status").value;

    var rows = (APP_DATA.inquiries || []).filter(function (inq) {
      var normSt = normalizeWorkflowStatus(inq["Inquiry_Status"]);
      if (statusFilter && normSt !== normalizeWorkflowStatus(statusFilter)) return false;
      if (search) {
        var cus = (APP_DATA.consignees || []).find(function (c) { return c["Consignee_ID"] === inq["Consignee_ID"]; });
        var hay = (inq["Order_ID"] + " " + inq["Consignee_ID"] + " " + (cus ? cus["Consignee_Name"] : "") + " " + inq["Tên sản phẩm"] + " " + inq["Sale_rep"]).toLowerCase();
        if (hay.indexOf(search) === -1) return false;
      }
      return true;
    });

    var tbody = document.getElementById("inquiry-tbody");
    if (rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="py-8 text-center text-[#1e4231] font-medium">Không có yêu cầu báo giá phù hợp.</td></tr>';
      return;
    }

    var statusOptions = [
      WORKFLOW_STATUS.NEW_WAITING,
      WORKFLOW_STATUS.REPRICE_REQUESTED,
      WORKFLOW_STATUS.PRICED_READY,
      WORKFLOW_STATUS.QUOTATION_DRAFTED,
      WORKFLOW_STATUS.QUOTATION_SENT,
      WORKFLOW_STATUS.CONFIRMED,
      WORKFLOW_STATUS.CONTRACTED,
      WORKFLOW_STATUS.CANCELLED
    ];

    tbody.innerHTML = rows.slice().reverse().map(function (inq) {
      var st = normalizeWorkflowStatus(inq["Inquiry_Status"]);
      var oid = String(inq["Order_ID"] || "");
      var cus = (APP_DATA.consignees || []).find(function (c) { return c["Consignee_ID"] === inq["Consignee_ID"]; });
      var cusName = cus ? cus["Consignee_Name"] : inq["Consignee_ID"];
      var cusSub = cus ? (cus["Customer_Type"] || "") : "";
      var rawMode = String(inq["Quotation_Mode"] || "").toUpperCase();
      var modeBadge = (rawMode === "COMPARE" || rawMode === "COMPARISON")
        ? '<div class="mt-1"><span class="inline-block px-1.5 py-0.5 text-[10px] font-bold rounded bg-[#f4d98a] text-[#07281c] border border-[#186635]">So sánh đa ĐK</span></div>'
        : '';
      return '<tr class="transition-colors">' +
        '<td>' +
          '<button type="button" onclick="openOrderTimelineModal(\'' + oid.replace(/'/g, "\\'") + '\')" class="font-mono font-bold text-[#0b2418] hover:underline cursor-pointer text-left">' + oid + '</button>' +
          '<div class="font-mono text-[11px] text-[#1e4231] mt-0.5">' + (inq["Timestamp"] || "-") + '</div>' +
          '<div class="text-[11px] text-[#1e4231]">NV: ' + (inq["Sale_rep"] || "-") + '</div>' +
          modeBadge +
        '</td>' +
        '<td>' +
          '<div class="font-bold text-[#0b2418] leading-snug">' + cusName + '</div>' +
          (cusSub ? '<div class="text-[11px] text-[#1e4231] mt-0.5">' + cusSub + '</div>' : '') +
        '</td>' +
        '<td class="text-xs">' + formatOrderItemsSummaryHtml(inq) + '</td>' +
        '<td class="text-right font-mono font-bold text-[#0b2418] tabular-nums">' + fmtNumber(inq["Net_Weight_KGs"]) + '</td>' +
        '<td class="text-center font-bold text-[#0f4a33]">' + (inq["Incoterm mong muốn"] || "-") + '</td>' +
        '<td class="text-center">' + renderStatusBadge(st, getInquiryBadgeTone(st)) + '</td>' +
        '<td>' +
          '<select onchange="handleQuickInquiryStatus(\'' + oid.replace(/'/g, "\\'") + '\', this.value)" class="w-full px-1.5 py-1.5 text-[11px] border-[1.5px] border-[#186635] rounded-lg bg-[#aed6c6] text-[#0b2418] font-semibold focus:outline-none focus:ring-2 focus:ring-[#16977f]/35">' +
            statusOptions.map(function (optSt) {
              return '<option value="' + optSt + '"' + (st === optSt ? " selected" : "") + '>' + optSt + '</option>';
            }).join("") +
          '</select>' +
        '</td>' +
      '</tr>';
    }).join("");
  }

  function handleCreateInquiry(e) {
    e.preventDefault();
    var usePallet = Boolean((document.getElementById("inq-use-pallet") || {}).checked);
    var itemRows = document.querySelectorAll("#inq-products-container .inq-prod-row");
    var items = [];
    for (var i = 0; i < itemRows.length; i++) {
      var r = itemRows[i];
      var sku = r.querySelector(".inq-row-sku").value;
      var name = r.querySelector(".inq-row-name").value;
      var weight = toNum(r.querySelector(".inq-row-weight").value);
      var pkSel = r.querySelector(".inq-row-packing");
      var pkOpt = pkSel && pkSel.selectedIndex >= 0 ? pkSel.options[pkSel.selectedIndex] : null;
      var packingCode = pkSel ? pkSel.value : "";
      var packingName = pkOpt && packingCode ? (pkOpt.getAttribute("data-name") || pkOpt.textContent || "") : "";
      var packingExtra = pkOpt && packingCode ? toNum(pkOpt.getAttribute("data-extra")) : 0;
      var calc = computeItemPackingAndPallet(weight, packingCode, packingExtra);
      if (sku && weight > 0) {
        items.push({
          sku: sku,
          name: name,
          weight: weight,
          packingCode: packingCode,
          packingName: packingName,
          packingExtra: packingExtra,
          palletCode: usePallet ? "PKG-PLT-YES" : "PKG-PLT-NO",
          cartons: calc.cartons,
          pallets: 0,
          packingCost: calc.packingCost
        });
      }
    }
    if (items.length === 0) {
      Swal.fire("Thiếu sản phẩm", "Vui lòng chọn ít nhất 1 sản phẩm và nhập khối lượng hợp lệ.", "warning");
      return;
    }

    var taxVal = document.getElementById("inq-cust-tax").value.trim();
    var qModeEl = document.getElementById("inq-quotation-mode");
    var payload = {
      Sale_rep: CURRENT_USER.Full_Name,
      customer: {
        Consignee_ID: document.getElementById("inq-consignee-id").value,
        Consignee_Name: document.getElementById("inq-cust-name").value.trim(),
        Country: document.getElementById("inq-cust-country").value.trim(),
        Tax: taxVal,
        Tax_ID: taxVal,
        Address: document.getElementById("inq-address").value.trim(),
        Contact_Person: document.getElementById("inq-contact").value.trim(),
        Email: document.getElementById("inq-email").value.trim(),
        Phone: document.getElementById("inq-phone").value.trim(),
        Fax: document.getElementById("inq-fax").value.trim()
      },
      items: items,
      Use_Pallet: usePallet,
      Quotation_Mode: qModeEl ? qModeEl.value : "SINGLE",
      "Thời gian giao hàng mong muốn": document.getElementById("inq-delivery").value,
      "Incoterm mong muốn": document.getElementById("inq-incoterm").value,
      "Phương thức thanh toán đề xuất": document.getElementById("inq-payment").value,
      Inquiry_Status: WORKFLOW_STATUS.NEW_WAITING,
      Note: document.getElementById("inq-note").value.trim()
    };

    var formEl = e.target;
    setButtonLoading(formEl, true, "Đang gửi...");
    startTopProgress();
    google.script.run
      .withSuccessHandler(function (res) {
        stopTopProgress();
        setButtonLoading(formEl, false);
        closeModal("modal-new-inquiry");
        showToast("success", "Đã gửi yêu cầu tính giá " + res.data["Order_ID"]);
        refreshAllData({ silent: true });
      })
      .withFailureHandler(function (err) {
        stopTopProgress();
        setButtonLoading(formEl, false);
        Swal.fire("Lỗi", err.message, "error");
      })
      .createInquiry(payload);
  }

  function handleQuickInquiryStatus(orderId, newStatus) {

      .withSuccessHandler(function () {
        stopTopProgress();
        showToast("success", "Đã cập nhật trạng thái " + orderId);

      })
      .withFailureHandler(function (err) {

  // =========================================================================
  // 2.2. KINH DOANH - QUẢN LÝ BÁO GIÁ (XUẤT FILE, THƯƠNG LƯỢNG LẠI & CHỐT ĐƠN)
  // =========================================================================
  function isProposalSuperseded(prop) {
    var stLow = String((prop && prop["Booking_Status"]) || "").toLowerCase();
    return stLow.indexOf("superseded") !== -1 || stLow.indexOf("đã thay thế") !== -1;
  }

  function markQuotationDraftedIfReady(orderId) {
    var normOid = String(orderId || "").trim().toUpperCase();
    var inq = (APP_DATA.inquiries || []).find(function (i) {
      return String(i["Order_ID"] || "").trim().toUpperCase() === normOid;
    });
    if (!inq) return;
    if (normalizeWorkflowStatus(inq["Inquiry_Status"]) === WORKFLOW_STATUS.PRICED_READY) {
      inq["Inquiry_Status"] = WORKFLOW_STATUS.QUOTATION_DRAFTED;
      google.script.run
        .withSuccessHandler(function () {
          renderQuotationsTable();
          renderInquiriesTable();
        })
        .updateInquiryStatus(orderId, WORKFLOW_STATUS.QUOTATION_DRAFTED);
    }
  }

  function renderQuotationsTable() {
    var tbody = document.getElementById("quotation-tbody");
    if (!tbody) return;
    var qSearch = GLOBAL_QUICK_SEARCH.toLowerCase();
    var proposalsList = Array.isArray(APP_DATA.proposals) ? APP_DATA.proposals : [];
    var inquiriesList = Array.isArray(APP_DATA.inquiries) ? APP_DATA.inquiries : [];
    var consigneesList = Array.isArray(APP_DATA.consignees) ? APP_DATA.consignees : [];

    var seenOrderWithProp = {};
    var joined = [];
    proposalsList.forEach(function (prop) {
      var oid = String(prop["Order ID"] || prop["Order_ID"] || prop["Mã đơn"] || "").trim();
      var normOid = oid.toUpperCase();
      if (normOid) seenOrderWithProp[normOid] = true;
      var inq = inquiriesList.find(function (i) {
        return String(i["Order_ID"] || "").trim().toUpperCase() === normOid;
      }) || null;
      if (qSearch) {
        var cus = inq ? consigneesList.find(function (c) { return c["Consignee_ID"] === inq["Consignee_ID"]; }) : null;
        var hay = (oid + " " + (prop["Quotation_No"] || "") + " " + (cus ? cus["Consignee_Name"] : "") + " " + (inq ? inq["Tên sản phẩm"] : "")).toLowerCase();
        if (hay.indexOf(qSearch) === -1) return;
      }
      joined.push({ oid: oid, inq: inq, prop: prop });
    });

    // Fallback: nếu có inquiry đã qua bước XNK tính giá nhưng chưa có dòng proposal tương ứng trong cache hiện tại
    inquiriesList.forEach(function (inq) {
      var oid = String(inq["Order_ID"] || "").trim();
      var normOid = oid.toUpperCase();
      if (!normOid || seenOrderWithProp[normOid]) return;
      var st = normalizeWorkflowStatus(inq["Inquiry_Status"]);
      if (!isPricedOrLaterStatus(st)) return;
      if (qSearch) {
        var cus = consigneesList.find(function (c) { return c["Consignee_ID"] === inq["Consignee_ID"]; });
        var hay = (oid + " " + (cus ? cus["Consignee_Name"] : "") + " " + (inq["Tên sản phẩm"] || "")).toLowerCase();
        if (hay.indexOf(qSearch) === -1) return;
      }
      joined.push({
        oid: oid,
        inq: inq,
        prop: {
          "Order ID": oid,
          "Quotation_No": "QT-" + oid + "-V1",
          "Price_Version": "V1",
          "Recommended Incoterm": inq["Incoterm mong muốn"] || "CIF",
          "Final_Selling Price": 0,
          "Booking_Status": st
        }
      });
    });

    if (joined.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="py-8 text-center text-[#1e4231] font-medium">Chưa có đơn hàng nào được bộ phận Xuất nhập khẩu gửi phương án giá.</td></tr>';
      return;
    }

    tbody.innerHTML = joined.slice().reverse().map(function (item) {
      var inq = item.inq;
      var prop = item.prop;
      var oid = (inq && inq["Order_ID"]) ? inq["Order_ID"] : item.oid;
      var isSup = isProposalSuperseded(prop);
      var cus = inq ? consigneesList.find(function (c) { return c["Consignee_ID"] === inq["Consignee_ID"]; }) : null;
      var cusLabel = cus ? cus["Consignee_Name"] : (inq ? (inq["Consignee_ID"] || "-") : "-");
      var prodLabelHtml = inq ? formatOrderItemsSummaryHtml(inq) : '<span class="text-[#1e4231]/70">-</span>';
      var weightVal = inq ? fmtNumber(inq["Net_Weight_KGs"]) : "-";
      var rawStatus = isSup ? "Đã thay thế (Superseded)" : (inq ? inq["Inquiry_Status"] : (prop["Booking_Status"] || WORKFLOW_STATUS.PRICED_READY));
      var statusVal = isSup ? "Đã thay thế (Superseded)" : normalizeWorkflowStatus(rawStatus);
      var qNo = prop["Quotation_No"] || ("QT-" + oid + "-" + (prop["Price_Version"] || "V1"));
      var packCost = toNum(prop["Packing_Pallet_Cost"]);
      var insCode = prop["Insurance_Code"] || "";
      var subMeta = [];
      if (packCost > 0) subMeta.push("Bao bì/Pallet: " + fmtUSD(packCost));
      if (insCode && String(insCode).toUpperCase() !== "INS-NONE") {
        var insDisp = (typeof formatInsuranceContractTextForOrder === "function")
          ? formatInsuranceContractTextForOrder(insCode, prop["Recommended Incoterm"])
          : insCode;
        subMeta.push(insDisp || insCode);
      }
      var isDoneOrConfirmed = isConfirmedStatus(statusVal) || isContractedStatus(statusVal);
      var rowCls = isSup ? "opacity-65 transition-colors" : "transition-colors";
      var safeOid = String(oid).replace(/'/g, "\\'");
      var tone = isSup ? "neutral" : getInquiryBadgeTone(statusVal);
      var statusBadgeHtml = '<div class="mb-1.5 text-center">' + renderStatusBadge(statusVal, tone) + '</div>';

      var actionButtons = isSup
        ? '<div class="text-center text-[11px] italic text-[#1e4231]/75">Phiên bản cũ</div>'
        : (isDoneOrConfirmed
            ? '<div class="text-center text-[11px] font-bold text-[#0f4a33]">Đã chuyển lập HĐ</div>'
            : '<div class="space-y-1">' +
                '<button type="button" onclick="handleRequestReprice(\'' + safeOid + '\')" class="w-full px-2 py-1 text-[11px] font-bold bg-[#f4d98a] hover:bg-[#e8c668] text-[#07281c] border border-[#186635] rounded-lg transition-colors text-center cursor-pointer">Tính lại</button>' +
                '<button type="button" onclick="openConfirmOrderModal(\'' + safeOid + '\')" class="w-full px-2 py-1 text-[11px] font-semibold bg-[#0f4a33] hover:bg-[#07281c] text-[#fff5d6] border border-[#186635] rounded-lg transition-colors text-center cursor-pointer">Khách chốt báo giá</button>' +
              '</div>');

      var exportStackCls = isSup ? "opacity-40 pointer-events-none" : "";
      var sentMailUrl = getInquiryGmailSentUrl(inq, prop, oid, statusVal);
      var sentMailBtnHtml = (!isSup && sentMailUrl)
        ? '<a href="' + escHtmlText(sentMailUrl) + '" target="_blank" rel="noopener noreferrer" title="Mở email báo giá đã gửi trong Gmail" ' +
            'class="mt-1 w-full inline-flex items-center justify-center gap-1 px-2 py-1 text-[10.5px] font-semibold text-[#fff5d6] bg-[#16977f] hover:bg-[#0f4a33] border border-[#186635] rounded-lg transition-colors text-center">' +
            '<span>↗ Mở mail đã gửi (Gmail)</span>' +
          '</a>'
        : '';
      var finalSellVal = toNum(prop["Final_Selling Price"] !== undefined ? prop["Final_Selling Price"] : prop["Final_Selling_Price"]);

      return '<tr class="' + rowCls + '">' +
        '<td>' +
          '<button type="button" onclick="openOrderTimelineModal(\'' + safeOid + '\')" class="font-mono font-bold text-[#0b2418] hover:underline cursor-pointer text-left">' + oid + '</button>' +
          '<div class="text-[11px] font-mono font-semibold text-[#0f4a33] mt-0.5">' + qNo + '</div>' +
          '<span class="inline-block mt-0.5 px-1.5 py-0.2 rounded bg-[#0f4a33] border border-[#186635] font-mono text-[10px] font-bold text-[#f4d98a]">' + (prop["Price_Version"] || "V1") + '</span>' +
        '</td>' +
        '<td class="font-bold text-[#0b2418] leading-snug">' + cusLabel + '</td>' +
        '<td class="text-xs">' + prodLabelHtml + (subMeta.length ? '<div class="text-[11px] text-[#1e4231] mt-0.5">' + subMeta.join(" · ") + '</div>' : '') + '</td>' +
        '<td class="text-right font-mono font-bold text-[#0b2418] tabular-nums">' + weightVal + '</td>' +
        '<td class="text-center font-bold text-[#0f4a33]">' + (prop["Recommended Incoterm"] || "-") + '</td>' +
        '<td class="text-right font-mono font-bold text-[#07281c] tabular-nums">' + fmtUSD(finalSellVal) + '</td>' +
        '<td>' +
          '<div class="' + exportStackCls + ' space-y-1">' +
            '<button type="button" onclick="openQuotationPreviewModal(\'' + safeOid + '\')" ' + (isSup ? 'disabled ' : '') + 'class="w-full px-2.5 py-1.5 text-[11px] font-semibold bg-[#0f4a33] hover:bg-[#07281c] text-[#fff5d6] border border-[#186635] rounded-lg transition-colors text-center cursor-pointer">Xem trước &amp; Gửi Báo giá</button>' +
            sentMailBtnHtml +
          '</div>' +
        '</td>' +
        '<td>' + statusBadgeHtml + actionButtons + '</td>' +
      '</tr>';
    }).join("");
  }

  function getInquiryGmailSentUrl(inq, prop, oid, statusVal) {
    if (!inq && !oid) return "";
    var directCol = String((inq && inq["Sent_Mail_Link"]) || "").trim();
    if (directCol && directCol.indexOf("http") === 0) return directCol;
    var noteTxt = String((inq && inq["Note"]) || "");
    var match = noteTxt.match(/https:\/\/mail\.google\.com\/mail\/[^\s\]]+/);
    if (match && match[0]) return match[0];
    var stNorm = statusVal || normalizeWorkflowStatus(inq && inq["Inquiry_Status"]);
    if (isQuotationSentStatus(stNorm)) {
      var qRef = String((prop && prop["Quotation_No"]) || oid || (inq && inq["Order_ID"]) || "").trim();
      return "https://mail.google.com/mail/u/0/#search/in%3Asent+" + encodeURIComponent(qRef);
    }
    return "";
  }

  function openConfirmOrderModal(orderId) {
    Swal.fire({
      title: "Khách chốt báo giá · " + orderId,
      input: "textarea",
      inputLabel: "Ghi chú chốt đơn / Yêu cầu điều chỉnh nháp hợp đồng (tùy chọn)",
      inputPlaceholder: "VD: Khách đồng ý giá CIF, giữ nguyên T/T at sight, lưu ý đóng gói nhãn phụ...",
      showCancelButton: true,
      confirmButtonColor: "#0f4a33",
      confirmButtonText: "Chốt đơn & Tạo Nháp Hợp đồng",
      cancelButtonText: "Hủy"
    }).then(function (r) {
      if (!r.isConfirmed) return;
      startTopProgress();
      google.script.run
        .withSuccessHandler(function (res) {
          stopTopProgress();
          if (res && res.success === false) {
            Swal.fire("Chưa hoàn tất", res.message || "Không thể tạo nháp hợp đồng.", "warning");
            return;
          }
          showToast("success", "Đã chốt báo giá & tạo bản nháp Hợp đồng cho " + orderId);
          refreshAllData({ silent: true });
        })
        .withFailureHandler(function (err) {
          stopTopProgress();
          Swal.fire("Lỗi", err.message, "error");
        })
        .confirmOrderToContractDraft(orderId, r.value || "", CURRENT_USER.Full_Name);
    });
  }

  function resolveProposedIncotermsForQuote(prop, inq) {
    var raw = String((prop && prop["Proposed_Incoterms"]) || (inq && inq["Proposed_Incoterms"]) || "").trim();
    var list = [];
    if (raw) {
      raw.split(/[,;\n|]+/).forEach(function (part) {
        var c = String(part || "").trim().toUpperCase();
        if (c && list.indexOf(c) === -1) list.push(c);
      });
    }
    var recInc = String((prop && prop["Recommended Incoterm"]) || (inq && inq["Incoterm mong muốn"]) || "CIF").trim().toUpperCase();
    var reqInc = String((inq && inq["Incoterm mong muốn"]) || recInc).trim().toUpperCase();
    if (list.length === 0) {
      if (recInc) list.push(recInc);
      if (reqInc && list.indexOf(reqInc) === -1) list.push(reqInc);
    }
    return list;
  }

  function triggerBase64BlobDownload(base64Data, mimeType, fileName) {
    var binStr = atob(base64Data);
    var len = binStr.length;
    var bytes = new Uint8Array(len);
    for (var i = 0; i < len; i++) {
      bytes[i] = binStr.charCodeAt(i);
    }
    var blob = new Blob([bytes], { type: mimeType || "application/octet-stream" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = fileName || "document.pdf";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }

  function decodeBase64ToUint8Array(base64Pdf) {

  function resolveStaffEmailByName(staffName) {
    var target = String(staffName || "").trim().toLowerCase();
    if (!target) return "";
    var pool = (APP_DATA.staffDirectory && APP_DATA.staffDirectory.length ? APP_DATA.staffDirectory : APP_DATA.users) || [];
    var hit = pool.find(function (u) {
      var fn = String(u["Full_Name"] || "").trim().toLowerCase();
      var eid = String(u["Employee_ID"] || "").trim().toLowerCase();
      return (fn && (fn === target || fn.indexOf(target) !== -1 || target.indexOf(fn) !== -1)) || (eid && eid === target);
    });
    return hit ? String(hit["Email"] || "").trim() : "";
  }

  function buildClientFallbackEmailMeta(orderId, docKind, docTypeLabel) {
    var o = (APP_DATA.orders || []).find(function (item) { return String(item["Order_ID"] || "") === String(orderId || ""); });
    var inq = (APP_DATA.inquiries || []).find(function (i) { return String(i["Order_ID"] || "") === String(orderId || ""); });
    var prop = (APP_DATA.proposals || []).slice().reverse().find(function (p) {
      return String(p["Order ID"] || p["Order_ID"] || "") === String(orderId || "") && !isProposalSuperseded(p);
    });
    var cusId = (o && o["Consignee_ID"]) || (inq && inq["Consignee_ID"]) || "";
    var cus = (APP_DATA.consignees || []).find(function (c) { return c["Consignee_ID"] === cusId; });
    var sch = prop && prop["Schedule_ID"]
      ? (APP_DATA.schedules || []).find(function (s) { return s["Schedule_ID"] === prop["Schedule_ID"]; })
      : null;
    var items = parseOrderItemsFromInquiry(inq, o && o["SKU_Code"], o && o["NW_Confirmed_KGs"]);
    var allProds = items.map(function (it) { return it.nameEng || it.name || it.sku; }).filter(Boolean).join(", ") ||
      String((inq && inq["Tên sản phẩm"]) || (o && o["SKU_Code"]) || "Vietnamese Agricultural Products");
    var upperKind = String(docKind || "QUOTATION").toUpperCase();
    var isQuo = upperKind === "QUOTATION";
    var isCtr = upperKind === "CONTRACT";
    var ctrNo = String((o && o["Contract_No."]) || orderId);
    var quotNo = isQuo
      ? String((prop && prop["Quotation_No"]) || ("QT-" + orderId + "-V1"))
      : isCtr
        ? ctrNo
        : ((upperKind === "INVOICE" ? "INV-" : upperKind === "PACKING" ? "PKL-" : upperKind === "CO" ? "CO-" : "BL-") + ctrNo);
    var inc = String((o && o["Applied_Incoterm"]) || (prop && prop["Recommended Incoterm"]) || (inq && inq["Incoterm mong muốn"]) || "CIF").trim().toUpperCase();
    var pol = String((o && o["POL"]) || (sch && sch["POL"]) || "Cat Lai");
    var pod = String((o && o["POD"]) || (sch && sch["POD"]) || (cus && cus["Country"]) || "");
    var amt = o ? getOrderContractValue(o) : toNum(prop && prop["Final_Selling Price"]);
    var qty = toNum((o && o["NW_Confirmed_KGs"]) || (inq && inq["Net_Weight_KGs"]) || 0);
    var cneName = String((cus && cus["Consignee_Name"]) || cusId || "Customer");
    var saleRepName = String((o && o["In_Charge_Staff"]) || (inq && inq["Sale_rep"]) || (CURRENT_USER && CURRENT_USER.Full_Name) || "Export Sales Executive");
    var recipient = isCtr
      ? (resolveStaffEmailByName(saleRepName) || resolveStaffEmailByName(inq && inq["Sale_rep"]) || "")
      : String((cus && cus["Email"]) || (inq && inq["Email"]) || "").trim();
    return {
      docKind: upperKind,

      quotNo: quotNo,
      contractNo: ctrNo,
      quotDt: String((o && o["Contract_Date"]) || (prop && prop["Booking_Date"]) || new Date().toISOString().slice(0, 10)),
      allProdNames: allProds,
      totQty: Number(qty || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
      incoterm: inc,
      incotermPlace: pod || pol,
      pol: pol,
      pod: pod,
      totAmt: Number(amt || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
      validDays: "3",
      saleName: saleRepName,
      buyerName: String((cus && cus["Contact_Person"]) || (inq && inq["Contact"]) || cneName),

  async function renderPdfBytesToCanvas(bytes, containerEl, renderSeq) {
    var statusBar = document.getElementById("doc-pdf-status-bar");
    await ensurePdfJsLoaded();
    if (typeof pdfjsLib === "undefined") {
      if (statusBar) statusBar.textContent = "Không tải được PDF.js — Hãy dùng nút Tải PDF hoặc In PDF / Mở Tab mới.";
      containerEl.innerHTML =
        '<div class="p-6 bg-[#f4d98a] rounded-xl border-[1.5px] border-[#186635] text-center max-w-lg shadow-sm space-y-2">' +
          '<div class="font-bold text-[#07281c]">Không tải được thư viện PDF.js</div>' +
          '<p class="text-xs text-[#0b2418]">Bạn có thể bấm trực tiếp nút <strong>Tải PDF</strong> hoặc <strong>In PDF / Mở Tab mới</strong> ở thanh công cụ phía trên.</p>' +
        '</div>';
      return;
    }
    try {
      const pdf = await pdfjsLib.getDocument({
        data: bytes.slice(),
        disableWorker: true
      }).promise;
      if (renderSeq !== PREVIEW_RENDER_SEQ) return;

      containerEl.innerHTML = "";
      if (statusBar) {
        statusBar.textContent = "Đang hiển thị " + pdf.numPages + " trang A4 chuẩn qua PDF.js Canvas (disableWorker · Scale 1.5x)";
      }

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        if (renderSeq !== PREVIEW_RENDER_SEQ) return;
        const page = await pdf.getPage(pageNum);
        const viewport = page.getViewport({ scale: 1.5 });

        const pageWrap = document.createElement("div");
        pageWrap.className = "flex flex-col items-center gap-1.5 max-w-full";

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.className = "bg-white shadow-xl rounded-sm border border-slate-300 max-w-full h-auto block";

        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        if (renderSeq !== PREVIEW_RENDER_SEQ) return;

        const pageLabel = document.createElement("div");
        pageLabel.className = "text-[11px] font-mono font-bold text-[#fff5d6]";
        pageLabel.textContent = "Trang " + pageNum + " / " + pdf.numPages;

        pageWrap.appendChild(canvas);
        pageWrap.appendChild(pageLabel);
        containerEl.appendChild(pageWrap);
      }
    } catch (err) {
      if (renderSeq !== PREVIEW_RENDER_SEQ) return;
      if (statusBar) statusBar.textContent = "Lỗi kết xuất trang Canvas.";
      containerEl.innerHTML =
        '<div class="p-6 bg-[#8c3b3b] rounded-xl border-[1.5px] border-[#6e2b2b] text-center max-w-lg shadow-sm space-y-2 text-[#fdf2f2]">' +
          '<div class="font-bold">Không thể vẽ trang PDF lên Canvas</div>' +
          '<p class="text-xs">' + escHtmlText((err && err.message) || String(err)) + '</p>' +
          '<p class="text-xs">Hãy bấm <strong>Tải PDF</strong> hoặc <strong>In PDF / Mở Tab mới</strong> ở phía trên để xem trực tiếp file PDF thật.</p>' +
        '</div>';
    }
  }

  function getStreamCargoTotalsForPricing() {
    var dryItems = [];
    var reeferItems = [];
    (PRICING_ITEMS_STATE || []).forEach(function (it) {
      var prod = getProductBySku(it.sku);
      if (isReeferProduct(prod, it.name)) reeferItems.push(it);
      else dryItems.push(it);
    });
    var usePallet = Boolean((document.getElementById("calc-use-pallet") || {}).checked);
    var drySum = computeOrderPalletSummary(dryItems, usePallet);
    var rfSum = computeOrderPalletSummary(reeferItems, usePallet);
    return {
      hasDryCargo: dryItems.length > 0 && (drySum.totalGrossWeightKg > 0 || drySum.totalCbm > 0),
      hasReeferCargo: reeferItems.length > 0 && (rfSum.totalGrossWeightKg > 0 || rfSum.totalCbm > 0),
      drySum: drySum,
      rfSum: rfSum
    };
  }

  function getContainerMixState() {
    var q20dc = Math.max(0, Math.floor(toNum((document.getElementById("calc-qty-20dc") || {}).value)));
    var q40dc = Math.max(0, Math.floor(toNum((document.getElementById("calc-qty-40dc") || {}).value)));
    var q40hc = Math.max(0, Math.floor(toNum((document.getElementById("calc-qty-40hc") || {}).value)));
    var q20rf = Math.max(0, Math.floor(toNum((document.getElementById("calc-qty-20rf") || {}).value)));
    var q40rf = Math.max(0, Math.floor(toNum((document.getElementById("calc-qty-40rf") || {}).value)));
    var q40rh = Math.max(0, Math.floor(toNum((document.getElementById("calc-qty-40rh") || {}).value)));
    var dry = q20dc + q40dc + q40hc;
    var reefer = q20rf + q40rf + q40rh;
    var total = dry + reefer;

    var streams = getStreamCargoTotalsForPricing();
    var dryMode = streams.hasDryCargo ? (dry > 0 ? "FCL" : "LCL") : (dry > 0 ? "FCL" : "NONE");
    var reeferMode = streams.hasReeferCargo ? (reefer > 0 ? "FCL" : "LCL") : (reefer > 0 ? "FCL" : "NONE");
    var hasLcl = (dryMode === "LCL") || (reeferMode === "LCL");
    var lclDryWeightKg = dryMode === "LCL" ? streams.drySum.totalGrossWeightKg : 0;
    var lclDryCbm = dryMode === "LCL" ? streams.drySum.totalCbm : 0;
    var lclRfWeightKg = reeferMode === "LCL" ? streams.rfSum.totalGrossWeightKg : 0;
    var lclRfCbm = reeferMode === "LCL" ? streams.rfSum.totalCbm : 0;
    var lclDryWm = Math.max(lclDryWeightKg / 1000, lclDryCbm);
    var lclRfWm = Math.max(lclRfWeightKg / 1000, lclRfCbm);
    var lclWeightKg = lclDryWeightKg + lclRfWeightKg;
    var lclCbm = lclDryCbm + lclRfCbm;
    var lclWm = lclDryWm + lclRfWm;
    var lclBasis = String((document.getElementById("calc-lcl-basis") || {}).value || "CBM").toUpperCase();
    var lclRate = Math.max(0, toNum((document.getElementById("calc-lcl-rate") || {}).value));
    var lclFreight = hasLcl ? (lclBasis === "TON" ? (lclWeightKg / 1000) * lclRate : lclCbm * lclRate) : 0;
    lclFreight = Math.round(lclFreight * 100) / 100;

    var parts = [];
    if (q20dc > 0) parts.push(q20dc + " x 20'DC");
    if (q40dc > 0) parts.push(q40dc + " x 40'DC");
    if (q40hc > 0) parts.push(q40hc + " x 40'HC");
    if (q20rf > 0) parts.push(q20rf + " x 20'RF");
    if (q40rf > 0) parts.push(q40rf + " x 40'RF");
    if (q40rh > 0) parts.push(q40rh + " x 40'RH");
    if (dryMode === "LCL") parts.push("LCL (Khô)");
    if (reeferMode === "LCL") parts.push("LCL (Lạnh)");

    return {
      q20dc: q20dc,
      q40dc: q40dc,
      q40hc: q40hc,
      q20rf: q20rf,
      q40rf: q40rf,
      q40rh: q40rh,
      total: total,
      reefer: reefer,
      dry: dry,
      dryMode: dryMode,
      reeferMode: reeferMode,
      hasLcl: hasLcl,
      lclDryWeightKg: Math.round(lclDryWeightKg * 100) / 100,
      lclDryCbm: Math.round(lclDryCbm * 1000) / 1000,
      lclDryWm: Math.round(lclDryWm * 1000) / 1000,
      lclRfWeightKg: Math.round(lclRfWeightKg * 100) / 100,
      lclRfCbm: Math.round(lclRfCbm * 1000) / 1000,
      lclRfWm: Math.round(lclRfWm * 1000) / 1000,
      lclWeightKg: Math.round(lclWeightKg * 100) / 100,
      lclCbm: Math.round(lclCbm * 1000) / 1000,
      lclWm: Math.round(lclWm * 1000) / 1000,
      lclBasis: lclBasis,
      lclRate: lclRate,
      lclFreight: lclFreight,
      summaryStr: parts.join(" + ")
    };
  }

  function updateContainerMixBadge() {

    if (badge) {

      } else if (mix.total > 0) {
        badge.textContent = "Tổng: " + mix.total + " cont (" + mix.summaryStr + ")";
      } else if (mix.hasLcl) {
        badge.textContent = "100% Hàng lẻ LCL (" + mix.lclCbm.toFixed(2) + " CBM · " + fmtNumber(mix.lclWeightKg) + " KG)";
      } else {
        badge.textContent = "Chưa chọn container";
      }
    }
    var lclRow = document.getElementById("calc-lcl-inline-row");
    if (lclRow) {
      lclRow.classList.toggle("hidden", !mix.hasLcl);
      if (mix.hasLcl) {
        var lclAlertEl = document.getElementById("calc-lcl-alert-text");
        var lclBadgeEl = document.getElementById("calc-lcl-stream-badge");
        var lclPrevEl = document.getElementById("calc-lcl-freight-preview");
        var streamLabels = [];
        if (mix.dryMode === "LCL") streamLabels.push("Khô");
        if (mix.reeferMode === "LCL") streamLabels.push("Lạnh");
        if (lclAlertEl) {
          lclAlertEl.textContent = "Hàng lẻ LCL (" + streamLabels.join(" & ") + " < 55% cont 20') · 1 bộ chứng từ";

  function isInsuranceAddonRow(row) {
    var code = String((row && row.Fee_Code) || "").trim().toUpperCase();
    var scope = String((row && row.Scope_or_ContType) || "").trim().toUpperCase();
    var vie = String((row && row.Fee_Name_VIE) || "").toLowerCase();
    return code.indexOf("INS-EXT") === 0 || scope.indexOf("ADD") !== -1 || scope.indexOf("EXT") !== -1 || vie.indexOf("mở rộng") !== -1;
  }

  function stripInternalRateFromClause(text) {
    return String(text || "")
      .replace(/\(\s*\+?\s*\d+(?:\.\d+)?\s*%\s*\)/g, "")
      .replace(/(?:rate|phí|premium)\s*[:=]?\s*\+?\s*\d+(?:\.\d+)?\s*%/gi, "")
      .replace(/\s{2,}/g, " ")
      .trim();
  }

  function getInsuranceCatalogFromRates() {
    var map = {};
    var order = [];
    DEFAULT_INSURANCE_CATALOG_CLIENT.forEach(function (d) {
      var c = String(d.Fee_Code || "").trim().toUpperCase();
      map[c] = Object.assign({}, d, { Fee_Code: c });
      order.push(c);
    });
    var sheetRates = (APP_DATA && APP_DATA.pricingRates) || [];
    sheetRates.forEach(function (r) {
      var cat = String(r["Fee_Category"] || "").trim().toUpperCase();
      var code = String(r["Fee_Code"] || "").trim().toUpperCase();
      if (cat !== "INSURANCE" || !code) return;
      var rawRate = (r["Standard_Rate"] !== undefined && r["Standard_Rate"] !== "") ? r["Standard_Rate"] : r["Standard_Fee"];
      var ratePct = code === "INS-NONE" ? 0 : Math.max(0, toNum(rawRate));
      var baseFallback = map[code] || {};
      var merged = {
        Fee_Code: code,
        Scope_or_ContType: String(r["Scope_or_ContType"] || baseFallback.Scope_or_ContType || "ALL").trim(),
        Unit_Basis: String(r["Unit_Basis"] || baseFallback.Unit_Basis || "%_CIF_110").trim(),
        Fee_Name_VIE: String(r["Fee_Name_VIE"] || baseFallback.Fee_Name_VIE || code).trim(),
        Contract_Text_ENG: String(r["Contract_Text_ENG"] || baseFallback.Contract_Text_ENG || "").trim(),
        Standard_Rate: ratePct,
        Provider_or_Rule: String(r["Provider_or_Rule"] || r["Note"] || baseFallback.Provider_or_Rule || "").trim()
      };
      merged.isAddon = isInsuranceAddonRow(merged);
      if (!map[code]) order.push(code);
      map[code] = merged;
    });

    var all = order.map(function (c) { return map[c]; });
    var basePolicies = all.filter(function (item) { return !item.isAddon; });
    var addons = all.filter(function (item) { return item.isAddon; });
    return { all: all, byCode: map, basePolicies: basePolicies, addons: addons };
  }

  function parseInsuranceCodeString(rawVal) {
    var cat = getInsuranceCatalogFromRates();
    var tokens = String(rawVal || "").split(/[+,;]+/).map(function (t) {
      return String(t || "").trim().toUpperCase();
    }).filter(Boolean);
    var baseCode = "";
    var addonCodes = [];
    tokens.forEach(function (tok) {
      var item = cat.byCode[tok];
      if ((item && item.isAddon) || tok.indexOf("INS-EXT") === 0) {
        if (addonCodes.indexOf(tok) === -1) addonCodes.push(tok);
      } else if (!baseCode) {
        baseCode = tok;
      }
    });
    if (!baseCode) baseCode = "INS-NONE";
    if (baseCode === "INS-NONE") addonCodes = [];
    return { baseCode: baseCode, addonCodes: addonCodes };
  }

  function buildCombinedInsuranceClauseEng(baseCode, addonCodes, incotermCode) {
    var cat = getInsuranceCatalogFromRates();
    var bCode = String(baseCode || "INS-NONE").trim().toUpperCase();
    if (!bCode || bCode === "INS-NONE") return "";
    var baseItem = cat.byCode[bCode];
    var baseText = stripInternalRateFromClause(baseItem ? (baseItem.Contract_Text_ENG || baseItem.Fee_Name_VIE) : bCode);
    var inc = String(incotermCode || "").trim().toUpperCase();
    if (inc === "CIP" && /\b110%\s*CIF\b/i.test(baseText)) {
      baseText = baseText.replace(/\b110%\s*CIF\b/gi, "110% CIP");
    }
    var addonTexts = [];
    (addonCodes || []).forEach(function (ac) {
      var aItem = cat.byCode[String(ac || "").trim().toUpperCase()];
      if (!aItem) return;
      var txt = stripInternalRateFromClause(aItem.Contract_Text_ENG || aItem.Fee_Name_VIE || ac);
      if (!txt) return;
      txt = txt.replace(/^incl\.?\s*/i, "").trim();
      if (txt && addonTexts.indexOf(txt) === -1) addonTexts.push(txt);
    });
    if (addonTexts.length > 0) {
      return baseText + " incl. " + addonTexts.join("; ");
    }
    return baseText;
  }

  function formatInsuranceContractTextForOrder(rawInsCode, incotermCode) {
    var parsed = parseInsuranceCodeString(rawInsCode);
    if (!parsed.baseCode || parsed.baseCode === "INS-NONE") return "";
    var eng = buildCombinedInsuranceClauseEng(parsed.baseCode, parsed.addonCodes, incotermCode);
    return eng || parsed.baseCode;

      };
    }
    if (inc === "CIP") {
      return {
        baseCode: "INS-ICC-A",

        reason: "CIP theo Incoterms 2020 bắt buộc mức bảo hiểm tối thiểu cao nhất ICC (A) (INS-ICC-A)."

    }
    return {

      addonCodes: ["INS-EXT-SWH"],
      reason: "Nông sản khô (DC) xuất CIF → Đề xuất INS-ICC-C + mở rộng INS-EXT-SWH (hấp hơi, nóng ẩm)."

  function getSelectedInsuranceSelection() {
    var cat = getInsuranceCatalogFromRates();
    var sel = document.getElementById("calc-insurance-code");
    var baseCode = sel ? String(sel.value || "INS-NONE").trim().toUpperCase() : "INS-ICC-C";
    if (!cat.byCode[baseCode]) baseCode = "INS-NONE";
    var baseItem = cat.byCode[baseCode];
    var baseRatePct = baseCode === "INS-NONE" ? 0 : Math.max(0, toNum(baseItem && baseItem.Standard_Rate));

    var addonCodes = [];
    var addonsRatePct = 0;
    if (baseCode !== "INS-NONE") {
      var chks = document.querySelectorAll(".calc-insurance-addon-chk:checked");
      for (var i = 0; i < chks.length; i++) {
        var ac = String(chks[i].value || "").trim().toUpperCase();
        if (!ac || addonCodes.indexOf(ac) !== -1) continue;
        addonCodes.push(ac);
        var aItem = cat.byCode[ac];
        addonsRatePct += Math.max(0, toNum(aItem ? aItem.Standard_Rate : chks[i].getAttribute("data-rate")));
      }
    }
    var totalRatePct = Math.round((baseRatePct + addonsRatePct) * 10000) / 10000;
    var incCode = String((document.getElementById("calc-rec-incoterm") || {}).value || "CIF").trim().toUpperCase();
    var combinedCode = baseCode === "INS-NONE"
      ? "INS-NONE"
      : (addonCodes.length > 0 ? (baseCode + " + " + addonCodes.join(" + ")) : baseCode);
    var clauseEng = buildCombinedInsuranceClauseEng(baseCode, addonCodes, incCode);

    return {
      baseCode: baseCode,
      addonCodes: addonCodes,
      combinedCode: combinedCode,

    renderInsuranceControlsFromRates();

    var chkIns = document.getElementById("chk-include-insurance");

    for (var i = 0; i < chks.length; i++) {

  function getSchedulePodsForCountry(countryVal) {
    var target = String(countryVal || "").trim().toLowerCase();
    var podMap = {};
    (APP_DATA.schedules || []).forEach(function (s) {
      var pod = String(s["POD"] || "").trim();
      if (!pod) return;
      var sCountry = String(s["Country"] || "").trim().toLowerCase();
      if (!target || sCountry === target) {
        podMap[pod] = true;
      }
    });
    return Object.keys(podMap).sort();
  }

  function syncPricingPodDropdownForCountry() {
    var cCountry = document.getElementById("calc-country");
    var cPod = document.getElementById("calc-pod");
    if (!cPod) return;
    var countryVal = cCountry ? String(cCountry.value || "").trim() : "";
    var prevPod = String(cPod.value || "").trim();
    var pods = getSchedulePodsForCountry(countryVal);
    cPod.innerHTML = '<option value="">-- Tất cả cảng đến --</option>' + pods.map(function (pod) {
      return '<option value="' + pod.replace(/"/g, "&quot;") + '">' + escHtmlText(pod) + '</option>';
    }).join("");
    if (prevPod && pods.indexOf(prevPod) !== -1) {
      cPod.value = prevPod;
    } else {
      cPod.value = "";
    }
    if (typeof window.syncSearchableCombo === "function") {
      window.syncSearchableCombo(cPod, true);
    }
  }

    var cCountry = document.getElementById("calc-country");
    var cPod = document.getElementById("calc-pod");
    var prevPod = cPod ? String(cPod.value || "").trim() : "";
    var countryVal = cCountry ? String(cCountry.value || "").trim() : "";

      if (!activeSch || (countryVal && schCountry !== countryVal.toLowerCase())) {
        SELECTED_SCHEDULE_ID = "";

  function onPricingPodChange() {
    var cPod = document.getElementById("calc-pod");
    var cCountry = document.getElementById("calc-country");
    var podVal = cPod ? String(cPod.value || "").trim() : "";
    if (podVal && cCountry) {
      var matchedSch = (APP_DATA.schedules || []).find(function (s) {
        return String(s["POD"] || "").trim() === podVal && String(s["Country"] || "").trim() !== "";
      });
      if (matchedSch) {
        var schCountry = String(matchedSch["Country"] || "").trim();
        if (cCountry.value !== schCountry) {
          var hasOpt = false;
          for (var i = 0; i < cCountry.options.length; i++) {
            if (cCountry.options[i].value === schCountry) { hasOpt = true; break; }
          }
          if (!hasOpt) {
            var opt = document.createElement("option");
            opt.value = schCountry;
            opt.textContent = schCountry;
            cCountry.appendChild(opt);
          }
          cCountry.value = schCountry;
          syncPricingPodDropdownForCountry();
          cPod.value = podVal;
          if (typeof window.syncSearchableCombo === "function") {
            window.syncSearchableCombo(cCountry, true);
            window.syncSearchableCombo(cPod, true);
          }
        }
      }
    }
    if (SELECTED_SCHEDULE_ID && podVal) {
      var curSch = (APP_DATA.schedules || []).find(function (s) { return s["Schedule_ID"] === SELECTED_SCHEDULE_ID; });
      if (!curSch || String(curSch["POD"] || "").trim() !== podVal) {
        SELECTED_SCHEDULE_ID = "";

    recalculatePricing();

  function onPricingOrderChange() {
    var orderId = document.getElementById("calc-order-id").value;
    var summary = document.getElementById("calc-order-summary");
    var qNoBadge = document.getElementById("calc-next-quotation-no");
    var negBanner = document.getElementById("calc-negotiation-banner");

    SELECTED_SCHEDULE_ID = "";

    resetAiAdvisorState();

    if (!orderId) {
      PRICING_ITEMS_STATE = [];
      summary.classList.add("hidden");
      if (qNoBadge) qNoBadge.classList.add("hidden");
      if (negBanner) negBanner.classList.add("hidden");
      var cCountryEmpty = document.getElementById("calc-country");
      if (cCountryEmpty) cCountryEmpty.value = "";
      syncPricingPodDropdownForCountry();
      syncFwdCompareVisibilityForMix(false, true);
      filterPricingSchedules();
      recalculatePricing();
      return;
    }
    var inq = (APP_DATA.inquiries || []).find(function (i) { return i["Order_ID"] === orderId; });
    if (!inq) return;

    var roundNum = getQuoteRoundFromStatus(inq["Inquiry_Status"], inq["Quote_Round"]);
    var nextQ = generateNextQuotationNoJS(orderId, roundNum);
    if (qNoBadge) {
      qNoBadge.textContent = "Số báo giá dự kiến: " + nextQ.quotationNo;
      qNoBadge.classList.remove("hidden");
    }

    var cleanNote = stripItemsTag(inq["Note"]);
    var isReprice = isRepriceRequestedStatus(inq["Inquiry_Status"]);
    var reasonsTxt = String(inq["Reprice_Reasons"] || "").trim();
    var minMarginEl = document.getElementById("calc-min-margin");
    var floorEl = document.getElementById("calc-floor-price");
    var priorProp = (APP_DATA.proposals || []).slice().reverse().find(function (p) {
      return String(p["Order ID"] || p["Order_ID"] || "") === String(orderId || "");
    });
    if (minMarginEl) minMarginEl.value = (priorProp && toNum(priorProp["Min_Margin_Pct"]) > 0) ? toNum(priorProp["Min_Margin_Pct"]) : 5;
    if (floorEl) floorEl.setAttribute("data-manual-floor", "0");

    if (negBanner) {
      if (isReprice || roundNum >= 2 || reasonsTxt || cleanNote) {
        var reasonPills = reasonsTxt
          ? reasonsTxt.split(/[;,]+/).map(function (r) { return r.trim(); }).filter(Boolean).map(function (r) {
              return '<span class="inline-block px-2 py-0.5 rounded bg-amber-100 border border-amber-300 text-[11px] font-semibold text-amber-900 mr-1 mb-1">' + escHtmlText(r) + '</span>';
            }).join("")
          : "";
        negBanner.innerHTML =
          '<div class="font-bold text-amber-900">' + (isReprice || roundNum >= 2 ? ('Lịch sử Thương lượng / Tính giá lại — Lần ' + roundNum + ' (' + nextQ.quotationNo + ')') : 'Ghi chú đơn hàng') + ':</div>' +
          (reasonPills ? '<div class="mt-1">' + reasonPills + '</div>' : '') +
          '<div class="text-amber-800 mt-0.5">' + escHtmlText(cleanNote || "Khách đề nghị rà soát lại phương án giá.") + '</div>';
        negBanner.classList.remove("hidden");
      } else {
        negBanner.classList.add("hidden");
      }
    }

    var calcNoteEl = document.getElementById("calc-note");
    if (calcNoteEl) calcNoteEl.value = "";

    var cus = (APP_DATA.consignees || []).find(function (c) { return c["Consignee_ID"] === inq["Consignee_ID"]; });
    // Auto-sync Country <-> POD theo Consignee_Directory
    var cCountryEl = document.getElementById("calc-country");
    var cPodEl = document.getElementById("calc-pod");
    var custCountry = cus ? String(cus["Country"] || "").trim() : "";
    if (cCountryEl) {
      if (custCountry) {
        var matchedOpt = false;
        for (var ci = 0; ci < cCountryEl.options.length; ci++) {
          if (cCountryEl.options[ci].value.toLowerCase() === custCountry.toLowerCase()) {
            cCountryEl.value = cCountryEl.options[ci].value;
            matchedOpt = true;
            break;
          }
        }
        if (!matchedOpt) {
          var newOpt = document.createElement("option");
          newOpt.value = custCountry;
          newOpt.textContent = custCountry;
          cCountryEl.appendChild(newOpt);
          cCountryEl.value = custCountry;
        }
      } else {
        cCountryEl.value = "";
      }
      if (typeof window.syncSearchableCombo === "function") {
        window.syncSearchableCombo(cCountryEl, true);
      }
    }
    if (cPodEl) cPodEl.value = "";
    syncPricingPodDropdownForCountry();

    var items = parseOrderItems(inq);
    PRICING_ITEMS_STATE = items.map(function (it) {
      return {
        sku: it.sku,
        name: it.name,
        weight: toNum(it.weight),
        packingCode: it.packingCode || "",
        packingName: it.packingName || "",
        packingExtra: toNum(it.packingExtra || 0),
        palletCode: it.palletCode || "PKG-PLT-NO",
        cartons: toNum(it.cartons || 0),
        pallets: 0,
        packingCost: toNum(it.packingCost || 0)
      };
    });

    var orderUsesPallet = (inq["Use_Pallet"] === true || String(inq["Use_Pallet"] || "").toUpperCase() === "TRUE") ||
      items.some(function (it) { return String(it.palletCode || "").toUpperCase() === "PKG-PLT-YES"; });
    var calcPalletChk = document.getElementById("calc-use-pallet");
    if (calcPalletChk) calcPalletChk.checked = orderUsesPallet;
    var calcPalletRateEl = document.getElementById("calc-pallet-rate");

    var dryWeight = 0;
    var reeferWeight = 0;

    PRICING_ITEMS_STATE.forEach(function (it) {
      var prod = getProductBySku(it.sku);
      var reefer = isReeferProduct(prod, it.name);
      if (reefer) reeferWeight += toNum(it.weight);
      else dryWeight += toNum(it.weight);
    });

    var suggestedCo = suggestCoFormCode("", custCountry);
    var custNameDisplay = (cus && cus["Consignee_Name"]) ? String(cus["Consignee_Name"]).trim() : String(inq["Consignee_ID"] || "-").trim();
    var custInfoEl = document.getElementById("calc-cust-info");
    if (custInfoEl) {
      var metaParts = [];
      if (custCountry) {
        metaParts.push('<span class="inline-flex items-center px-2 py-0.5 rounded-md bg-[#aed6c6] border border-[#186635] text-[11px] font-semibold text-[#0b2418]">' + escHtmlText(custCountry) + '</span>');
      }
      if (suggestedCo) {
        metaParts.push('<span class="inline-flex items-center px-2 py-0.5 rounded-md bg-[#0f4a33] border border-[#186635] text-[11px] font-bold text-[#f4d98a]">C/O: ' + escHtmlText(suggestedCo) + '</span>');
      }
      custInfoEl.innerHTML =
        '<div class="calc-cust-name text-sm font-bold text-[#0b2418] leading-snug">' + escHtmlText(custNameDisplay || "-") + '</div>' +
        (metaParts.length ? '<div class="calc-cust-meta">' + metaParts.join("") + '</div>' : '');
    }
    document.getElementById("calc-net-weight").textContent = fmtNumber(inq["Net_Weight_KGs"]) + " KG";
    document.getElementById("calc-dry-weight").textContent = fmtNumber(dryWeight) + " KG";
    document.getElementById("calc-reefer-weight").textContent = fmtNumber(reeferWeight) + " KG";
    var rMode = String(inq["Quotation_Mode"] || "").toUpperCase();
    document.getElementById("calc-req-incoterm").textContent = (inq["Incoterm mong muốn"] || "-") + ((rMode === "COMPARE" || rMode === "COMPARISON") ? " (Đa ĐK)" : "");
    renderPricingItemsBreakdown();
    summary.classList.remove("hidden");

    // Tự tính tổ hợp Container tối ưu theo Trọng lượng thực tế + Thể tích (CBM) + Pallet
    applyOptimalContainerMix(true);

    var recCode = inq["Incoterm mong muốn"] ? String(inq["Incoterm mong muốn"]).toUpperCase() : "CIF";
    var chks = document.querySelectorAll(".calc-proposed-inc-chk");
    var initList = [recCode];
    if (rMode === "COMPARE" || rMode === "COMPARISON") {
      ["FOB", "CIF", "CIP"].forEach(function (c) {
        if (initList.indexOf(c) === -1 && initList.length < 3) initList.push(c);
      });
    }
    for (var k = 0; k < chks.length; k++) {
      chks[k].checked = initList.indexOf(String(chks[k].value || "").toUpperCase()) !== -1;
    }
    updateProposedIncotermsBadge();

    var recIncEl = document.getElementById("calc-rec-incoterm");
    if (recIncEl) {
      recIncEl.value = recCode;
      if (typeof window.syncSearchableCombo === "function") window.syncSearchableCombo(recIncEl, true);
    }
    onIncotermSelectionChange();
    filterPricingSchedules();
  }
