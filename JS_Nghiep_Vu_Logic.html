  function computeLocalChargesForMix(mix, sch) {
    if (mix.total === 0 && !mix.hasLcl) return 0;
    // Phí cảng nội địa (Local Origin Charges) chỉ đọc từ bảng Pricing_Rates (LOCAL_CHARGE).
    // Toàn bộ THC hãng tàu, Bill/Seal, BAF, LSS, PSS được cộng riêng vào Phụ phí tàu (computeScheduleOceanAndMissing)
    // để đảm bảo FOB không bị cộng phụ phí hãng tàu và CFR/CIF/CIP không bị tính trùng.
    var localTotal = 0;
    var list = getEffectiveLocalCharges();
    list.forEach(function (lc) {
      var code = String(lc["Charge_Code"] || "").toUpperCase();
      var appCont = String(lc["Applicable_ContType"] || "").toUpperCase().replace(/'/g, "");
      var unit = String(lc["Unit"] || "").toLowerCase();
      var fee = toNum(lc["Standard_Fee"]);

      if (unit.indexOf("cont") === -1) {
        localTotal += fee;
      } else if (mix.total === 0) {
        // Lô 100% LCL không phát sinh phí theo Container nguyên FCL
      } else if (code.indexOf("REEFER-PLUG") !== -1 || code.indexOf("PLUG") !== -1 || code.indexOf("PTI") !== -1) {
        localTotal += fee * mix.reefer;
      } else if (appCont === "20DC" || appCont === "20GP") {
        localTotal += fee * mix.q20dc;
      } else if (appCont === "40DC" || appCont === "40GP") {
        localTotal += fee * mix.q40dc;
      } else if (appCont === "40HC") {
        localTotal += fee * mix.q40hc;
      } else if (appCont === "20RF") {
        localTotal += fee * mix.q20rf;
      } else if (appCont === "40RF") {
        localTotal += fee * mix.q40rf;
      } else if (appCont === "40RH") {
        localTotal += fee * mix.q40rh;
      } else if (appCont === "RF" || appCont === "REEFER") {
        localTotal += fee * mix.reefer;
      } else if (appCont === "DC" || appCont === "DRY") {
        localTotal += fee * mix.dry;
      } else {
        localTotal += fee * mix.total;
      }
    });
    return localTotal;
  }

  function computeCustomsSplitForPricing() {
    var customsExportUsd = 0;
    var permitsUsd = 0;
    getEffectiveCustomsFees().forEach(function (cf) {
      var name = String(cf["Service_Name"] || cf["Fee_Name_VIE"] || cf["Service_Code"] || "").toLowerCase();
      var fee = toNum(cf["Standard_Fee"]);
      if (/kiểm dịch|phytosanitary|hun trùng|fumigation|c\/o|chứng nhận/i.test(name)) {
        permitsUsd += fee;
      } else {
        customsExportUsd += fee;
      }
    });
    return {
      customsExportUsd: Math.round(customsExportUsd * 100) / 100,
      permitsUsd: Math.round(permitsUsd * 100) / 100,
      customsTotal: Math.round((customsExportUsd + permitsUsd) * 100) / 100
    };
  }

  function computeScheduleOceanAndMissing(sch, mix) {
    if (!sch) {
      var fallbackLcl = Math.round(toNum(mix && mix.lclFreight) * 100) / 100;
      return { ocean: fallbackLcl, fclOcean: 0, lclOcean: fallbackLcl, surcharge: 0, missing: [] };
    }
    var r20dc = toNum(sch["Rate_20DC"]);
    var r40dc = toNum(sch["Rate_40DC"]);
    var r40hc = toNum(sch["Rate_40HC"]) || (r40dc > 0 ? Math.round(r40dc * 1.05) : 0);
    var r20rf = toNum(sch["Rate_20'RF"]);
    var r40rf = toNum(sch["Rate_40'RF"]);
    var r40rh = toNum(sch["Rate_40'RH"]) || (r40rf > 0 ? Math.round(r40rf * 1.05) : 0);

    var missing = [];
    if (mix.q20dc > 0 && r20dc <= 0) missing.push("20'DC");
    if (mix.q40dc > 0 && r40dc <= 0) missing.push("40'DC");
    if (mix.q40hc > 0 && r40hc <= 0) missing.push("40'HC");
    if (mix.q20rf > 0 && r20rf <= 0) missing.push("20'RF");
    if (mix.q40rf > 0 && r40rf <= 0) missing.push("40'RF");
    if (mix.q40rh > 0 && r40rh <= 0) missing.push("40'RH");

    var thc20d = toNum(sch["THC_20_Dry"]);
    var thc40d = toNum(sch["THC_40_Dry"]);
    var thc20r = toNum(sch["THC_20_Reefer"]);
    var thc40r = toNum(sch["THC_40_Reefer"]);
    var billSealShipment = toNum(sch["Bill_Seal_Fee_Shipment"]);
    var blFee = toNum(sch["B/L_Fee"]);
    var sealFee = toNum(sch["Seal_Fee"]);
    var bafFee = toNum(sch["BAF_Fee"]);
    var lssFee = toNum(sch["LSS_Fee"]);
    var pssFee = toNum(sch["PSS_Fee"]);
    var perContFuelPeak = bafFee + lssFee + pssFee;

    var dry40Count = (mix.q40dc || 0) + (mix.q40hc || 0);
    var rf40Count = (mix.q40rf || 0) + (mix.q40rh || 0);

    var fclOcean = (mix.q20dc * r20dc) + (mix.q40dc * r40dc) + (mix.q40hc * r40hc) + (mix.q20rf * r20rf) + (mix.q40rf * r40rf) + (mix.q40rh * r40rh);
    var fclSurcharge = 0;
    if (mix.total > 0) {
      var fclThc = (mix.q20dc * thc20d) + (dry40Count * thc40d) + (mix.q20rf * thc20r) + (rf40Count * thc40r);
      var docSealFee = billSealShipment > 0 ? billSealShipment : (blFee + sealFee * mix.total);
      fclSurcharge = fclThc + docSealFee + (perContFuelPeak * mix.total);
    }

    var lclOcean = 0;
    var lclSurcharge = 0;
    if (mix.hasLcl) {
      var explicitLclRate = toNum(sch["LCL_Rate_CBM"] || sch["LCL_Rate_WM"] || sch["LCL_Rate"] || sch["Rate_LCL"]);
      var lclDryWm = mix.lclDryWm !== undefined ? mix.lclDryWm : (mix.dryMode === "LCL" ? Math.max((mix.lclWeightKg || 0) / 1000, mix.lclCbm || 0) : 0);
      var lclRfWm = mix.lclRfWm !== undefined ? mix.lclRfWm : (mix.reeferMode === "LCL" ? Math.max((mix.lclWeightKg || 0) / 1000, mix.lclCbm || 0) : 0);
      if (lclDryWm <= 0 && lclRfWm <= 0) {
        var fallbackWm = Math.max((mix.lclWeightKg || 0) / 1000, mix.lclCbm || 0);
        if (mix.reeferMode === "LCL") lclRfWm = fallbackWm;
        else lclDryWm = fallbackWm;
      }

      if (lclDryWm > 0) {
        var base20Dry = r20dc > 0 ? r20dc : (r40dc > 0 ? r40dc * 0.65 : (r40hc > 0 ? r40hc * 0.6 : 0));
        var dryUnitWm = explicitLclRate > 0 ? explicitLclRate : (base20Dry > 0 ? (base20Dry / 28) : (mix.lclRate || 0));
        if (dryUnitWm <= 0) missing.push("LCL Khô");
        lclOcean += dryUnitWm * lclDryWm;
        var dryRatio = lclDryWm / 28;
        var dryThcBase = thc20d > 0 ? thc20d : (thc40d > 0 ? thc40d * 0.65 : 0);
        lclSurcharge += dryRatio * (dryThcBase + perContFuelPeak);
      }
      if (lclRfWm > 0) {
        var base20Rf = r20rf > 0 ? r20rf : (r40rf > 0 ? r40rf * 0.65 : (r40rh > 0 ? r40rh * 0.6 : (r20dc > 0 ? r20dc * 1.45 : 0)));
        var rfUnitWm = explicitLclRate > 0 ? explicitLclRate : (base20Rf > 0 ? (base20Rf / 24) : (mix.lclRate || 0));
        if (rfUnitWm <= 0) missing.push("LCL Lạnh");
        lclOcean += rfUnitWm * lclRfWm;
        var rfRatio = lclRfWm / 24;
        var rfThcBase = thc20r > 0 ? thc20r : (thc40r > 0 ? thc40r * 0.65 : thc20d);
        lclSurcharge += rfRatio * (rfThcBase + perContFuelPeak);
      }
      if (mix.total === 0) {
        lclSurcharge += (billSealShipment > 0 ? billSealShipment : blFee);
      }
    }

    var ocean = Math.round((fclOcean + lclOcean) * 100) / 100;
    var surcharge = Math.round((fclSurcharge + lclSurcharge) * 100) / 100;
    return {
      ocean: ocean,
      fclOcean: Math.round(fclOcean * 100) / 100,
      lclOcean: Math.round(lclOcean * 100) / 100,
      surcharge: surcharge,
      missing: missing
    };
  }

  function computeCostComponentsForPricing() {
    var mix = getContainerMixState();
    var sch = (APP_DATA.schedules || []).find(function (s) { return s["Schedule_ID"] === SELECTED_SCHEDULE_ID; });
    var schRes = computeScheduleOceanAndMissing(sch, mix);
    var localTotal = computeLocalChargesForMix(mix, sch);
    var customsSplit = computeCustomsSplitForPricing();
    var customsTotal = customsSplit.customsTotal;

    var goodsCost = toNum(document.getElementById("calc-goods-cost").value);
    var packingPalletCost = toNum((document.getElementById("calc-packing-cost") || {}).value);
    var insuranceVal = toNum(document.getElementById("calc-insurance").value);
    if (insuranceVal === 0 && goodsCost > 0) {
      var ratePct = getSelectedInsuranceRatePct();
      var cifBase = goodsCost + packingPalletCost + schRes.ocean + schRes.surcharge + localTotal + customsTotal;
      insuranceVal = Number((cifBase * 1.1 * (ratePct / 100)).toFixed(2));
    }
    var marginPct = toNum(document.getElementById("calc-margin").value);
    var destExtra = toNum(document.getElementById("calc-dest-extra").value);

    return {
      ocean: schRes.ocean,
      surcharge: schRes.surcharge,
      localTotal: localTotal,
      customsTotal: customsTotal,
      customsExportUsd: customsSplit.customsExportUsd,
      permitsUsd: customsSplit.permitsUsd,
      goodsCost: goodsCost,
      packingPalletCost: packingPalletCost,
      defaultIns: insuranceVal,
      marginPct: marginPct,
      destExtra: destExtra
    };
  }

  function resolveOptimalIncotermPick(codes) {
    if (!codes || codes.length < 2) return null;
    if (AI_BEST_TERM && codes.indexOf(AI_BEST_TERM) !== -1) {
      return {
        code: AI_BEST_TERM,
        reason: AI_BEST_REASON || "Được Trợ lý AI đề xuất tối ưu theo hồ sơ đơn hàng & Cẩm nang Incoterms 2020."
      };
    }
    var orderId = (document.getElementById("calc-order-id") || {}).value || "";
    var inq = (APP_DATA.inquiries || []).find(function (i) { return i["Order_ID"] === orderId; });
    var payment = String((inq && inq["Phương thức thanh toán đề xuất"]) || "").toLowerCase();
    var desired = String((inq && inq["Incoterm mong muốn"]) || "").toUpperCase();
    var mix = getContainerMixState();
    var isCold = mix.reefer > 0 || (PRICING_ITEMS_STATE || []).some(function (it) {
      return isReeferProduct(getProductBySku(it.sku), it.name);
    });

    if (isCold && codes.indexOf("CIP") !== -1) {
      return { code: "CIP", reason: "Lô hàng lạnh (RF) giá trị cao — CIP bảo hiểm mọi rủi ro ICC (A) bảo vệ tối ưu." };
    }
    if ((payment.indexOf("l/c") !== -1 || payment.indexOf("d/p") !== -1) && codes.indexOf("CIF") !== -1) {
      return { code: "CIF", reason: "Thanh toán L/C hoặc D/P — CIF giúp người bán giữ quyền kiểm soát vận đơn & bảo hiểm." };
    }
    if (desired && codes.indexOf(desired) !== -1) {
      return { code: desired, reason: "Khớp điều kiện " + desired + " đối tác yêu cầu đồng thời cân bằng chi phí logistics." };
    }
    if (codes.indexOf("CIF") !== -1) {
      return { code: "CIF", reason: "Cân bằng tốt giữa kiểm soát cước tàu, bảo hiểm và giá chào cạnh tranh." };
    }
    if (codes.indexOf("FOB") !== -1) {
      return { code: "FOB", reason: "Minh bạch giá vốn + phí cảng nội địa, hạn chế rủi ro biến động cước biển." };
    }
    return { code: codes[0], reason: "Phương án cân đối nhất trong nhóm Incoterms đã tích chọn." };
  }

  function applyOptimalIncotermToKhung4() {
    if (!CURRENT_OPTIMAL_INCOTERM) return;
    selectIncotermFromMatrix(CURRENT_OPTIMAL_INCOTERM);
  }

  function renderIncotermComparisonTable() {
    var khung3 = document.getElementById("pricing-khung-3");
    var tbody = document.getElementById("incoterm-compare-tbody");
    var countEl = document.getElementById("pricing-khung-3-count");
    var optBanner = document.getElementById("pricing-optimal-banner");
    var optCodeEl = document.getElementById("pricing-optimal-code");
    var optReasonEl = document.getElementById("pricing-optimal-reason");

    var selectedCodes = getSelectedProposedIncoterms();
    renderKhung4IncotermPills(selectedCodes);

    // Chỉ hiển thị Khung 3 khi người dùng tích chọn từ 2 điều kiện Incoterms trở lên
    if (selectedCodes.length < 2) {
      if (khung3) khung3.classList.add("hidden");
      CURRENT_OPTIMAL_INCOTERM = "";
      if (optBanner) optBanner.classList.add("hidden");
      return;
    }

    if (khung3) khung3.classList.remove("hidden");
    if (countEl) countEl.textContent = selectedCodes.length + " điều kiện";
    if (!tbody) return;

    var currentRec = String((document.getElementById("calc-rec-incoterm") || {}).value || "").toUpperCase();
    var comp = computeCostComponentsForPricing();
    var goodsAndPack = comp.goodsCost + comp.packingPalletCost;

    var rows = INCOTERMS_2020_MATRIX.filter(function (row) {
      return selectedCodes.indexOf(row.code) !== -1;
    });

    var optimal = resolveOptimalIncotermPick(rows.map(function (r) { return r.code; }));
    CURRENT_OPTIMAL_INCOTERM = optimal ? optimal.code : "";
    if (optBanner && optCodeEl && optReasonEl) {
      if (optimal) {
        optCodeEl.textContent = optimal.code;
        optReasonEl.textContent = "— " + optimal.reason;
        optBanner.classList.remove("hidden");
      } else {
        optBanner.classList.add("hidden");
      }
    }

    var iccARatePct = 0.25;
    (APP_DATA.pricingRates || []).forEach(function (r) {
      var fc = String(r["Fee_Code"] || "").trim().toUpperCase();
      var fn = String(r["Fee_Name_VIE"] || "").toUpperCase();
      if (fc === "INS-ICC-A" || fn.indexOf("ICC (A)") !== -1 || fn.indexOf("ICC A") !== -1) {
        var rv = toNum(r["Standard_Rate"] !== undefined && r["Standard_Rate"] !== "" ? r["Standard_Rate"] : r["Standard_Fee"]);
        if (rv > 0 && rv < 10) iccARatePct = rv;
      }
    });

    tbody.innerHTML = rows.map(function (row) {
      var exwVal = Math.round(goodsAndPack * (1 + comp.marginPct / 100) * 100) / 100;
      var localAndCustoms = row.includeLocal ? (comp.localTotal + comp.customsTotal) : 0;
      var freight = row.includeFreight ? (comp.ocean + comp.surcharge) : 0;
      var dest = row.includeDest ? comp.destExtra : 0;
      var appliedFees = Math.round((localAndCustoms + freight + dest) * 100) / 100;
      var ins = 0;
      var insClauseLabel = "";
      if (row.code === "CIF") {
        var rCif = 0.0008;
        var vCif = ((exwVal + appliedFees) * 1.1) / (1 - rCif);
        ins = Math.round((rCif * vCif) * 100) / 100;
        insClauseLabel = "ICC C (0.08%)";
      } else if (row.code === "CIP") {
        var rCip = iccARatePct / 100;
        var vCip = ((exwVal + appliedFees) * 1.1) / (1 - rCip);
        ins = Math.round((rCip * vCip) * 100) / 100;
        insClauseLabel = "ICC A (" + iccARatePct.toFixed(2) + "%)";
      }
      var estimatedSell = Math.round((exwVal + appliedFees + ins) * 100) / 100;
      var isActive = currentRec === row.code;
      var isBest = optimal && optimal.code === row.code;

      var evalBadge = isBest
        ? '<span class="incoterm-eval-badge bg-[#f4d98a] text-[#07281c] border border-[#186635]">★ Đề xuất tối ưu</span>'
        : (isActive ? renderStatusBadge("Đang chốt K4", "success") : renderStatusBadge("So sánh", "neutral"));

      var rowCls = isBest
        ? "bg-[#f4d98a]/35 font-semibold"
        : (isActive ? "bg-[#aed6c6] font-semibold" : "");

      var insSubTag = insClauseLabel
        ? '<div class="text-[10px] text-[#0f4a33] font-sans font-bold">' + insClauseLabel + '</div>'
        : '';

      return '<tr class="' + rowCls + '">' +
        '<td class="py-2.5 px-2.5 font-mono font-bold text-[#0b2418] whitespace-nowrap">' + row.code + '</td>' +
        '<td class="py-2.5 px-2.5 text-[#0b2418]">' + row.freightLabel + '</td>' +
        '<td class="py-2.5 px-2.5 text-[#0b2418]">' + row.insLabel + '</td>' +
        '<td class="py-2.5 px-2.5 text-[#1e4231]">' + row.riskLabel + '</td>' +
        '<td class="py-2.5 px-2.5 text-right font-mono tabular-nums whitespace-nowrap text-[#0b2418]">' + fmtUSD(exwVal) + '</td>' +
        '<td class="py-2.5 px-2.5 text-right font-mono tabular-nums whitespace-nowrap text-[#0b2418]">' + fmtUSD(appliedFees) + '</td>' +
        '<td class="py-2.5 px-2.5 text-right font-mono tabular-nums whitespace-nowrap text-[#0b2418]"><div>' + fmtUSD(ins) + '</div>' + insSubTag + '</td>' +
        '<td class="py-2.5 px-2.5 text-right font-mono font-bold text-[#07281c] tabular-nums whitespace-nowrap">' + fmtUSD(estimatedSell) + '</td>' +
        '<td class="py-2.5 px-1.5 text-center">' + evalBadge + '</td>' +
        '<td class="py-2.5 px-2 text-center whitespace-nowrap">' +
          '<button type="button" onclick="selectIncotermFromMatrix(\'' + row.code + '\')" class="incoterm-action-btn transition-colors ' +
            (isActive ? 'bg-[#0f4a33] text-[#fff5d6] border border-[#186635]' : 'bg-[#aed6c6] border-[1.5px] border-[#186635] text-[#0b2418] hover:bg-[#f4d98a]') + '">' +
            (isActive ? 'Đang chọn' : 'Áp dụng') +
          '</button>' +
        '</td>' +
      '</tr>';
    }).join("");
  }

  function selectIncotermFromMatrix(code) {
    document.getElementById("calc-rec-incoterm").value = code;
    onIncotermSelectionChange();
  }

  function onIncotermSelectionChange() {
    var inc = String(document.getElementById("calc-rec-incoterm").value || "").toUpperCase();
    var chkFreight = document.getElementById("chk-include-freight");
    var chkIns = document.getElementById("chk-include-insurance");
    var insSel = document.getElementById("calc-insurance-code");

    var rule = INCOTERMS_2020_MATRIX.find(function (x) { return x.code === inc; });
    if (rule) {
      chkFreight.checked = rule.includeFreight;
      chkIns.checked = rule.includeIns;
      if (!rule.includeIns) {
        if (insSel) insSel.value = "INS-NONE";
        document.getElementById("calc-insurance").value = "0.00";
      } else {
        if (insSel && insSel.value === "INS-NONE") {
          insSel.value = inc === "CIP" ? "INS-ICC-A" : "INS-ICC-C";
        }
        var comp = computeCostComponentsForPricing();
        var ratePct = getSelectedInsuranceRatePct();
        if (toNum(document.getElementById("calc-insurance").value) === 0 && comp.goodsCost > 0) {

          document.getElementById("calc-insurance").value = (cifBase * 1.1 * (ratePct / 100)).toFixed(2);

  function filterPricingSchedules() {
    var countryEl = document.getElementById("calc-country");
    var podEl = document.getElementById("calc-pod");
    var country = countryEl ? String(countryEl.value || "").trim().toLowerCase() : "";
    var pod = podEl ? String(podEl.value || "").trim() : "";
    var mix = getContainerMixState();
    updateContainerMixBadge();

    var list = (APP_DATA.schedules || []).filter(function (s) {
      if (country && String(s["Country"] || "").trim().toLowerCase() !== country) return false;
      if (pod && String(s["POD"] || "").trim() !== pod) return false;
      return true;
    });

    var tbody = document.getElementById("calc-schedule-compare-tbody");
    if (!tbody) return;
    if (list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="py-4 text-center text-[#1e4231] font-medium">Không có tuyến tàu nào phù hợp với Quốc gia / Cảng đến đã chọn.</td></tr>';
      return;
    }

    var hasReeferCargo = (PRICING_ITEMS_STATE || []).some(function (it) {
      return isReeferProduct(getProductBySku(it.sku), it.name);
    });
    var leadDays = (hasReeferCargo || mix.reefer > 0) ? 7 : 5;
    var earliestFeasible = new Date();
    earliestFeasible.setHours(0, 0, 0, 0);
    earliestFeasible.setDate(earliestFeasible.getDate() + leadDays);

    var evaluated = list.map(function (s) {
      var res = computeScheduleOceanAndMissing(s, mix);
      var hasMissing = res.missing.length > 0;
      var etdDate = s["ETD"] ? new Date(s["ETD"]) : null;
      var etaDate = s["ETA"] ? new Date(s["ETA"]) : null;
      if (etdDate && !isNaN(etdDate.getTime())) etdDate.setHours(0, 0, 0, 0);
      if (etaDate && !isNaN(etaDate.getTime())) etaDate.setHours(0, 0, 0, 0);
      var isTooTight = Boolean(etdDate && !isNaN(etdDate.getTime()) && etdDate.getTime() < earliestFeasible.getTime());
      var transitDays = (etdDate && etaDate && !isNaN(etdDate.getTime()) && !isNaN(etaDate.getTime()))
        ? Math.max(1, Math.round((etaDate.getTime() - etdDate.getTime()) / (1000 * 60 * 60 * 24)))
        : 999;
      var totalCost = res.ocean + res.surcharge;
      return { s: s, res: res, hasMissing: hasMissing, isTooTight: isTooTight, transitDays: transitDays, totalCost: totalCost };
    });

    var feasible = evaluated.filter(function (ev) { return !ev.isTooTight && !ev.hasMissing && ev.totalCost > 0; });
    var cheapestId = "";
    var fastestId = "";
    var optimalId = "";
    if (feasible.length > 0) {
      var minCost = Math.min.apply(null, feasible.map(function (ev) { return ev.totalCost; }));
      var maxCost = Math.max.apply(null, feasible.map(function (ev) { return ev.totalCost; }));
      var minTransit = Math.min.apply(null, feasible.map(function (ev) { return ev.transitDays; }));
      var maxTransit = Math.max.apply(null, feasible.map(function (ev) { return ev.transitDays; }));
      var bestScore = Infinity;
      feasible.forEach(function (ev) {
        if (ev.totalCost === minCost && !cheapestId) cheapestId = ev.s["Schedule_ID"];
        if (ev.transitDays === minTransit && !fastestId) fastestId = ev.s["Schedule_ID"];
        var cNorm = maxCost > minCost ? (ev.totalCost - minCost) / (maxCost - minCost) : 0;
        var tNorm = maxTransit > minTransit ? (ev.transitDays - minTransit) / (maxTransit - minTransit) : 0;
        var sc = 0.6 * cNorm + 0.4 * tNorm;
        if (sc < bestScore) {
          bestScore = sc;
          optimalId = ev.s["Schedule_ID"];
        }
      });
    }

    tbody.innerHTML = evaluated.map(function (ev) {
      var s = ev.s;
      var res = ev.res;
      var sid = s["Schedule_ID"];
      var isSelected = SELECTED_SCHEDULE_ID === sid;
      var rowCls = isSelected
        ? ((ev.hasMissing || ev.isTooTight) ? "bg-[#f4d98a]/45 ring-2 ring-inset ring-[#186635]" : "bg-[#aed6c6] ring-2 ring-inset ring-[#0f4a33]")
        : (ev.isTooTight ? "bg-[#8c3b3b]/20" : (ev.hasMissing ? "bg-[#f4d98a]/25" : ""));

      var badgesHtml = [];
      if (ev.isTooTight) {
        badgesHtml.push('<span class="mt-0.5 inline-block px-1.5 py-0.5 text-[10px] font-semibold bg-[#8c3b3b] text-[#fdf2f2] border border-[#6e2b2b] rounded">Sát ngày (Không kịp chuẩn bị · cần ≥ ' + leadDays + ' ngày)</span>');
      } else {
        if (sid === optimalId) {
          badgesHtml.push('<span class="mt-0.5 inline-block px-1.5 py-0.5 text-[10px] font-bold bg-[#0f4a33] text-[#f4d98a] border border-[#186635] rounded">★ Đề xuất Tối ưu Nhất</span>');
        }
        if (sid === cheapestId) {
          badgesHtml.push('<span class="mt-0.5 inline-block px-1.5 py-0.5 text-[10px] font-semibold bg-[#2f7d3e] text-[#fff5d6] border border-[#186635] rounded">Cước Thấp Nhất</span>');
        }
        if (sid === fastestId) {
          badgesHtml.push('<span class="mt-0.5 inline-block px-1.5 py-0.5 text-[10px] font-semibold bg-[#16977f] text-[#fff5d6] border border-[#186635] rounded">Hành trình Nhanh Nhất (' + ev.transitDays + 'd)</span>');
        }
      }
      if (ev.hasMissing) {
        badgesHtml.push('<span class="mt-0.5 inline-block px-1.5 py-0.5 text-[10px] font-semibold bg-[#8c3b3b] text-[#fdf2f2] border border-[#6e2b2b] rounded">Thiếu giá: ' + res.missing.join(", ") + '</span>');
      }

      return '<tr onclick="selectPricingSchedule(\'' + sid + '\')" class="cursor-pointer transition-colors ' + rowCls + '">' +
        '<td class="py-2.5 px-3"><input type="radio" name="calc-sch" onclick="event.stopPropagation();selectPricingSchedule(\'' + sid + '\')" class="accent-[#0f4a33] cursor-pointer" ' + (isSelected ? "checked" : "") + ' /></td>' +
        '<td class="py-2.5 px-3 font-mono font-bold text-[#0b2418]">' + sid + '</td>' +
        '<td class="py-2.5 px-3 font-semibold text-[#0b2418]"><div>' + s["Shipping_Line"] + '</div>' + (badgesHtml.length ? '<div class="flex flex-wrap gap-1 mt-0.5">' + badgesHtml.join("") + '</div>' : '') + '</td>' +
        '<td class="py-2.5 px-3 text-[#0b2418]">' + s["POL"] + ' → ' + s["POD"] + '</td>' +
        '<td class="py-2.5 px-3 font-mono text-[#0b2418]">' + s["ETD"] + ' / ' + s["ETA"] + '</td>' +
        '<td class="py-2.5 px-3 text-right font-mono font-bold ' + (ev.hasMissing ? 'text-[#8c3b3b]' : 'text-[#07281c]') + '">' + fmtUSD(res.ocean) + '</td>' +
        '<td class="py-2.5 px-3 text-right font-mono font-semibold text-[#0b2418]">' + fmtUSD(res.surcharge) + '</td>' +
        '<td class="py-2.5 px-3 text-right font-mono font-semibold text-[#0b2418]">' + (s["Days còn lại"] !== "" && s["Days còn lại"] !== undefined ? s["Days còn lại"] + " ngày" : "-") + '</td>' +
      '</tr>';
    }).join("");
  }

  function selectPricingSchedule(scheduleId) {
    // Bấm lần 1 để chọn; bấm lại lần 2 vào chính tuyến đang chọn để bỏ chọn & đưa cước về $0.00

  function computeFwdInternalSummary(mix, effOcean, effSurcharge, localTotal, customsExportUsd, permitsUsd, buyerCharge) {
    var isLclOrder = Boolean(mix && mix.hasLcl);
    var execOpt = String((document.getElementById("calc-freight-exec-option") || {}).value || (isLclOrder ? "FWD_ALL" : "SELF")).toUpperCase();
    if (isLclOrder && execOpt === "SELF") {
      execOpt = "FWD_ALL";
    }
    var selfTrucking = Math.max(0, toNum((document.getElementById("calc-self-trucking") || {}).value));
    var fwdOcean = Math.max(0, toNum((document.getElementById("calc-fwd-ocean") || {}).value));
    var fwdTrucking = Math.max(0, toNum((document.getElementById("calc-fwd-trucking") || {}).value));
    var fwdCustoms = Math.max(0, toNum((document.getElementById("calc-fwd-customs") || {}).value));
    var fwdPermits = Math.max(0, toNum((document.getElementById("calc-fwd-permits") || {}).value));

    var selfOceanLocal = effOcean + effSurcharge + localTotal;
    var selfTotal = isLclOrder ? null : (selfOceanLocal + customsExportUsd + permitsUsd + selfTrucking);
    var fwdOceanEff = fwdOcean > 0 ? fwdOcean : (effOcean + effSurcharge + (isLclOrder ? 0 : localTotal));
    var fwdCustomsEff = fwdCustoms > 0 ? fwdCustoms : customsExportUsd;
    var fwdPermitsEff = fwdPermits > 0 ? fwdPermits : permitsUsd;
    var fwdAllTotal = fwdOceanEff + fwdTrucking + fwdCustomsEff + fwdPermitsEff;
    var bestTruck = (selfTrucking > 0 && fwdTrucking > 0)
      ? Math.min(selfTrucking, fwdTrucking)
      : (fwdTrucking > 0 ? fwdTrucking : selfTrucking);
    var hybridOceanEff = isLclOrder ? fwdOceanEff : Math.min(selfOceanLocal, fwdOcean > 0 ? fwdOcean : selfOceanLocal);
    var hybridTotal = hybridOceanEff + bestTruck + customsExportUsd + permitsUsd;

    var elSelfOcean = document.getElementById("calc-comp-self-ocean");
    var elHybridOcean = document.getElementById("calc-comp-hybrid-ocean");
    var elHybridTruck = document.getElementById("calc-comp-hybrid-trucking");
    var elSelfCustoms = document.getElementById("calc-comp-self-customs");
    var elHybridCustoms = document.getElementById("calc-comp-hybrid-customs");
    var elSelfPermits = document.getElementById("calc-comp-self-permits");
    var elHybridPermits = document.getElementById("calc-comp-hybrid-permits");
    if (elSelfOcean) elSelfOcean.textContent = isLclOrder ? "N/A - LCL" : fmtUSD(selfOceanLocal);
    if (elHybridOcean) elHybridOcean.textContent = fmtUSD(hybridOceanEff);
    if (elHybridTruck) elHybridTruck.textContent = fmtUSD(bestTruck);
    if (elSelfCustoms) elSelfCustoms.textContent = fmtUSD(customsExportUsd);
    if (elHybridCustoms) elHybridCustoms.textContent = fmtUSD(customsExportUsd);
    if (elSelfPermits) elSelfPermits.textContent = fmtUSD(permitsUsd);
    if (elHybridPermits) elHybridPermits.textContent = fmtUSD(permitsUsd);

    var internalCost = (execOpt === "FWD_ALL" || (execOpt === "SELF" && selfTotal === null))
      ? fwdAllTotal
      : (execOpt === "HYBRID" ? hybridTotal : selfTotal);
    internalCost = Math.round(internalCost * 100) / 100;
    var buyerChargeRounded = Math.round(buyerCharge * 100) / 100;
    var internalProfit = Math.round((buyerChargeRounded - internalCost) * 100) / 100;

    var tableEl = document.getElementById("calc-fwd-options-table");
    if (tableEl) {
      var opts = [
        { key: "SELF", label: "Tự làm 100%", cost: selfTotal },

      ];
      var validCosts = opts.map(function (o) { return o.cost; }).filter(function (v) { return v !== null; });
      var minCost = validCosts.length > 0 ? Math.min.apply(null, validCosts) : 0;
      tableEl.innerHTML = opts.map(function (o) {
        var isDisabled = o.cost === null;
        var isSelected = !isDisabled && execOpt === o.key;
        var isCheapest = !isDisabled && Math.abs(o.cost - minCost) < 0.01 && o.cost > 0;
        return '<button type="button" ' + (isDisabled ? 'disabled ' : ('onclick="selectFreightExecOption(\'' + o.key + '\')" ')) +
          'class="p-1.5 rounded-lg border-[1.5px] text-center transition-all ' +
          (isDisabled ? 'bg-[#809c8f] border-[#186635]/60 text-[#1e4231] opacity-75 cursor-not-allowed' : (isSelected ? 'bg-[#0f4a33] border-[#f4d98a] font-bold text-[#fff5d6] ring-1 ring-[#f4d98a]/40 cursor-pointer' : 'bg-[#aed6c6] border-[#186635] text-[#0b2418] font-semibold hover:bg-[#9bccb8] cursor-pointer')) + '">' +
          '<div class="truncate">' + o.label + (isCheapest ? ' ★' : '') + '</div>' +
          '<div class="font-mono font-bold mt-0.5">' + (isDisabled ? 'N/A (Hàng lẻ LCL)' : fmtUSD(o.cost)) + '</div>' +

    var elBuy = document.getElementById("calc-buyer-charge-disp");
    var elProf = document.getElementById("calc-internal-profit-disp");
    if (elInt) elInt.textContent = fmtUSD(internalCost);
    if (elBuy) elBuy.textContent = fmtUSD(buyerChargeRounded);
    if (elProf) {
      elProf.textContent = (internalProfit >= 0 ? "+" : "-") + fmtUSD(Math.abs(internalProfit));
      elProf.className = "font-mono font-bold " + (internalProfit >= 0 ? "text-[#f4d98a]" : "text-[#fca5a5]");
    }

    return {
      execOption: execOpt,
      selfTrucking: selfTrucking,
      fwdOcean: fwdOcean,
      fwdTrucking: fwdTrucking,
      fwdCustoms: fwdCustoms,
      fwdPermits: fwdPermits,
      internalCost: internalCost,
      buyerCharge: buyerChargeRounded,
      internalProfit: internalProfit
    };
  }

  function recalculatePricing(syncFloorAuto) {
    updateContainerMixBadge();
    var mix = getContainerMixState();
    var includeFreight = document.getElementById("chk-include-freight").checked;
    var includeInsurance = document.getElementById("chk-include-insurance").checked;
    var incoterm = String(document.getElementById("calc-rec-incoterm").value || "").toUpperCase();

    var ocean = mix.lclFreight || 0;
    var surcharge = 0;
    var sch = (APP_DATA.schedules || []).find(function (s) { return s["Schedule_ID"] === SELECTED_SCHEDULE_ID; });
    if (sch) {
      var schRes = computeScheduleOceanAndMissing(sch, mix);
      ocean = schRes.ocean;
      surcharge = schRes.surcharge;
    }
    var effOcean = includeFreight ? ocean : 0;
    var effSurcharge = includeFreight ? surcharge : 0;

    var fullLocalTotal = computeLocalChargesForMix(mix, sch);
    var localTotal = incoterm !== "EXW" ? fullLocalTotal : 0;

    var customsSplit = computeCustomsSplitForPricing();
    var fullCustomsTotal = customsSplit.customsTotal;
    var customsExportUsd = incoterm !== "EXW" ? customsSplit.customsExportUsd : 0;
    var permitsUsd = incoterm !== "EXW" ? customsSplit.permitsUsd : 0;
    var customsTotal = customsExportUsd + permitsUsd;

    var isDestTerm = incoterm === "DAP" || incoterm === "DPU" || incoterm === "DDP";
    var destExtra = isDestTerm ? toNum(document.getElementById("calc-dest-extra").value) : 0;

    var totalFreightLocal = (effOcean + effSurcharge) + localTotal + customsTotal + destExtra;
    var rawInsVal = toNum(document.getElementById("calc-insurance").value);
    var insurance = includeInsurance ? rawInsVal : 0;
    var goodsCost = toNum(document.getElementById("calc-goods-cost").value);
    var packingPalletCost = toNum((document.getElementById("calc-packing-cost") || {}).value);
    var marginPct = toNum(document.getElementById("calc-margin").value);
    var minMarginEl = document.getElementById("calc-min-margin");
    var minMarginPct = minMarginEl ? toNum(minMarginEl.value) : 5;

    var baseCost = goodsCost + packingPalletCost + totalFreightLocal + insurance;
    var finalSelling = baseCost * (1 + marginPct / 100);
    var computedFloor = baseCost * (1 + minMarginPct / 100);

    var floorEl = document.getElementById("calc-floor-price");
    if (floorEl && (syncFloorAuto || floorEl.getAttribute("data-manual-floor") !== "1" || toNum(floorEl.value) <= 0)) {
      floorEl.value = baseCost > 0 ? computedFloor.toFixed(2) : "";
    }
    var activeFloorPrice = floorEl ? toNum(floorEl.value) : computedFloor;

    // 4 mức giá Incoterms chuẩn lưu cho Sales dùng ngay
    var mult = 1 + marginPct / 100;
    var exwRef = (goodsCost + packingPalletCost) * mult;
    var fobRef = (goodsCost + packingPalletCost + fullLocalTotal + fullCustomsTotal) * mult;
    var cfrRef = (goodsCost + packingPalletCost + fullLocalTotal + fullCustomsTotal + ocean + surcharge) * mult;
    var insRefVal = rawInsVal > 0 ? rawInsVal : Number(((goodsCost + packingPalletCost + fullLocalTotal + fullCustomsTotal + ocean + surcharge) * 1.1 * (getSelectedInsuranceRatePct() / 100)).toFixed(2));
    var cifRef = (goodsCost + packingPalletCost + fullLocalTotal + fullCustomsTotal + ocean + surcharge + insRefVal) * mult;

    var rExwEl = document.getElementById("ref-price-exw");
    var rFobEl = document.getElementById("ref-price-fob");
    var rCfrEl = document.getElementById("ref-price-cfr");
    var rCifEl = document.getElementById("ref-price-cif");
    if (rExwEl) rExwEl.textContent = "$" + fmtNumber(Math.round(exwRef));
    if (rFobEl) rFobEl.textContent = "$" + fmtNumber(Math.round(fobRef));
    if (rCfrEl) rCfrEl.textContent = "$" + fmtNumber(Math.round(cfrRef));
    if (rCifEl) rCifEl.textContent = "$" + fmtNumber(Math.round(cifRef));

    document.getElementById("break-ocean").textContent = fmtUSD(effOcean);
    document.getElementById("break-surcharge").textContent = fmtUSD(effSurcharge);
    document.getElementById("break-local").textContent = fmtUSD(localTotal);
    document.getElementById("break-customs").textContent = fmtUSD(customsTotal);
    var breakPackEl = document.getElementById("break-packing");
    if (breakPackEl) breakPackEl.textContent = fmtUSD(packingPalletCost);
    document.getElementById("break-dest-extra").textContent = fmtUSD(destExtra);
    document.getElementById("break-total-freight").textContent = fmtUSD(totalFreightLocal);
    document.getElementById("calc-final-price").textContent = fmtUSD(finalSelling);

    var fwdSummary = computeFwdInternalSummary(mix, effOcean, effSurcharge, localTotal, customsExportUsd, permitsUsd, totalFreightLocal);

    var orderId = String(document.getElementById("calc-order-id").value || "").trim();
    var inq = (APP_DATA.inquiries || []).find(function (i) {
      return String(i["Order_ID"] || "").trim() === orderId;
    });
    var itemsWeightSum = (PRICING_ITEMS_STATE || []).reduce(function (sum, it) {
      return sum + toNum(it.weight);
    }, 0);
    var nw = itemsWeightSum > 0
      ? itemsWeightSum
      : (inq ? (toNum(inq["Total_Weight_KG"]) || toNum(inq["Net_Weight_KGs"])) : 0);
    var unitEl = document.getElementById("calc-unit-selling");
    if (unitEl) {
      unitEl.textContent =
        nw > 0 ? "Đơn giá: " + fmtUSD(finalSelling / nw) + " / KG" : ("Đơn giá: " + fmtUSD(0) + " / KG");
    }

    renderIncotermComparisonTable();

    return {
      totalFreightLocal: totalFreightLocal,
      packingPalletCost: packingPalletCost,
      insurance: insurance,
      goodsCost: goodsCost,
      finalSelling: finalSelling,
      floorPrice: activeFloorPrice,
      minMarginPct: minMarginPct,
      exwPrice: Number(exwRef.toFixed(2)),
      fobPrice: Number(fobRef.toFixed(2)),
      cfrPrice: Number(cfrRef.toFixed(2)),
      cifPrice: Number(cifRef.toFixed(2)),
      fwdSummary: fwdSummary,
      mix: mix
    };
  }

  function handleSavePricingProposal(btnEl) {

    if (!orderId) {
      Swal.fire("Thiếu thông tin", "Vui lòng chọn Mã đơn hàng cần tính giá.", "warning");
      return;

    var usePallet = Boolean((document.getElementById("calc-use-pallet") || {}).checked);
    var pool = syncOrderPalletPoolSummary();
    var nextQ = generateNextQuotationNoJS(orderId, quoteRound);
    var insSel = document.getElementById("calc-insurance-code");

    var syncedItems = (PRICING_ITEMS_STATE || []).map(function (it) {

    var fwd = calc.fwdSummary || {};

      Reefer_Ship_Mode: calc.mix.reeferMode || "NONE",
      LCL_Rate_Basis: calc.mix.hasLcl ? calc.mix.lclBasis : "",
      LCL_Unit_Rate_USD: calc.mix.hasLcl ? Number(calc.mix.lclRate) : 0,
      LCL_Total_Freight_USD: calc.mix.hasLcl ? Number(calc.mix.lclFreight) : 0,
      FWD_Ocean_CFS_USD: Number(fwd.fwdOcean || 0),
      FWD_Trucking_USD: Number(fwd.fwdTrucking || 0),
      FWD_Customs_USD: Number(fwd.fwdCustoms || 0),
      FWD_Permits_USD: Number(fwd.fwdPermits || 0),
      Self_Trucking_USD: Number(fwd.selfTrucking || 0),
      Freight_Exec_Option: fwd.execOption || "SELF",
      Internal_Cost_USD: Number(fwd.internalCost || 0),
      Buyer_Charge_USD: Number(fwd.buyerCharge || 0),
      Internal_Profit_USD: Number(fwd.internalProfit || 0),
      Use_Pallet: usePallet,
      Total_Cartons: Number(pool.totalCartons),
      Total_Pallets: Number(pool.totalPallets),
      Total_Gross_Weight: Number(pool.totalGrossWeightKg.toFixed(2)),
      Total_CBM: Number(pool.totalCbm.toFixed(3)),
      Pallet_Fee: Number(pool.palletFee.toFixed(2)),
      Packing_Pallet_Cost: Number(calc.packingPalletCost.toFixed(2)),
      Total_Freight_Local: Number(calc.totalFreightLocal.toFixed(2)),
      Insurance_Code: (typeof getSelectedInsuranceSelection === "function" ? getSelectedInsuranceSelection().combinedCode : (insSel ? insSel.value : "INS-ICC-A")),
      Insurance_Cost: Number(calc.insurance.toFixed(2)),
      Goods_Cost: Number(calc.goodsCost.toFixed(2)),
      "Recommended Incoterm": recIncVal,
      Proposed_Incoterms: selectedProposed.join(", "),
      Quotation_Mode: selectedProposed.length >= 2 ? "COMPARISON" : "SINGLE",
      "Final_Selling Price": Number(calc.finalSelling.toFixed(2)),
      Floor_Price_USD: Number((calc.floorPrice || calc.finalSelling).toFixed(2)),
      Min_Margin_Pct: Number((calc.minMarginPct || 5).toFixed(2)),
      EXW_Price: calc.exwPrice,
      FOB_Price: calc.fobPrice,
      CFR_Price: calc.cfrPrice,
      CIF_Price: calc.cifPrice,
      Booking_Status: WORKFLOW_STATUS.PRICED_READY,
      Note: noteEl ? noteEl.value.trim() : "",
      items: syncedItems
    };

    var saveBtn = btnEl || document.getElementById("btn-save-pricing");
    setButtonLoading(saveBtn, true, "Đang gửi...");
    startTopProgress();
    google.script.run
      .withSuccessHandler(function () {
        stopTopProgress();
        setButtonLoading(saveBtn, false);
        showToast("success", "Đã gửi phương án " + nextQ.quotationNo + " cho Kinh doanh.");
        refreshAllData({ silent: true });
      })
      .withFailureHandler(function (err) {
        stopTopProgress();
        setButtonLoading(saveBtn, false);
        Swal.fire("Lỗi", err.message, "error");
      })
      .savePricingProposal(payload);
  }

  function renderShippingTable() {
    var search = ((document.getElementById("filter-ship-search").value || GLOBAL_QUICK_SEARCH || "")).toLowerCase();
    var podF = document.getElementById("filter-ship-pod").value;
    var lineF = document.getElementById("filter-ship-line").value;

    var rows = APP_DATA.schedules.filter(function (s) {
      if (podF && s["POD"] !== podF) return false;
      if (lineF && s["Shipping_Line"] !== lineF) return false;
      if (search) {
        var hay = (s["Schedule_ID"] + " " + s["Vessel"] + " " + s["Voyage"] + " " + s["POL"] + " " + s["POD"]).toLowerCase();
        if (hay.indexOf(search) === -1) return false;
      }
      return true;
    });

    var tbody = document.getElementById("shipping-tbody");
    if (rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="py-8 text-center text-[#1e4231] font-medium">Không tìm thấy tuyến cước tàu phù hợp.</td></tr>';
      return;
    }

    tbody.innerHTML = rows.map(function (s) {
      var d = Number(s["Days còn lại"]);
      var dBadge = isNaN(d) ? "-" : renderStatusBadge(d + " ngày", d <= 3 ? "danger" : (d <= 7 ? "warning" : "success"));
      return '<tr class="transition-colors">' +
        '<td>' +
          '<div class="font-mono font-bold text-[#07281c]">' + (s["Schedule_ID"] || "-") + '</div>' +
          '<div class="text-[11px] font-semibold text-[#1e4231] mt-0.5">' + (s["Shipping_Line"] || "-") + '</div>' +
        '</td>' +
        '<td>' +

  function computeAutoMaxPerPallet(dimCm, netKg, tareKg) {
    var parts = String(dimCm || "").trim().toLowerCase().replace(/×/g, "x").split(/[x*,\s]+/).map(function (p) {
      return parseFloat(p);
    }).filter(function (n) { return !isNaN(n) && n > 0; });
    var byDim = 0;
    if (parts.length >= 3) {
      var L = parts[0], W = parts[1], H = parts[2];
      var perLayerA = Math.floor(120 / L) * Math.floor(100 / W);
      var perLayerB = Math.floor(120 / W) * Math.floor(100 / L);
      var bestPerLayer = Math.max(perLayerA, perLayerB);
      var maxLayers = Math.max(1, Math.floor(150 / H));
      if (H > 150) maxLayers = 0;
      byDim = bestPerLayer * maxLayers;
    }
    var gross = toNum(netKg) + toNum(tareKg);
    var byWeight = gross > 0 ? Math.floor(1000 / gross) : 0;
    if (byDim > 0 && byWeight > 0) return Math.min(byDim, byWeight);
    return byDim || byWeight || 0;
  }

  function handleCreateSchedule(e) {
    e.preventDefault();
    var formEl = e.target;
    var rowEls = document.querySelectorAll("#schedule-batch-rows .schedule-batch-row");
    var rows = [];
    for (var i = 0; i < rowEls.length; i++) {
      var r = rowEls[i];
      var getV = function (f) {
        var el = r.querySelector('[data-field="' + f + '"]');
        return el ? el.value.trim() : "";
      };
      var pol = getV("POL");
      var pod = getV("POD");
      var line = getV("Shipping_Line");
      if (!pol && !pod && !line) continue;
      rows.push({
        Schedule_ID: getV("Schedule_ID"),
        POL: pol || "Cát Lái",
        POD: pod,
        Country: getV("Country"),
        POT: getV("POT") || "Direct",
        Shipping_Line: line,
        Vessel: getV("Vessel"),
        Voyage: getV("Voyage"),
        ETD: getV("ETD"),
        ETA: getV("ETA"),
        Expiry_Date: getV("Expiry_Date"),
        Rate_20DC: toNum(getV("Rate_20DC")),
        Rate_40DC: toNum(getV("Rate_40DC")),
        Rate_40HC: toNum(getV("Rate_40HC")),
        "Rate_20'RF": toNum(getV("Rate_20RF")),
        "Rate_40'RF": toNum(getV("Rate_40RF")),
        "Rate_40'RH": toNum(getV("Rate_40RH")),
        BAF_Fee: toNum(getV("BAF_Fee")),
        LSS_Fee: toNum(getV("LSS_Fee")),
        PSS_Fee: toNum(getV("PSS_Fee")),
        "B/L_Fee": toNum(getV("BL_Fee")),
        Seal_Fee: toNum(getV("Seal_Fee")),
        THC_20_Dry: toNum(getV("THC_20_Dry")),
        THC_40_Dry: toNum(getV("THC_40_Dry")),
        THC_20_Reefer: toNum(getV("THC_20_Reefer")),

      .withSuccessHandler(function (res) {
        stopTopProgress();

  function compressProductImageDataUrl(rawDataUrl, callback) {
    var img = new Image();
    img.onload = function () {
      var maxSide = 800;
      var w = img.width || maxSide;
      var h = img.height || maxSide;
      if (w <= maxSide && h <= maxSide && rawDataUrl.length < 180000) {
        callback(rawDataUrl);
        return;
      }
      if (w > h && w > maxSide) {
        h = Math.round((h * maxSide) / w);
        w = maxSide;
      } else if (h >= w && h > maxSide) {
        w = Math.round((w * maxSide) / h);
        h = maxSide;
      }
      var canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = function () {
      callback(rawDataUrl);
    };
    img.src = rawDataUrl;
  }

  function previewProductImageFile(mode, inputEl) {
    var file = inputEl && inputEl.files && inputEl.files[0];
    if (!file) return;
    PRODUCT_IMAGE_FILENAME[mode] = file.name.replace(/\.[^.]+$/, "") + ".jpg";
    var reader = new FileReader();
    reader.onload = function (evt) {
      var rawUrl = evt.target ? evt.target.result : "";
      if (!rawUrl) return;
      compressProductImageDataUrl(rawUrl, function (compressedUrl) {
        PRODUCT_IMAGE_BASE64[mode] = compressedUrl;
        var urlInput = document.getElementById("prd-" + mode + "-image-url");
        if (urlInput) urlInput.value = "";
        setProductPreviewBoxHtml(mode, compressedUrl);
      });
    };
    reader.readAsDataURL(file);
  }

  function renderProductsTable() {

    var canEditProducts = role === "ADMIN";
    var pSearch = GLOBAL_QUICK_SEARCH.toLowerCase();
    var list = (APP_DATA.products || []).map(function (p, origIdx) {
      return { p: p, origIdx: origIdx };
    }).filter(function (item) {
      if (!pSearch) return true;
      var sku = getProductProp(item.p, ["SKU_Code", "Mã sản phẩm", "SKU", "Product_ID", "Ma_SP", "Mã hàng"], ["sku", "mã sản phẩm", "mã hàng"]);
      var pname = getProductProp(item.p, ["Product_Name_VIE", "Tên sản phẩm", "Product_Name", "Ten_San_Pham", "Product Name", "Name", "Tên nông sản", "Tên hàng", "Mặt hàng"], ["tên sản phẩm", "tên nông sản", "product_name", "product name", "tên hàng", "name"]);
      var engName = getProductProp(item.p, ["Product_Name_ENG", "Item_Name_ENG", "English_Name"], ["product_name_eng", "item_name_eng"]);
      var grpName = getProductGroupName(item.p, pname);
      return (String(sku) + " " + String(pname) + " " + String(engName) + " " + grpName).toLowerCase().indexOf(pSearch) !== -1;
    });

      tbody.innerHTML = '<tr><td colspan="' + (canEditProducts ? 8 : 7) + '" class="py-8 text-center text-[#1e4231] font-medium">Chưa có sản phẩm phù hợp.</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(function (item) {
      var p = item.p;
      var idx = item.origIdx;
      var stt = getProductProp(p, ["STT", "No", "No."], ["stt"]) || (idx + 1);
      var sku = getProductProp(p, ["SKU_Code", "Mã sản phẩm", "SKU", "Product_ID", "Ma_SP", "Mã hàng"], ["sku", "mã sản phẩm", "mã hàng"]);
      var pname = getProductProp(p, ["Product_Name_VIE", "Tên sản phẩm", "Product_Name", "Ten_San_Pham", "Product Name", "Name", "Tên nông sản", "Tên hàng", "Mặt hàng"], ["tên sản phẩm", "tên nông sản", "product_name", "product name", "tên hàng", "name"]);
      var engName = getProductProp(p, ["Product_Name_ENG", "Item_Name_ENG", "English_Name"], ["product_name_eng", "item_name_eng"]);
      var grpName = getProductGroupName(p, pname);
      var priceRaw = getProductProp(p, ["Unit_Price", "Đơn giá", "Don_Gia", "Price_USD_KG", "Unit Price", "Price", "Giá vốn", "Đơn giá gốc", "Đơn giá gốc (USD/KG)"], ["unit_price", "unit price", "đơn giá", "giá vốn", "price"]);
      var price = toNum(priceRaw);
      var contTypeRaw = String(getProductProp(p, ["Container_Type", "Loại hàng / Bảo quản", "Storage_Type", "Bảo quản", "Chế độ bảo quản", "Loại hàng", "Storage"], ["container_type", "bảo quản", "storage", "loại hàng"]) || "-").trim();
      var tempRaw = String(getProductProp(p, ["Storage_Temperature", "Nhiệt độ bảo quản", "Temperature"], ["temperature", "nhiệt độ"]) || "").trim();
      var hs = getProductProp(p, ["HS_Code", "Mã HS", "HS Code"], ["hs_code", "mã hs"]) || "-";
      var imgUrl = getProductImageUrl(p);
      var thumbSrc = imgUrl || DEFAULT_PRODUCT_IMG_SVG;
      var thumbHtml = '<img src="' + thumbSrc.replace(/"/g, "&quot;") + '" onerror="this.onerror=null;this.src=DEFAULT_PRODUCT_IMG_SVG;" alt="" class="w-12 h-12 rounded-xl object-cover border-[1.5px] border-[#186635] bg-[#aed6c6]" />';
      var isReefer = contTypeRaw.toLowerCase().indexOf("lạnh") !== -1 || contTypeRaw.toLowerCase().indexOf("rf") !== -1 || contTypeRaw.toLowerCase().indexOf("reefer") !== -1;

      // Tách phần nhiệt độ trong ngoặc đơn (VD: (<25°C), (+4°C đến +10°C)) xuống dòng riêng căn giữa
      var tempLines = [];
      var mainContText = contTypeRaw;
      var parenMatches = contTypeRaw.match(/\([^)]*\)/g);
      if (parenMatches && parenMatches.length > 0) {
        var remainingText = contTypeRaw;
        parenMatches.forEach(function (seg) {
          if (/°|c\b|nhiệt|độ|[<>+\-]\s*\d/i.test(seg)) {
            tempLines.push(seg.trim());
            remainingText = remainingText.replace(seg, " ");
          }
        });
        remainingText = remainingText.replace(/\s+/g, " ").trim();
        if (remainingText) mainContText = remainingText;
      }
      if (tempRaw) {
        var normTemp = tempRaw.toLowerCase().replace(/\s+/g, "");
        var alreadyHas = tempLines.some(function (tl) {
          return tl.toLowerCase().replace(/\s+/g, "").indexOf(normTemp) !== -1;
        });
        if (!alreadyHas) tempLines.push(tempRaw);
      }
      var tempLinesHtml = tempLines.map(function (tl) {

            '</div>' +
          '</td>')
        : '';

      return '<tr class="transition-colors">' +
        '<td class="text-center font-mono font-bold text-xs text-[#1e4231]">' + stt + '</td>' +
        '<td class="text-center"><div class="inline-flex justify-center">' + thumbHtml + '</div></td>' +
        '<td class="text-center">' +
          '<div class="font-mono font-bold text-[#07281c]">' + (sku || "-") + '</div>' +
          (grpName ? '<div class="text-[11px] text-[#1e4231] font-medium mt-0.5">' + grpName + '</div>' : '') +
        '</td>' +
        '<td class="text-center">' +
          '<div class="font-semibold text-[#0b2418] text-center">' + (pname || "-") + '</div>' +
          (engName ? '<div class="text-[11px] text-[#1e4231] italic text-center">' + engName + '</div>' : '') +
        '</td>' +
        '<td class="text-center font-mono font-bold text-[#07281c] tabular-nums">' + fmtUSD(price) + '</td>' +
        '<td class="text-center align-middle">' +
          '<div class="flex flex-col items-center justify-center gap-1 text-center">' +
            '<div>' + renderStatusBadge(mainContText, isReefer ? "info" : "success") + '</div>' +
            tempLinesHtml +
          '</div>' +
        '</td>' +
        '<td class="text-center font-mono font-semibold text-xs text-[#0b2418]">' + hs + '</td>' +
        actionTd +
      '</tr>';
    }).join("");
  }

  function handleSaveProduct(e, mode) {
    e.preventDefault();
    var formEl = e.target;
    if (mode !== "edit") {
      var rowEls = document.querySelectorAll("#product-batch-rows .product-batch-row");
      var rows = [];
      for (var i = 0; i < rowEls.length; i++) {
        var r = rowEls[i];
        var getV = function (f) {
          var el = r.querySelector('[data-field="' + f + '"]');
          return el ? el.value.trim() : "";
        };
        var sku = getV("SKU_Code");
        var nameVie = getV("Product_Name_VIE");
        if (!sku && !nameVie) continue;
        var nameEng = getV("Product_Name_ENG") || translateVieToEngXnk(nameVie);
        var cont = getV("Container_Type") || "40'RF";
        rows.push({
          STT: toNum(getV("STT")) || ((APP_DATA.products || []).length + rows.length + 1),
          SKU_Code: sku,
          "Mã sản phẩm": sku,
          Product_Name_VIE: nameVie,
          "Tên sản phẩm": nameVie,
          Product_Name_ENG: nameEng,
          Unit_Price: toNum(getV("Unit_Price")),
          Product_Group: getV("Product_Group"),
          Container_Type: cont,
          "Loại hàng / Bảo quản": cont,
          Storage_Temperature: getV("Storage_Temperature"),
          Packaging: getV("Packaging"),
          Spec: getV("Spec"),
          Origin: getV("Origin") || "VIETNAM",
          HS_Code: getV("HS_Code"),
          Image_URL: normalizeProductImageUrl(getV("Image_URL"))
        });
      }
      if (rows.length === 0) {
        Swal.fire("Thiếu dữ liệu", "Vui lòng nhập ít nhất 1 sản phẩm có Mã SKU và Tên sản phẩm.", "warning");
        return;
      }
      setButtonLoading(formEl, true, "Đang lưu " + rows.length + " SP...");
      startTopProgress();
      google.script.run
        .withSuccessHandler(function (res) {
          stopTopProgress();
          setButtonLoading(formEl, false);
          closeModal("modal-add-product");
          showToast("success", "Đã lưu " + ((res && res.count) || rows.length) + " sản phẩm vào danh mục.");
          refreshAllData({ silent: true });
        })
        .withFailureHandler(function (err) {
          stopTopProgress();
          setButtonLoading(formEl, false);
          Swal.fire("Lỗi", (err && err.message) || String(err), "error");
        })
        .saveProductsBatch(rows);
      return;
    }

    var prefix = "prd-edit-";
    var typedUrlEl = document.getElementById(prefix + "image-url");
    var typedUrl = typedUrlEl ? normalizeProductImageUrl(typedUrlEl.value) : "";
    var existingUrl = document.getElementById("prd-edit-existing-url").value || "";
    var finalUrl = typedUrl || existingUrl;
    var groupEl = document.getElementById(prefix + "group");
    var sttEl = document.getElementById(prefix + "stt");
    var engEl = document.getElementById(prefix + "name-eng");
    var tempEl = document.getElementById(prefix + "temp");
    var specEl = document.getElementById(prefix + "spec");
    var origEl = document.getElementById(prefix + "origin");
    var skuVal = document.getElementById(prefix + "sku").value.trim();
    var nameVieVal = document.getElementById(prefix + "name").value.trim();
    var contVal = document.getElementById(prefix + "storage").value.trim();
    var payload = {
      STT: sttEl ? toNum(sttEl.value) : 0,
      SKU_Code: skuVal,
      "Mã sản phẩm": skuVal,
      Product_Name_VIE: nameVieVal,
      "Tên sản phẩm": nameVieVal,
      Product_Name_ENG: engEl && engEl.value.trim() ? engEl.value.trim() : translateVieToEngXnk(nameVieVal),
      Unit_Price: toNum(document.getElementById(prefix + "price").value),
      Container_Type: contVal,
      "Loại hàng / Bảo quản": contVal,
      Storage_Temperature: tempEl ? tempEl.value.trim() : "",
      HS_Code: document.getElementById(prefix + "hs").value.trim(),
      Packaging: document.getElementById(prefix + "pack").value.trim(),
      Spec: specEl ? specEl.value.trim() : "",
      Origin: (origEl && origEl.value.trim()) || "VIETNAM",
      Product_Group: groupEl ? groupEl.value.trim() : "",
      Image_URL: finalUrl,
      imageBase64: PRODUCT_IMAGE_BASE64[mode] || "",
      imageFileName: PRODUCT_IMAGE_FILENAME[mode] || ""
    };
    setButtonLoading(formEl, true, payload.imageBase64 ? "Đang tải ảnh & lưu..." : "Đang lưu...");
    startTopProgress();
    google.script.run
      .withSuccessHandler(function (res) {
        stopTopProgress();
        setButtonLoading(formEl, false);
        if (res && res.success === false) {
          Swal.fire("Chưa lưu được", res.message || "Vui lòng kiểm tra lại dữ liệu.", "warning");
          return;
        }
        closeModal("modal-edit-product");
        clearProductImagePreview(mode);
        showToast("success", "Đã cập nhật danh mục sản phẩm.");
        refreshAllData({ silent: true });
      })
      .withFailureHandler(function (err) {
        stopTopProgress();
        setButtonLoading(formEl, false);
        var msg = (err && err.message) ? err.message : String(err || "");
        if (msg.toLowerCase().indexOf("authorization") !== -1 || msg.toLowerCase().indexOf("drive") !== -1) {
          Swal.fire({
            title: "Cần cấp quyền Google Drive cho Web App",
            html: '<div class="text-left text-xs space-y-2 leading-relaxed">' +

  function handleSaveConsigneesBatch(e) {

    var rows = [];

        var el = r.querySelector('[data-field="' + f + '"]');

      var cname = getV("Consignee_Name");
      if (!cname) continue;
      rows.push({
        Consignee_ID: getV("Consignee_ID"),
        Consignee_Name: cname,
        Country: getV("Country"),
        Tax_ID: getV("Tax_ID"),
        Status: getV("Status") || "Active",
        Address: getV("Address"),
        Contact_Person: getV("Contact_Person"),
        Phone: getV("Phone"),
        Email: getV("Email"),
        Payment_Terms: getV("Payment_Terms") || "T/T 30% Deposit, 70% against B/L copy"
      });

    if (rows.length === 0) {
      Swal.fire("Thiếu dữ liệu", "Vui lòng nhập ít nhất 1 khách hàng có Tên công ty.", "warning");

  function openExportDocPreview(orderId, docType) {
    var o = (APP_DATA.orders || []).find(function (item) {
      return String(item["Order_ID"] || "").trim() === String(orderId || "").trim();
    });
    if (!o) return;
    var kind = String(docType || "INVOICE").trim().toUpperCase();
    var cus = (APP_DATA.consignees || []).find(function (c) { return c["Consignee_ID"] === o["Consignee_ID"]; }) || {};
    var coCode = o["CO_Form"] || suggestCoFormCode(o["POD"], cus["Country"]);
    var coLookup = findLookupRow("CO_FORM", coCode);
    var coTitle = (coLookup && coLookup["Contract_Text_ENG"]) || ("CERTIFICATE OF ORIGIN - " + coCode);
    var docTitleMap = {
      INVOICE: "COMMERCIAL INVOICE",
      PACKING: "PACKING LIST",
      CO: coTitle.toUpperCase(),
      BL: "DRAFT BILL OF LADING (SHIPPING INSTRUCTION)"
    };
    var headerLabel = (docTitleMap[kind] || "CHỨNG TỪ XUẤT KHẨU") + " · " + (o["Contract_No."] || orderId);
    var matchedTpl = (APP_DATA.templates || []).find(function (t) {
      var tid = String(t["Template ID"] || "").trim().toUpperCase();
      var tname = String(t["Document_Name"] || "").trim().toLowerCase();
      if (kind === "INVOICE") return tid === "TMP_INVOICE" || tid.indexOf("INV") !== -1 || tname.indexOf("invoice") !== -1 || tname.indexOf("hóa đơn") !== -1;
      if (kind === "PACKING") return tid === "TMP_PACKING_LIST" || tid.indexOf("PACK") !== -1 || tid.indexOf("PKL") !== -1 || tname.indexOf("packing") !== -1 || tname.indexOf("đóng gói") !== -1;
      if (kind === "CO") return tid === "TMP_CO" || tid.indexOf("_CO") !== -1 || tid.indexOf("CO_") !== -1 || tname.indexOf("origin") !== -1 || tname.indexOf("c/o") !== -1 || tname.indexOf("xuất xứ") !== -1;
      return tid === "TMP_BL" || tid.indexOf("BL") !== -1 || tname.indexOf("lading") !== -1 || tname.indexOf("b/l") !== -1 || tname.indexOf("vận đơn") !== -1;
    });
    var initialDocId = matchedTpl ? extractGoogleDocId(matchedTpl["Google_Doc_File_ID"]) : "";

    PREVIEW_MODAL_CTX = {
      mode: "EXPORT_DOC",
      orderId: orderId,
      docType: kind,
      contractOpts: null,
      viewTab: "SPLIT",
      emailMeta: null
    };
    var compTo = document.getElementById("doc-email-to-composer");
    if (compTo) {
      compTo.value = String((cus && cus["Email"]) || "").trim();
    }
    populateEmailComposerFromMeta(buildClientFallbackEmailMeta(orderId, kind, docTitleMap[kind] || "Export Document"));
    preparePdfPreviewLoading(headerLabel, initialDocId, "SPLIT");

    google.script.run
      .withSuccessHandler(function (res) {
        renderPdfPreviewFromServerResponse(res, headerLabel);
      })
      .withFailureHandler(function (err) {
        renderPdfPreviewFromServerResponse({ success: false, message: (err && err.message) || "Lỗi kết nối máy chủ Apps Script." }, headerLabel);
      })
      .exportShippingDocumentFromTemplate(orderId, kind, "pdf");
  }
