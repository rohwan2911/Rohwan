  function renderRatesCategoryTabs() {
    var wrap = document.getElementById("rates-category-tabs");
    if (!wrap) return;
    var fixed = [
      { code: "ALL", label: "Tất cả" },
      { code: "PACKING", label: "Bao bì & Pallet" },
      { code: "CONTAINER", label: "Container & Sức chứa" },
      { code: "LOCAL_CHARGE", label: "Biểu phí cảng" },
      { code: "CUSTOMS_FEE", label: "Kiểm dịch & HQ" },
      { code: "INSURANCE", label: "Bảo hiểm" }
    ];
    var fixedMap = {};
    fixed.forEach(function (f) { fixedMap[f.code] = true; });
    var dynamicCats = [];
    (APP_DATA.pricingRates || []).forEach(function (r) {
      var c = String(r["Fee_Category"] || "").trim().toUpperCase();
      if (c && !fixedMap[c]) {
        fixedMap[c] = true;
        dynamicCats.push({ code: c, label: c });
      }
    });
    var allTabs = fixed.concat(dynamicCats);
    wrap.innerHTML = allTabs.map(function (t) {
      var active = RATES_CATEGORY_FILTER === t.code;
      var cls = active
        ? "rate-cat-btn px-3 py-1.5 text-xs font-bold rounded-lg bg-[#0f4a33] text-[#fff5d6] border-[1.5px] border-[#f4d98a] cursor-pointer shadow-[0_2px_0_#07281c]"
        : "rate-cat-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-[#aed6c6] border-[1.5px] border-[#186635] text-[#0b2418] hover:bg-[#9bccb8] cursor-pointer";
      return '<button type="button" onclick="setRatesCategoryFilter(\'' + t.code.replace(/'/g, "\\'") + '\')" data-rate-cat="' + escHtmlText(t.code) + '" class="' + cls + '">' + escHtmlText(t.label) + '</button>';
    }).join("");
  }

  function setRatesCategoryFilter(cat) {
    RATES_CATEGORY_FILTER = String(cat || "ALL").toUpperCase();
    renderRatesCategoryTabs();
    renderPricingRatesTable();
  }

  function renderPricingRatesTable() {
    renderRatesCategoryTabs();
    if (typeof renderInsuranceControlsFromRates === "function") {
      renderInsuranceControlsFromRates();
    }
    var tbody = document.getElementById("pricing-rates-tbody");
    if (!tbody) return;
    var qEl = document.getElementById("filter-rates-search");
    var q = ((qEl && qEl.value) || GLOBAL_QUICK_SEARCH || "").trim().toLowerCase();

    var list = (APP_DATA.pricingRates || []).filter(function (r) {
      var cat = String(r["Fee_Category"] || "").trim().toUpperCase();
      if (RATES_CATEGORY_FILTER !== "ALL" && cat !== RATES_CATEGORY_FILTER) return false;
      if (q) {
        var hay = (cat + " " + (r["Fee_Code"] || "") + " " + (r["Scope_or_ContType"] || "") + " " + (r["Fee_Name_VIE"] || "") + " " + (r["Contract_Text_ENG"] || "") + " " + (r["Dim_CM"] || "")).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    if (list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="py-8 text-center text-[#1e4231] font-medium">Chưa có đầu mục phí phù hợp trong Bảng giá phụ phí &amp; bao bì.</td></tr>';
      return;
    }

    tbody.innerHTML = list.map(function (r) {
      var cat = String(r["Fee_Category"] || "").trim().toUpperCase();
      var code = String(r["Fee_Code"] || "").trim();
      var safeCode = code.replace(/'/g, "\\'");
      var rateNum = toNum(r["Standard_Rate"]);
      var rateDisplay = cat === "INSURANCE" ? (rateNum + "%") : (cat === "CONTAINER" ? "-" : fmtUSD(rateNum));
      var catTone = cat === "PACKING" ? "success" : (cat === "CONTAINER" || cat === "LOCAL_CHARGE" ? "info" : (cat === "INSURANCE" ? "warning" : "neutral"));
      var specMeta = [];
      if (r["Dim_CM"]) specMeta.push("KT: " + r["Dim_CM"]);
      if (toNum(r["Net_KG"]) > 0) specMeta.push((cat === "CONTAINER" ? "Max: " : "Net: ") + fmtNumber(r["Net_KG"]) + "kg");
      if (toNum(r["Tare_KG"]) > 0) specMeta.push((cat === "CONTAINER" ? "CBM: " : "Tare: ") + r["Tare_KG"] + (cat === "CONTAINER" ? "" : "kg"));
      if (toNum(r["Max_Per_Pallet"]) > 0) specMeta.push((cat === "CONTAINER" ? "MaxPlt: " : "Plt: ") + r["Max_Per_Pallet"]);
      return '<tr class="transition-colors text-xs">' +
        '<td class="text-center whitespace-nowrap">' + renderStatusBadge(cat, catTone) + '</td>' +
        '<td class="font-mono font-bold text-[#07281c] whitespace-nowrap">' + escHtmlText(code) + '</td>' +
        '<td class="text-center font-semibold text-[#0b2418] whitespace-nowrap">' + escHtmlText(r["Scope_or_ContType"] || "ALL") + '</td>' +
        '<td>' +
          '<div class="font-semibold text-[#0b2418] leading-snug">' + escHtmlText(r["Fee_Name_VIE"] || "-") + '</div>' +
          (r["Contract_Text_ENG"] ? '<div class="text-[11px] text-[#1e4231] leading-snug">' + escHtmlText(r["Contract_Text_ENG"]) + '</div>' : '') +
        '</td>' +
        '<td class="text-center font-mono font-semibold text-[#0b2418] text-[11px] whitespace-nowrap">' + escHtmlText(r["Unit_Basis"] || "-") + '</td>' +
        '<td class="text-right font-mono font-bold text-[#07281c] tabular-nums whitespace-nowrap">' + rateDisplay + '</td>' +
        '<td class="text-[#1e4231]">' +
          (specMeta.length ? '<div class="font-mono text-[11px] text-[#0f4a33] font-bold">' + escHtmlText(specMeta.join(" · ")) + '</div>' : '') +
          '<div>' + escHtmlText(r["Note"] || r["Provider_or_Rule"] || "-") + '</div>' +
        '</td>' +
        '<td class="text-center whitespace-nowrap">' +
          '<div class="inline-flex items-center justify-center gap-1.5">' +
            '<button type="button" onclick="openPricingRateModal(\'' + safeCode + '\')" class="px-2.5 py-1 bg-[#aed6c6] hover:bg-[#9bccb8] text-[#0b2418] border border-[#186635] rounded-lg font-semibold whitespace-nowrap cursor-pointer">Sửa</button>' +
            '<button type="button" onclick="deletePricingRate(\'' + safeCode + '\')" class="btn-soft-delete px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap cursor-pointer">Xóa</button>' +
          '</div>' +
        '</td>' +
      '</tr>';
    }).join("");
  }

  function escAttrVal(v) {
    return String(v === undefined || v === null ? "" : v).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function buildPricingRateBatchRowHtml(rowIdx, existing, isEdit) {
    var hintCat = existing
      ? String(existing["Fee_Category"] || "").trim().toUpperCase()
      : (RATES_CATEGORY_FILTER !== "ALL" ? RATES_CATEGORY_FILTER : "");
    var sug = suggestProviderByCategory(hintCat);
    var showDim = hintCat === "PACKING" || hintCat === "CONTAINER";

    // Khi thêm mới: KHÔNG điền sẵn value mặc định — chỉ hiển thị placeholder mờ xám
    var catVal = existing ? String(existing["Fee_Category"] || "").trim().toUpperCase() : "";
    var codeVal = existing ? (existing["Fee_Code"] || "") : "";
    var scopeVal = existing ? (existing["Scope_or_ContType"] || "") : "";
    var unitVal = existing ? (existing["Unit_Basis"] || "") : "";
    var vieVal = existing ? (existing["Fee_Name_VIE"] || "") : "";
    var engVal = existing ? (existing["Contract_Text_ENG"] || "") : "";
    var dimVal = existing ? (existing["Dim_CM"] || "") : "";
    var netVal = existing && existing["Net_KG"] !== undefined && existing["Net_KG"] !== "" && toNum(existing["Net_KG"]) > 0 ? existing["Net_KG"] : "";
    var tareVal = existing && existing["Tare_KG"] !== undefined && existing["Tare_KG"] !== "" && toNum(existing["Tare_KG"]) > 0 ? existing["Tare_KG"] : "";
    var maxPltVal = existing && existing["Max_Per_Pallet"] !== undefined && existing["Max_Per_Pallet"] !== "" && toNum(existing["Max_Per_Pallet"]) > 0 ? existing["Max_Per_Pallet"] : "";
    var rateVal = existing && existing["Standard_Rate"] !== undefined && existing["Standard_Rate"] !== "" ? existing["Standard_Rate"] : "";
    var provVal = existing ? (existing["Provider_or_Rule"] || "") : "";
    var noteVal = existing ? (existing["Note"] || "") : "";

    var catPlaceholder = hintCat ? ("VD: " + hintCat) : "VD: INSURANCE";

    return '<div class="pr-batch-row p-3.5 rounded-xl border-[1.5px] border-[#186635] bg-[#9bccb8] space-y-2.5 shadow-[0_3px_0_#124d28]">' +
      '<div class="flex items-center justify-between">' +
        '<span class="text-xs font-bold text-[#07281c] uppercase tracking-wide">' + (isEdit ? "Chi tiết đầu mục phí" : ("Mục phí #" + rowIdx)) + '</span>' +
        (isEdit ? '' : '<button type="button" onclick="removePricingRateBatchRow(this)" class="btn-soft-delete px-2.5 py-0.5 text-[11px] font-semibold rounded-md cursor-pointer whitespace-nowrap">Xóa dòng</button>') +
      '</div>' +
      '<div class="grid grid-cols-2 sm:grid-cols-6 gap-2">' +
        '<div><label class="block text-[11px] font-semibold text-[#0b2418] mb-0.5">Nhóm phí *</label><input type="text" data-field="Fee_Category" list="dl-pr-category" required value="' + escAttrVal(catVal) + '" oninput="onPricingRateRowCategoryChange(this)" placeholder="' + escAttrVal(catPlaceholder) + '" class="w-full px-2.5 py-1.5 text-xs rounded-lg border-[1.5px] border-[#186635] bg-[#aed6c6] text-[#0b2418] font-bold uppercase" /></div>' +
        '<div><label class="block text-[11px] font-semibold text-[#0b2418] mb-0.5">Mã phí *</label><input type="text" data-field="Fee_Code" required value="' + escAttrVal(codeVal) + '" ' + (isEdit ? 'readonly class="w-full px-2.5 py-1.5 text-xs rounded-lg border-[1.5px] border-[#186635] bg-[#809c8f] text-[#0b2418] font-mono font-bold"' : 'placeholder="' + escAttrVal(sug.codePh) + '" class="w-full px-2.5 py-1.5 text-xs rounded-lg border-[1.5px] border-[#186635] bg-[#aed6c6] text-[#0b2418] font-mono font-bold"') + ' /></div>' +
        '<div><label class="block text-[11px] font-semibold text-[#0b2418] mb-0.5">Phạm vi / Cont</label><input type="text" data-field="Scope_or_ContType" list="dl-pr-scope" value="' + escAttrVal(scopeVal) + '" placeholder="' + escAttrVal(sug.scopePh) + '" class="w-full px-2.5 py-1.5 text-xs rounded-lg border-[1.5px] border-[#186635] bg-[#aed6c6] text-[#0b2418] font-semibold" /></div>' +
        '<div><label class="block text-[11px] font-semibold text-[#0b2418] mb-0.5">Đơn vị tính</label><input type="text" data-field="Unit_Basis" list="dl-pr-unit" value="' + escAttrVal(unitVal) + '" placeholder="' + escAttrVal(sug.unitPh) + '" class="w-full px-2.5 py-1.5 text-xs rounded-lg border-[1.5px] border-[#186635] bg-[#aed6c6] text-[#0b2418] font-semibold" /></div>' +
        '<div><label class="pr-rate-label block text-[11px] font-semibold text-[#0b2418] mb-0.5">' + escHtmlText(sug.rateLabel) + '</label><input type="number" step="0.001" min="0" data-field="Standard_Rate" value="' + escAttrVal(rateVal) + '" placeholder="' + escAttrVal(sug.ratePh) + '" class="w-full px-2.5 py-1.5 text-xs rounded-lg border-[1.5px] border-[#186635] bg-[#aed6c6] text-[#0b2418] text-right font-mono font-bold" /></div>' +
        '<div><label class="block text-[11px] font-semibold text-[#0b2418] mb-0.5">Nhà CC / Quy tắc</label><input type="text" data-field="Provider_or_Rule" value="' + escAttrVal(provVal) + '" placeholder="' + escAttrVal(sug.providerPh) + '" class="w-full px-2.5 py-1.5 text-xs rounded-lg border-[1.5px] border-[#186635] bg-[#aed6c6] text-[#0b2418] font-semibold" /></div>' +
      '</div>' +
      '<div class="grid grid-cols-1 sm:grid-cols-3 gap-2">' +
        '<div><label class="block text-[11px] font-semibold text-[#0b2418] mb-0.5">Tên tiếng Việt *</label><input type="text" data-field="Fee_Name_VIE" required value="' + escAttrVal(vieVal) + '" onblur="autoTranslatePrRowEng(this, false)" placeholder="' + escAttrVal(sug.viePh) + '" class="w-full px-2.5 py-1.5 text-xs rounded-lg border-[1.5px] border-[#186635] bg-[#aed6c6] text-[#0b2418] font-semibold" /></div>' +
        '<div><div class="flex items-center justify-between mb-0.5"><label class="block text-[11px] font-semibold text-[#0b2418]">Mô tả tiếng Anh (Hợp đồng)</label><button type="button" onclick="autoTranslatePrRowEng(this, true)" class="text-[10px] font-bold text-[#0f4a33] hover:underline cursor-pointer">Dịch sang Anh</button></div><input type="text" data-field="Contract_Text_ENG" value="' + escAttrVal(engVal) + '" placeholder="' + escAttrVal(sug.engPh) + '" class="w-full px-2.5 py-1.5 text-xs rounded-lg border-[1.5px] border-[#186635] bg-[#aed6c6] text-[#0b2418] font-semibold" /></div>' +
        '<div><label class="block text-[11px] font-semibold text-[#0b2418] mb-0.5">Ghi chú</label><input type="text" data-field="Note" value="' + escAttrVal(noteVal) + '" placeholder="VD: Ghi chú áp dụng nội bộ..." class="w-full px-2.5 py-1.5 text-xs rounded-lg border-[1.5px] border-[#186635] bg-[#aed6c6] text-[#0b2418] font-semibold" /></div>' +
      '</div>' +
      '<div class="pr-dim-box ' + (showDim ? '' : 'hidden ') + 'grid grid-cols-2 sm:grid-cols-4 gap-2 p-2.5 rounded-lg bg-[#809c8f] border-[1.5px] border-[#186635]">' +
        '<div><label class="block text-[11px] font-semibold text-[#0b2418] mb-0.5">Kích thước D×R×C (cm)</label><input type="text" data-field="Dim_CM" value="' + escAttrVal(dimVal) + '" oninput="recalcPrRowPallet(this)" placeholder="VD: 40x30x25" class="w-full px-2.5 py-1.5 text-xs rounded-lg border-[1.5px] border-[#186635] bg-[#aed6c6] text-[#0b2418] font-mono font-bold" /></div>' +
        '<div><label class="block text-[11px] font-semibold text-[#0b2418] mb-0.5">' + (hintCat === "CONTAINER" ? "Trọng tải tối đa (KG)" : "Khối lượng tịnh (KG)") + '</label><input type="number" step="0.01" min="0" data-field="Net_KG" value="' + escAttrVal(netVal) + '" oninput="recalcPrRowPallet(this)" placeholder="VD: 10" class="w-full px-2.5 py-1.5 text-xs rounded-lg border-[1.5px] border-[#186635] bg-[#aed6c6] text-[#0b2418] text-right font-mono font-bold" /></div>' +
        '<div><label class="block text-[11px] font-semibold text-[#0b2418] mb-0.5">' + (hintCat === "CONTAINER" ? "Thể tích (CBM)" : "Trọng lượng bì (KG)") + '</label><input type="number" step="0.01" min="0" data-field="Tare_KG" value="' + escAttrVal(tareVal) + '" oninput="recalcPrRowPallet(this)" placeholder="VD: 0.8" class="w-full px-2.5 py-1.5 text-xs rounded-lg border-[1.5px] border-[#186635] bg-[#aed6c6] text-[#0b2418] text-right font-mono font-bold" /></div>' +
        '<div><label class="block text-[11px] font-semibold text-[#0b2418] mb-0.5">Tối đa / Pallet (120×100)</label><input type="number" min="0" data-field="Max_Per_Pallet" value="' + escAttrVal(maxPltVal) + '" placeholder="Tự tính từ kích thước" class="w-full px-2.5 py-1.5 text-xs rounded-lg border-[1.5px] border-[#186635] bg-[#aed6c6] text-[#07281c] text-right font-mono font-bold" /></div>' +
      '</div>' +
    '</div>';
  }

  function onPricingRateRowCategoryChange(el) {
    var row = el ? el.closest(".pr-batch-row") : null;
    if (!row) return;
    var cat = String(el.value || "").trim().toUpperCase();
    var dimBox = row.querySelector(".pr-dim-box");
    if (dimBox) {
      if (cat === "PACKING" || cat === "CONTAINER") dimBox.classList.remove("hidden");
      else dimBox.classList.add("hidden");
    }
    var sug = suggestProviderByCategory(cat);
    var rateLabelEl = row.querySelector(".pr-rate-label");
    if (rateLabelEl) rateLabelEl.textContent = sug.rateLabel;

    // Chỉ cập nhật placeholder gợi ý — TUYỆT ĐỐI không tự ghi đè .value của ô nhập
    var phMap = {
      Fee_Code: sug.codePh,
      Scope_or_ContType: sug.scopePh,
      Unit_Basis: sug.unitPh,
      Standard_Rate: sug.ratePh,
      Provider_or_Rule: sug.providerPh,
      Fee_Name_VIE: sug.viePh,
      Contract_Text_ENG: sug.engPh
    };
    Object.keys(phMap).forEach(function (field) {
      var inp = row.querySelector('[data-field="' + field + '"]');
      if (inp && !inp.readOnly) {
        inp.placeholder = phMap[field];
      }
    });
  }

  function recalcPrRowPallet(el) {
    var row = el ? el.closest(".pr-batch-row") : null;
    if (!row) return;
    var catEl = row.querySelector('[data-field="Fee_Category"]');
    if (catEl && String(catEl.value || "").trim().toUpperCase() !== "PACKING") return;
    var dim = (row.querySelector('[data-field="Dim_CM"]') || {}).value || "";
    var net = (row.querySelector('[data-field="Net_KG"]') || {}).value || "";
    var tare = (row.querySelector('[data-field="Tare_KG"]') || {}).value || "";
    var maxPlt = computeAutoMaxPerPallet(dim, net, tare);
    var pltEl = row.querySelector('[data-field="Max_Per_Pallet"]');
    if (pltEl && maxPlt > 0) {
      pltEl.value = maxPlt;
    }
  }

  function autoTranslatePrRowEng(el, force) {
    var row = el ? el.closest(".pr-batch-row") : null;
    if (!row) return;
    var vieEl = row.querySelector('[data-field="Fee_Name_VIE"]');
    var engEl = row.querySelector('[data-field="Contract_Text_ENG"]');
    if (!vieEl || !engEl) return;
    if (force || !String(engEl.value || "").trim()) {
      engEl.value = translateVieToEngXnk(vieEl.value);
    }
  }

  function openPricingRateModal(feeCode) {
    var form = document.getElementById("form-pricing-rate");
    if (form) form.reset();
    var container = document.getElementById("pricing-rate-batch-rows");
    var editModeEl = document.getElementById("pr-edit-mode");
    var addFootBtn = document.getElementById("pr-add-batch-row-footer-btn");
    var subEl = document.getElementById("modal-pricing-rate-subtitle");
    var existing = feeCode ? (APP_DATA.pricingRates || []).find(function (r) { return String(r["Fee_Code"] || "").trim() === feeCode; }) : null;
    if (existing) {
      if (editModeEl) editModeEl.value = "1";
      if (addFootBtn) addFootBtn.classList.add("hidden");
      document.getElementById("modal-pricing-rate-title").textContent = "Chỉnh sửa đầu mục phí - " + feeCode;
      if (subEl) subEl.textContent = "Cập nhật thông số đầu mục phí, kích thước thùng tự tính Tối đa/Pallet.";
      if (container) container.innerHTML = buildPricingRateBatchRowHtml(1, existing, true);
    } else {
      if (editModeEl) editModeEl.value = "0";
      if (addFootBtn) addFootBtn.classList.remove("hidden");
      document.getElementById("modal-pricing-rate-title").textContent = "Thêm đầu mục phí mới (Hàng loạt)";
      if (subEl) {
        subEl.textContent = "Nhập thông số đầu mục phí mới theo gợi ý placeholder mờ; bấm 'Dịch sang Anh' để chuyển chuẩn điều khoản hợp đồng.";
      }
      if (container) container.innerHTML = buildPricingRateBatchRowHtml(1, null, false);
    }
    openModal("modal-pricing-rate");
  }

  function addPricingRateBatchRow() {
    var container = document.getElementById("pricing-rate-batch-rows");
    if (!container) return;
    var count = container.querySelectorAll(".pr-batch-row").length + 1;
    container.insertAdjacentHTML("beforeend", buildPricingRateBatchRowHtml(count, null, false));
  }

  function removePricingRateBatchRow(btn) {
    var container = document.getElementById("pricing-rate-batch-rows");
    if (!container) return;
    if (container.querySelectorAll(".pr-batch-row").length <= 1) {
      showToast("info", "Cần giữ lại ít nhất 1 dòng mục phí.");
      return;
    }
    var row = btn.closest(".pr-batch-row");
    if (row) row.remove();
  }

  function handleSavePricingRateModal(e) {
    e.preventDefault();
    var formEl = e.target;
    var isEdit = document.getElementById("pr-edit-mode") && document.getElementById("pr-edit-mode").value === "1";
    var rowEls = document.querySelectorAll("#pricing-rate-batch-rows .pr-batch-row");
    var rows = [];
    for (var i = 0; i < rowEls.length; i++) {
      var r = rowEls[i];
      var getV = function (f) {
        var el = r.querySelector('[data-field="' + f + '"]');
        return el ? el.value.trim() : "";
      };
      var code = getV("Fee_Code");
      var cat = getV("Fee_Category").toUpperCase();
      var vie = getV("Fee_Name_VIE");
      if (!code && !vie) continue;
      var showDim = cat === "PACKING" || cat === "CONTAINER";
      var netStr = getV("Net_KG");
      var tareStr = getV("Tare_KG");
      var pltStr = getV("Max_Per_Pallet");
      rows.push({
        Fee_Category: cat || (RATES_CATEGORY_FILTER !== "ALL" ? RATES_CATEGORY_FILTER : "OTHER"),
        Fee_Code: code,
        Scope_or_ContType: getV("Scope_or_ContType") || "ALL",
        Unit_Basis: getV("Unit_Basis"),
        Fee_Name_VIE: vie,
        Contract_Text_ENG: getV("Contract_Text_ENG") || translateVieToEngXnk(vie),
        Dim_CM: showDim ? getV("Dim_CM") : "",
        Net_KG: showDim && netStr !== "" ? toNum(netStr) : "",
        Tare_KG: showDim && tareStr !== "" ? toNum(tareStr) : "",
        Max_Per_Pallet: showDim && pltStr !== "" ? toNum(pltStr) : "",
        Standard_Rate: toNum(getV("Standard_Rate")),
        Provider_or_Rule: getV("Provider_or_Rule"),
        Note: getV("Note")
      });
    }
    if (rows.length === 0) {
      Swal.fire("Thiếu dữ liệu", "Vui lòng nhập Mã phí và Tên phí.", "warning");
      return;
    }
    setButtonLoading(formEl, true, "Đang lưu...");
    startTopProgress();
    if (isEdit) {
      var single = rows[0];
      google.script.run
        .withSuccessHandler(function () {
          stopTopProgress();
          setButtonLoading(formEl, false);
          closeModal("modal-pricing-rate");
          showToast("success", "Đã lưu bảng giá phụ phí " + single.Fee_Code);
          refreshAllData({ silent: true });
        })
        .withFailureHandler(function (err) {
          stopTopProgress();
          setButtonLoading(formEl, false);
          Swal.fire("Lỗi", err.message, "error");
        })
        .savePricingRateItem(single);
    } else {
      google.script.run
        .withSuccessHandler(function (res) {
          stopTopProgress();
          setButtonLoading(formEl, false);
          closeModal("modal-pricing-rate");
          showToast("success", "Đã lưu " + ((res && res.count) || rows.length) + " đầu mục phí vào Bảng giá phụ phí & bao bì.");
          refreshAllData({ silent: true });
        })
        .withFailureHandler(function (err) {
          stopTopProgress();
          setButtonLoading(formEl, false);
          Swal.fire("Lỗi", err.message, "error");
        })
        .savePricingRatesBatch(rows);
    }
  }

  function deletePricingRate(feeCode) {
    Swal.fire({
      title: "Xóa đầu mục phí " + feeCode + "?",
      icon: "warning",
      showCancelButton: true,
      confirmButtonColor: "#dc2626",
      confirmButtonText: "Xóa",
      cancelButtonText: "Hủy"
    }).then(function (r) {
      if (!r.isConfirmed) return;
      startTopProgress();
      google.script.run
        .withSuccessHandler(function () {
          stopTopProgress();
          showToast("success", "Đã xóa đầu mục phí " + feeCode);
          refreshAllData({ silent: true });
        })
        .withFailureHandler(function (err) {
          stopTopProgress();
          Swal.fire("Lỗi", err.message, "error");
        })
        .deletePricingRateItem(feeCode);
    });
  }

  function deepLinkToOrderStage(orderId, step) {
    var oid = String(orderId || "").trim();
    var stepNum = parseInt(step || 1, 10) || 1;
    if (stepNum === 1) {
      var inq = (APP_DATA.inquiries || []).find(function (i) { return String(i["Order_ID"] || "").trim() === oid; });
      var hasProp = (APP_DATA.proposals || []).some(function (p) {
        return String(p["Order ID"] || p["Order_ID"] || "").trim() === oid && !isProposalSuperseded(p);
      });
      if (hasProp && (!CURRENT_USER || String(CURRENT_USER.Department || "").toLowerCase().indexOf("xnk") === -1)) {
        switchTab("sales-quotation");
        return;
      }
      switchTab("xnk-pricing");
      var calcSel = document.getElementById("calc-order-id");
      if (calcSel && oid) {
        calcSel.value = oid;
        onPricingOrderChange();
      } else if (hasProp) {
        switchTab("sales-quotation");
      }
      return;
    }
    if (stepNum === 2 || stepNum === 3) {
      switchTab("xnk-contract");
      if (oid && (APP_DATA.orders || []).some(function (o) { return String(o["Order_ID"] || "").trim() === oid; })) {
        openContractFormModal(oid);
      }
      return;
    }
    if (stepNum === 4) {
      switchTab("xnk-documents");
      if (oid && (APP_DATA.orders || []).some(function (o) { return String(o["Order_ID"] || "").trim() === oid; })) {
        openExportDocPreview(oid, "INVOICE");
      }
      return;
    }
    switchTab("xnk-documents");
    if (oid && (APP_DATA.orders || []).some(function (o) { return String(o["Order_ID"] || "").trim() === oid; })) {
      openExportDocPreview(oid, "BL");
    }
  }

  // =========================================================================
  // 8. DÒNG THỜI GIAN XỬ LÝ ĐƠN HÀNG (ĐỒNG BỘ 5 MỐC NGHIỆP VỤ CHUẨN)
  // =========================================================================
  function openOrderTimelineModal(orderIdOrContract) {
    var key = String(orderIdOrContract || "").trim();
    var matchedOrder = (APP_DATA.orders || []).find(function (o) {
      return o["Order_ID"] === key || o["Contract_No."] === key;
    });
    var orderId = matchedOrder ? matchedOrder["Order_ID"] : key;
    var inq = (APP_DATA.inquiries || []).find(function (i) { return i["Order_ID"] === orderId; });
    var allProps = (APP_DATA.proposals || []).filter(function (p) { return (p["Order ID"] || p["Order_ID"]) === orderId; });
    var activeProp = allProps.slice().reverse().find(function (p) { return !isProposalSuperseded(p); }) || allProps[allProps.length - 1];
    var cusId = (inq && inq["Consignee_ID"]) || (matchedOrder && matchedOrder["Consignee_ID"]) || "";
    var cus = (APP_DATA.consignees || []).find(function (c) { return c["Consignee_ID"] === cusId || c["Consignee_Name"] === cusId; });

    var inqStatus = normalizeWorkflowStatus((inq && inq["Inquiry_Status"]) || "");
    var fulStatus = matchedOrder ? translateFulfillmentStatus(matchedOrder["Fulfillment_Status"]) : "";
    var isLocked = matchedOrder ? isContractLockedFlag(matchedOrder) : false;
    var stageNum = matchedOrder ? getWorkflow5StageNumber(fulStatus, true, isLocked) : 1;

    var isQuoted = inqStatus === WORKFLOW_STATUS.QUOTATION_DRAFTED || isQuotationSentStatus(inqStatus) || isConfirmedStatus(inqStatus) || Boolean(matchedOrder);
    var stage1ProdSummary = inq ? formatOrderItemsSummaryText(inq) : "";
    if (!stage1ProdSummary || stage1ProdSummary === "Chưa có sản phẩm") {
      var rawProdFallback = inq ? (String(inq["Tên sản phẩm"] || "").trim() || String(inq["Mã sản phẩm"] || inq["SKU_Code"] || "").trim()) : "";
      var safeWeight = inq ? fmtNumber(inq["Net_Weight_KGs"]) : "0";
      stage1ProdSummary = (rawProdFallback && rawProdFallback !== "undefined")
        ? (rawProdFallback + " · " + safeWeight + " KG")
        : ("Đơn hàng RFQ · " + safeWeight + " KG");
    }

    var stages = [
      {
        step: 1,
        title: "1. Chờ báo giá (RFQ) & Tính giá XNK",
        subtitle: "Tiếp nhận RFQ, chọn lịch tàu, đóng gói & bảo hiểm",
        status: (isQuoted || matchedOrder) ? "done" : (inq ? "active" : "pending"),
        timestamp: (inq && inq["Timestamp"]) || "—",
        actor: (activeProp && activeProp["XNK_Rep"]) || (inq && inq["Sale_rep"]) || "Sales / XNK",
        detail: activeProp ? ((activeProp["Quotation_No"] || activeProp["Price_Version"] || "V1") + " · " + (activeProp["Recommended Incoterm"] || "-") + " " + fmtUSD(activeProp["Final_Selling Price"])) : stage1ProdSummary
      },
      {
        step: 2,
        title: "2. Chờ ký HĐ & Cọc / L/C",
        subtitle: "Khởi tạo nháp Hợp đồng ngoại thương, ký khóa số liệu & nhận cọc/LC",
        status: stageNum >= 3 ? "done" : (matchedOrder ? "active" : "pending"),
        timestamp: (matchedOrder && (matchedOrder["Signed_Date"] || matchedOrder["Contract_Date"])) || "—",
        actor: (matchedOrder && matchedOrder["In_Charge_Staff"]) || "Sales / XNK",
        detail: matchedOrder ? ((matchedOrder["Contract_No."] || "") + " · " + (matchedOrder["Payment_Terms"] || "-")) : "Chờ chốt HĐ"
      },
      {
        step: 3,
        title: "3. Chờ Booking & Đóng Cont",
        subtitle: "Đặt chỗ tàu, chuẩn bị hàng tại kho, hun trùng & đóng container",
        status: stageNum >= 4 ? "done" : (stageNum === 3 ? "active" : "pending"),
        timestamp: "—",
        actor: (matchedOrder && matchedOrder["In_Charge_Staff"]) || "XNK",
        detail: (matchedOrder && matchedOrder["Cont_Seal_List"]) ? matchedOrder["Cont_Seal_List"] : "Kho / Booking tàu"
      },
      {
        step: 4,
        title: "4. Đang làm chứng từ (Inv / P/L / C/O / HQ)",
        subtitle: "Invoice, Packing List, VNACCS, Kiểm dịch & cấp C/O",
        status: stageNum >= 5 ? "done" : (stageNum === 4 ? "active" : "pending"),
        timestamp: "—",
        actor: (matchedOrder && matchedOrder["In_Charge_Staff"]) || "XNK",
        detail: (matchedOrder && matchedOrder["CO_Form"]) ? ("C/O " + matchedOrder["CO_Form"]) : "Hồ sơ chứng từ hải quan"
      },
      {
        step: 5,
        title: "5. Chờ vận đơn (B/L) & Quyết toán",
        subtitle: "Xác nhận On Board, chốt Bill of Lading & thu tiền xuất khẩu",
        status: stageNum >= 6 ? "done" : (stageNum === 5 ? "active" : "pending"),
        timestamp: "—",
        actor: (matchedOrder && matchedOrder["In_Charge_Staff"]) || "Admin / XNK",
        detail: stageNum >= 6 ? COMPLETED_ORDER_STATUS : ((matchedOrder && matchedOrder["Ves_Voy"]) ? (matchedOrder["Ves_Voy"] + " · BK " + (matchedOrder["BK_No"] || "—")) : "Chờ phát hành B/L")
      }
    ];

    document.getElementById("timeline-modal-title").textContent = "Dòng thời gian đơn hàng · " + orderId;
    document.getElementById("timeline-modal-subtitle").textContent =
      "Khách hàng: " + ((cus && cus["Consignee_Name"]) || cusId || "Khách hàng") + " · Hợp đồng: " + ((matchedOrder && matchedOrder["Contract_No."]) || "Chưa phát hành");

    var safeOrderArg = String(orderId || "").replace(/'/g, "\\'");
    var bodyEl = document.getElementById("timeline-modal-body");
    bodyEl.innerHTML = '<div class="relative space-y-3 pl-2">' + stages.map(function (st, i) {
      var dotCls = st.status === "done"
        ? "bg-[#0f4a33] text-[#fff5d6] border-[#186635]"
        : (st.status === "active" ? "bg-[#f4d98a] text-[#07281c] border-[#186635] ring-4 ring-[#f4d98a]/35" : "bg-[#809c8f] text-[#1e4231] border-[#186635]");
      var cardCls = st.status === "done"
        ? "bg-[#9bccb8] border-[#186635] hover:bg-[#aed6c6]"
        : (st.status === "active" ? "bg-[#f4d98a]/40 border-[#186635] hover:bg-[#f4d98a]/55" : "bg-[#809c8f] border-[#186635]/70 opacity-85 hover:opacity-100");
      var statusTag = st.status === "done"
        ? renderStatusBadge("Hoàn thành", "success")
        : (st.status === "active" ? renderStatusBadge("Đang xử lý", "warning") : renderStatusBadge("Chờ bước trước", "neutral"));
      var lineHtml = i < stages.length - 1 ? '<span class="timeline-step-line"></span>' : '';

      return '<div class="relative flex gap-3.5 items-start">' +
        '<div class="relative shrink-0 mt-1">' +
          lineHtml +
          '<div class="relative z-10 w-8 h-8 rounded-full border-2 flex items-center justify-center text-xs font-bold font-mono ' + dotCls + '">' + st.step + '</div>' +
        '</div>' +
        '<button type="button" onclick="closeModal(\'modal-order-timeline\');deepLinkToOrderStage(\'' + safeOrderArg + '\',' + st.step + ')" class="flex-1 text-left rounded-xl border-[1.5px] p-3.5 transition-all cursor-pointer shadow-[0_3px_0_#124d28] ' + cardCls + '">' +
          '<div class="flex flex-wrap items-center justify-between gap-2">' +
            '<div class="font-bold text-[#0b2418] text-sm">' + st.title + '</div>' +
            '<div class="flex items-center gap-2">' + statusTag + '<span class="text-[11px] font-bold text-[#0f4a33]">Mở ↗</span></div>' +
          '</div>' +
          '<div class="text-xs text-[#1e4231] font-medium mt-0.5">' + st.subtitle + '</div>' +
          '<div class="flex flex-wrap items-center justify-between gap-2 mt-2 pt-2 border-t border-[#186635]/35 text-xs">' +
            '<span class="font-bold text-[#07281c]">' + escHtmlText(st.detail) + '</span>' +
            '<span class="font-mono font-semibold text-[#1e4231]">' + escHtmlText(st.actor + ' · ' + st.timestamp) + '</span>' +
          '</div>' +
        '</button>' +
      '</div>';
    }).join("") + '</div>';

    openModal("modal-order-timeline");
  }

  document.addEventListener("DOMContentLoaded", function () {
    initBrandLogos();
    lucide.createIcons();
    var saved = sessionStorage.getItem("nsx_user");
    if (saved) {
      try {
        CURRENT_USER = JSON.parse(saved);
        enterApp();
      } catch (e) {
        sessionStorage.removeItem("nsx_user");
      }
    }
  });
</script>
